<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE7A1" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#8B6914" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>
  </defs>

  <!-- Тёмный фон со скруглёнными углами -->
  <rect width="512" height="512" rx="90" fill="#111111" />

  <!-- Левое здание (среднее) -->
  <rect x="120" y="180" width="70" height="230" fill="url(#gold)" stroke="#5c4611" stroke-width="2"/>
  <!-- окна -->
  <g fill="#111111">
    <rect x="130" y="195" width="50" height="8"/>
    <rect x="130" y="213" width="50" height="8"/>
    <rect x="130" y="231" width="50" height="8"/>
    <rect x="130" y="249" width="50" height="8"/>
    <rect x="130" y="267" width="50" height="8"/>
    <rect x="130" y="285" width="50" height="8"/>
    <rect x="130" y="303" width="50" height="8"/>
    <rect x="130" y="321" width="50" height="8"/>
    <rect x="130" y="339" width="50" height="8"/>
    <rect x="130" y="357" width="50" height="8"/>
    <rect x="130" y="375" width="50" height="8"/>
  </g>

  <!-- Правое здание (высокое) -->
  <rect x="205" y="120" width="75" height="290" fill="url(#goldLight)" stroke="#5c4611" stroke-width="2"/>
  <!-- окна -->
  <g fill="#111111">
    <rect x="216" y="135" width="53" height="9"/>
    <rect x="216" y="156" width="53" height="9"/>
    <rect x="216" y="177" width="53" height="9"/>
    <rect x="216" y="198" width="53" height="9"/>
    <rect x="216" y="219" width="53" height="9"/>
    <rect x="216" y="240" width="53" height="9"/>
    <rect x="216" y="261" width="53" height="9"/>
    <rect x="216" y="282" width="53" height="9"/>
    <rect x="216" y="303" width="53" height="9"/>
    <rect x="216" y="324" width="53" height="9"/>
    <rect x="216" y="345" width="53" height="9"/>
    <rect x="216" y="366" width="53" height="9"/>
  </g>

  <!-- Основание/земля -->
  <rect x="100" y="410" width="312" height="10" rx="5" fill="url(#gold)" />

  <!-- Буквы ВК -->
  <text x="330" y="300" font-family="Arial, sans-serif" font-size="130" font-weight="900" fill="url(#gold)" text-anchor="middle">ВК</text>
</svg>
