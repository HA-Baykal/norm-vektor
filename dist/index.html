монта герметичности новая порция снова уйдёт. Кроме того, заправка «по давлению» без учёта температуры и типа фреона может привести к переливу и нагрузке на компрессор. Для точной заправки используют весы и данные производителя."},{type:"h",text:"Когда мощности действительно мало"},{type:"p",text:"Модель 07 рассчитана ориентировочно на комнату до 20 м², 09 — до 25 м², 12 — до 35 м². Южные окна, верхний этаж, высокие потолки, техника и несколько человек увеличивают теплопритоки. В таких условиях исправный, но слабый блок не сможет быстро охладить помещение."},{type:"h",text:"Цены на обслуживание в Иркутске"},{type:"p",text:"Диагностика стоит от 3 000 ₽ и засчитывается в ремонт, чистка обоих блоков — от 4 000 ₽, заправка фреона — от 4 000 ₽. Точную сумму называем после проверки: иногда достаточно бесплатной промывки фильтров."},{type:"h",text:"Как предотвратить повторение"},{type:"p",text:"Промывайте фильтры каждые 2–4 недели активной работы и заказывайте полное обслуживание раз в год. Не закрывайте наружный блок декоративным экраном без расчёта свободного прохода воздуха."},{type:"p",text:"Кондиционер по-прежнему не холодит после промывки фильтров? Позвоните +7 (914) 914-66-06 — «Вектор Комфорта» измерит параметры, найдёт причину и согласует ремонт до начала работ."}],faq:[{q:"Почему кондиционер дует, но не холодит?",a:"Чаще всего забиты фильтры внутреннего блока или радиатор наружного. Промойте фильтры и наружный блок — в половине случаев проблема уходит. Если нет — диагностируем утечку фреона или компрессор."},{q:"Сколько стоит починить кондиционер, который не холодит?",a:"Чистка фильтров — бесплатно своими руками. Диагностика — от 3 000 ₽ (засчитывается в ремонт), чистка обоих блоков — от 4 000 ₽, заправка фреона — от 4 000 ₽."},{q:"Как понять, что утёк фреон?",a:"Признаки: слабое охлаждение, обмерзание медных трубок или кранов наружного блока, шипение на соединениях. Точную причину показывает манометрический замер и течеискатель."}]},"zapah-iz-konditsionera":{date:"2026-04-10",title:"Запах из кондиционера: откуда плесень и как убрать",category:"Кондиционеры",summary:"Запах при включении — это плесень и бактерии в дренажном поддоне и на теплообменнике внутреннего блока, а не фреон (он без запаха). Убирается промывкой фильтров и профессиональной чисткой с антибактериальной обработкой от 4 000 ₽.",content:[{type:"p",text:"Сырой, затхлый или кислый запах появляется, когда внутри влажного блока накапливаются пыль и органические загрязнения. Пока кондиционер работает, теплообменник покрыт конденсатом — это благоприятная среда для биоплёнки. Освежитель воздуха причину не убирает."},{type:"h",text:"Почему это не фреон"},{type:"p",text:"Бытовой хладагент не пахнет плесенью. При утечке кондиционер прежде всего теряет мощность и может обмерзать. Запах почти всегда связан с внутренним блоком, дренажом или, реже, подсосом воздуха из канализации при неправильном подключении."},{type:"h",text:"Где накапливается грязь"},{type:"list",items:["На сетчатых фильтрах и рёбрах испарителя.","На крыльчатке вентилятора, куда трудно добраться без разборки.","В поддоне для конденсата и дренажной трубке.","В сифоне, если дренаж подключён к канализации неправильно."]},{type:"h",text:"Что можно сделать самостоятельно"},{type:"p",text:"Отключите питание, снимите фильтры, промойте их тёплой водой без агрессивной химии и высушите. Проверьте, свободно ли уходит вода по дренажу. Не распыляйте хлор и бытовые ароматизаторы на теплообменник: ими потом придётся дышать."},{type:"h",text:"Как проходит профессиональная чистка"},{type:"list",items:["Разбираем корпус и защищаем стену сервисным чехлом.","Промываем испаритель, крыльчатку и поддон безопасным составом.","Прочищаем дренаж и проверяем слив водой.","Проводим антибактериальную обработку и собираем блок.","Проверяем температуру и отсутствие постороннего запаха."]},{type:"h",text:"Опасно ли откладывать чистку"},{type:"p",text:"Споры плесени и частицы биоплёнки попадают в комнатный воздух. Это особенно нежелательно для детей, аллергиков и людей с астмой. Одновременно грязь снижает поток воздуха, повышает шум и может привести к обмерзанию."},{type:"h",text:"Цена и периодичность"},{type:"p",text:"Профессиональная чистка обоих блоков с обработкой стоит от 4 000 ₽. Фильтры промывайте каждые 2–4 недели в сезон, глубокую чистку заказывайте раз в год, а при высокой пыли или постоянной работе — чаще."},{type:"h",text:"Как сушить внутренний блок"},{type:"p",text:"Если модель поддерживает Self Clean или X-Fan, не отключайте эту функцию: после охлаждения вентилятор подсушивает теплообменник. Без неё можно на 20–30 минут включить режим вентиляции перед длительным простоем."},{type:"p",text:"Появился запах при запуске? Позвоните +7 (914) 914-66-06 — «Вектор Комфорта» разберёт и промоет блок, обработает испаритель и дренаж и вернёт чистый воздух без маскировки ароматизаторами."}],faq:[{q:"Почему кондиционер воняет при включении?",a:"Внутри блока размножилась плесень: конденсат на теплообменнике и дренажном поддоне создаёт влажную среду. Фреон ни при чём — он не имеет запаха."},{q:"Как убрать запах из кондиционера?",a:"Сначала промойте фильтры. Если запах остался — нужна профессиональная чистка теплообменника и дренажа с антибактериальной обработкой, от 4 000 ₽."},{q:"Опасен ли запах из кондиционера для здоровья?",a:"Да, это споры плесени и бактерии, которые попадают в воздух. Особенно опасно для аллергиков, детей и людей с астмой. Чистка раз в год решает проблему."}]},"kapaet-voda-iz-konditsionera":{date:"2026-04-05",title:"Капает вода из кондиционера: забитый дренаж и что делать",category:"Кондиционеры",summary:"Вода из внутреннего блока — это забитый дренаж или неправильный уклон дренажной трубки: конденсат не находит выход и переливается внутрь. Решается чисткой дренажа; если причина в монтаже — перекладкой трубки с уклоном.",content:[{type:"p",text:"Во время охлаждения на теплообменнике образуется конденсат. Он должен собираться в поддоне и самотёком уходить по дренажной трубке. Если вода пошла по стене или из жалюзи, отключите систему: нормальной такую работу считать нельзя."},{type:"h",text:"Самая частая причина — засор"},{type:"p",text:"Пыль, слизь и насекомые перекрывают узкую трубку, вода поднимается в поддоне и переливается через край. Иногда засор находится у самого выхода на улице, иногда — глубоко в канале. Простая чистка возвращает нормальный слив."},{type:"h",text:"Ошибки уклона при монтаже"},{type:"p",text:"Дренаж должен идти вниз без подъёмов и провисаний. Даже небольшой обратный уклон создаёт водяной карман. Если трассу уложили неправильно, продувка даст временный эффект — трубку нужно переложить."},{type:"h",text:"Другие причины протечки"},{type:"list",items:["Теплообменник обмерзает из-за грязных фильтров, а после остановки лёд быстро тает.","Нехватка фреона снижает температуру испарителя и вызывает обмерзание.","Поддон треснул или сместился после неаккуратной разборки.","Дренажная трубка слетела со штуцера.","Помпа вышла из строя в системе, где самотёк невозможен."]},{type:"h",text:"Что делать сразу"},{type:"list",items:["Выключите кондиционер и обесточьте его автоматом.","Уберите воду от розетки, стены и мебели.","Промойте доступные фильтры и проверьте наружный конец дренажа.","Не разбирайте электрическую часть мокрого блока самостоятельно."]},{type:"h",text:"Почему нельзя откладывать ремонт"},{type:"p",text:"Вода может попасть на плату управления, испортить отделку и создать очаг плесени. Ремонт электроники обходится в 5 000–15 000 ₽, тогда как чистка дренажа начинается от 4 000 ₽."},{type:"h",text:"Как мастер устраняет протечку"},{type:"p",text:"Проверяем поддон и соединения, прочищаем канал, проливаем его водой и измеряем уклон. Если видим обмерзание, очищаем теплообменник и диагностируем давление хладагента. При монтажной ошибке согласуем перекладку дренажа."},{type:"h",text:"Профилактика"},{type:"p",text:"Промывайте фильтры каждые 2–4 недели и обслуживайте блок до начала жаркого сезона. При монтаже не соглашайтесь на дренаж без постоянного уклона только ради более красивого короба."},{type:"p",text:"Кондиционер уже капает? Позвоните +7 (914) 914-66-06 — «Вектор Комфорта» быстро проверит дренаж, устранит засор или исправит уклон до того, как вода повредит ремонт."}],faq:[{q:"Почему с внутреннего блока капает вода?",a:"Забит дренажный канал или дренажная трубка проложена без уклона. Реже — обмерзание теплообменника из-за грязных фильтров или нехватки фреона."},{q:"Опасно ли, если кондиционер капает?",a:"Да. Вода заливает электронику (ремонт 5 000–15 000 ₽) и провоцирует плесень. Лучше устранить сразу — чистка дренажа стоит от 4 000 ₽."},{q:"Можно ли самому прочистить дренаж?",a:"Если есть доступ к трубке, её можно аккуратно продуть. Но если вода капает из корпуса, а не из трубки — лучше вызвать мастера, чтобы не повредить блок."}]},"tipy-konditsionerov-split-kassetnyy-kanalnyy":{date:"2026-03-28",title:"Типы кондиционеров: сплит, мультисплит, кассетный и канальный — что выбрать",category:"Кондиционеры",summary:"Для квартиры нужна настенная сплит-система; если комнат несколько — мультисплит с одним наружным блоком. Кассетные и канальные ставят в офисы и магазины со скрытым монтажом. Мобильный кондиционер — компромисс без монтажа.",content:[{type:"p",text:"Кондиционеры отличаются не только мощностью и брендом, но и способом раздачи воздуха. Выбор зависит от числа комнат, потолков, требований фасада и возможности проложить коммуникации. Разберём без маркетинга, где каждый тип действительно уместен."},{type:"h",text:"Настенная сплит-система"},{type:"p",text:"Один внутренний блок работает с одним наружным. Это самый понятный, тихий и ремонтопригодный вариант для спальни, гостиной или студии до 60 м². Монтаж в Иркутске стоит от 18 400 ₽ с трассой до 3 м, бурением и вакуумированием."},{type:"h",text:"Мультисплит для нескольких комнат"},{type:"p",text:"К одному наружному блоку подключают два и более внутренних. Решение используют, если управляющая компания ограничивает количество блоков на фасаде. Оно аккуратнее снаружи, но трассы длиннее, монтаж дороже, а при поломке наружного модуля без холода остаются все комнаты."},{type:"h",text:"Кассетный кондиционер"},{type:"p",text:"Внутренний блок прячется за подвесным потолком, снаружи остаётся квадратная панель. Воздух расходится в четыре стороны, поэтому кассета удобна в открытом офисе, магазине или кафе. Нужны запотолочное пространство и дренажная помпа."},{type:"h",text:"Канальная система"},{type:"p",text:"Блок скрыт за потолком и подаёт воздух по сети воздуховодов через решётки. Можно обслуживать несколько помещений, но проектировать систему нужно до чистовой отделки: рассчитываются расход, сопротивление сети, шумоглушение и доступ к фильтрам."},{type:"h",text:"Мобильный моноблок"},{type:"p",text:"Весь холодильный контур находится в комнате, а горячий воздух выводится гибкой трубой в окно. Монтаж не нужен, но компрессор шумит рядом с человеком, а через неплотности подсасывается тёплый воздух. Это временный вариант для съёмного жилья."},{type:"list",items:["Одна жилая комната — настенный сплит.","Несколько комнат и ограничение на фасаде — мультисплит.","Открытый коммерческий зал с подвесным потолком — кассетный.","Несколько зон со скрытыми решётками — канальный.","Нельзя сверлить и нужен временный холод — мобильный."]},{type:"h",text:"Как не ошибиться с мощностью"},{type:"p",text:"Ориентир 1 кВт холода на 10 м² подходит только для стандартной комнаты. Южные окна, высокий потолок, люди и техника добавляют теплопритоки. Для канальных и кассетных систем нужен полноценный расчёт, а не подбор только по площади."},{type:"p",text:"Проверяем места блоков, длину трасс, электрическую мощность, отвод конденсата, доступ для обслуживания и правила фасада. Так сравниваем не только цену оборудования, но и итоговую стоимость владения."},{type:"p",text:"Не знаете, какой тип подойдёт объекту? Позвоните +7 (914) 914-66-06 — «Вектор Комфорта» осмотрит помещение, рассчитает теплопритоки и предложит систему без переплаты за лишнюю сложность."}],faq:[{q:"Какой кондиционер выбрать для квартиры?",a:"Настенную сплит-систему — это стандарт для квартир до 60 м². Для нескольких комнат с ограниченным фасадом подойдёт мультисплит с одним наружным блоком."},{q:"Чем кассетный кондиционер отличается от канального?",a:"Кассетный ставится в подвесной потолок и раздаёт воздух в четыре стороны из одной точки. Канальный прячется за потолком и раздаёт воздух по комнатам через воздуховоды."},{q:"Можно ли обойтись мобильным кондиционером?",a:"Мобильный не требует монтажа, но он шумнее, слабее и дороже в эксплуатации. Для постоянного использования в квартире лучше сплит-система."}]},"mobilnyy-konditsioner-ili-split-sistema":{date:"2026-03-22",title:"Мобильный кондиционер или сплит-система: что выбрать",category:"Кондиционеры",summary:"Мобильный кондиционер слабее, шумнее и дороже в эксплуатации, но не требует монтажа. Сплит-система холоднее, тише и служит вдвое дольше. Для постоянного использования в квартире — только сплит.",content:[{type:"p",text:"Мобильный моноблок часто покупают как быстрый способ пережить жару: поставил у окна, вывел гофру и включил. Но по комфорту и эффективности он заметно уступает сплит-системе. Сравниваем реальные условия, а не только цену на витрине."},{type:"h",text:"Как работает мобильный кондиционер"},{type:"p",text:"Компрессор и оба теплообменника находятся в одном корпусе. Прибор охлаждает часть комнатного воздуха, а нагретую часть выбрасывает через гофру. Из-за разрежения через двери и щели затягивается тёплый воздух с улицы и из соседних комнат."},{type:"h",text:"Почему сплит эффективнее"},{type:"p",text:"Компрессор и горячий теплообменник вынесены наружу, поэтому тепло не остаётся в комнате. Внутренний блок только тихо прогоняет воздух через испаритель. Инвертор плавно снижает мощность после достижения температуры и расходует меньше электричества."},{type:"h",text:"Сравнение по главным параметрам"},{type:"list",items:["Шум: мобильный обычно 45–65 дБ, тихий инверторный сплит — 19–30 дБ.","Эффективность: у сплита нет постоянного подсоса горячего воздуха.","Срок службы: качественный сплит при обслуживании работает примерно вдвое дольше.","Монтаж: мобильному нужна только герметичная вставка в окно, сплит требует профессиональной установки.","Перемещение: моноблок можно перекатывать, но в каждой комнате нужен вывод гофры."]},{type:"h",text:"Когда мобильный вариант оправдан"},{type:"p",text:"В съёмной квартире, временном офисе или здании, где собственник запрещает сверление и наружный блок, моноблок решает задачу без капитальных работ. Важно герметично закрыть проём вокруг гофры, иначе холод будет уходить."},{type:"h",text:"Почему он плохо подходит для спальни"},{type:"p",text:"Компрессор работает рядом с кроватью, периодически включается и выключается, а конденсат нужно отводить или сливать. Даже паспортные 45 дБ заметны ночью. У сплита источник основного шума находится за стеной."},{type:"h",text:"Цена установки сплит-системы"},{type:"p",text:"Монтаж под ключ начинается от 18 400 ₽: внутренний и наружный блоки, трасса до 3 м, алмазное бурение, вакуумирование и запуск. Гарантия на работы — 1 год. Дополнительная трасса и высотные работы считаются заранее."},{type:"h",text:"Наш вывод"},{type:"p",text:"Для постоянного жилья выбирайте сплит: он тише, экономичнее и реально держит заданную температуру. Мобильный покупайте только тогда, когда монтаж запрещён или система нужна на один сезон."},{type:"p",text:"Хотите сравнить итоговый бюджет? Позвоните +7 (914) 914-66-06 — «Вектор Комфорта» подберёт сплит под площадь и рассчитает монтаж, чтобы решение можно было честно сопоставить с мобильным кондиционером."}],faq:[{q:"Что лучше — мобильный кондиционер или сплит-система?",a:"Сплит-система: она тише, мощнее, экономичнее и служит вдвое дольше. Мобильный — компромисс для съёмного жилья, где нельзя делать монтаж."},{q:"Почему мобильный кондиционер хуже холодит?",a:"Он забирает воздух из комнаты и часть его выбрасывает наружу, а на место затягивается тёплый уличный воздух. КПД низкий, реальная площадь охлаждения меньше заявленной."},{q:"Сколько стоит монтаж сплит-системы?",a:"От 18 400 ₽ под ключ: установка блоков, трасса 3 м, алмазное бурение, вакуумирование и пуско-наладка. Гарантия 1 год на работы."}]},"pochemu-shumit-konditsioner":{date:"2026-03-16",title:"Почему шумит кондиционер: норма и когда бить тревогу",category:"Кондиционеры",summary:"Гул при работе — это норма (до 35 дБ у инверторов), но свист, треск и дребезг — признаки проблемы: мусор в вентиляторе, изношенные подшипники или вибрация наружного блока. Для тихой спальни выбирайте инверторные модели с уровнем 19–23 дБ.",content:[{type:"p",text:"Абсолютно бесшумных кондиционеров нет: вентилятор перемещает воздух, пластик меняет размер при охлаждении, компрессор создаёт вибрацию. Важно отличить ровный рабочий шум от нового свиста, треска или металлического дребезга."},{type:"h",text:"Какой шум считается нормальным"},{type:"p",text:"Для спальни комфортны 19–30 дБ на минимальной скорости, для гостиной допустимо до 35 дБ. Паспортное значение измеряют в лаборатории, поэтому реальный звук зависит от режима, акустики комнаты и качества крепления."},{type:"h",text:"О чём говорят разные звуки"},{type:"list",items:["Ровное шуршание воздуха — нормальная работа вентилятора.","Короткие щелчки пластика при старте — температурное расширение.","Свист — загрязнение, щель в корпусе или проблема потока хладагента.","Периодический треск — мусор в крыльчатке либо задевающая деталь.","Металлический гул снаружи — вибрация кронштейна, кожуха или компрессора."]},{type:"h",text:"Почему старый блок становится громче"},{type:"p",text:"На лопастях крыльчатки оседает неравномерный слой пыли, нарушается баланс. Подшипники изнашиваются, винты ослабевают, а резиновые виброопоры дубеют. Часто после глубокой чистки и протяжки крепежа шум возвращается к норме."},{type:"h",text:"Что проверить самостоятельно"},{type:"list",items:["Промойте фильтры и убедитесь, что они установлены без перекоса.","Уберите предметы, касающиеся корпуса и декоративного короба.","Проверьте, закрыта ли передняя панель.","Послушайте отдельно внутренний и наружный блок, не разбирая их."]},{type:"h",text:"Когда кондиционер нужно выключить"},{type:"p",text:"Остановите систему при запахе гари, сильном металлическом скрежете, ударах вентилятора или резком росте вибрации. Продолжение работы может повредить двигатель, крыльчатку или плату."},{type:"h",text:"Как выбрать тихую модель"},{type:"p",text:"Для спальни смотрите минимальный уровень 19–23 дБ, инверторное управление и вентилятор на подшипниках качения. Но даже дорогая модель загудит, если наружный блок закреплён на слабом основании или трасса касается конструкции."},{type:"h",text:"Сервис и монтаж"},{type:"p",text:"Чистка обоих блоков начинается от 4 000 ₽. При монтаже от 18 400 ₽ мы проверяем основание, используем подходящие кронштейны, вакуумируем трассу и тестируем систему на всех скоростях."},{type:"p",text:"Появился новый шум или вибрация? Позвоните +7 (914) 914-66-06 — «Вектор Комфорта» найдёт источник, почистит крыльчатку, подтянет крепления или согласует замену изношенной детали."}],faq:[{q:"Какой уровень шума кондиционера считается нормальным?",a:"19–30 дБ для спальни, до 35 дБ для гостиной. Инверторные модели работают на уровне 19–23 дБ — это тише шёпота."},{q:"Почему кондиционер стал шуметь сильнее?",a:"Чаще всего загрязнилась крыльчатка, износились подшипники вентилятора или расшаталось крепление наружного блока. Первое лечится чисткой, остальное — заменой и подтяжкой."},{q:"Какой кондиционер самый тихий?",a:"Инверторные модели с уровнем шума 19–23 дБ и вентилятором на подшипниках качения. Для спальни это оптимальный выбор."}]},"brizer-chto-eto":{date:"2026-03-10",title:"Бризер: что это такое и зачем он нужен",category:"Вентиляция",summary:"Бризер — это компактная приточная вентиляция: прибор в стене забирает уличный воздух, очищает его фильтрами (включая HEPA) и при необходимости подогревает. Он подаёт свежий воздух без открывания окна — без сквозняков, пыли и уличного шума.",content:[{type:"p",text:"После установки герметичных окон квартира перестаёт получать прежний приток через щели. В спальне растёт CO₂, утром болит голова, а открытое окно приносит шум и пыль. Бризер решает именно задачу контролируемого свежего воздуха."},{type:"h",text:"Как устроен бризер"},{type:"p",text:"В наружной стене алмазным бурением делают канал. Вентилятор забирает воздух с улицы, последовательно пропускает его через фильтры и подаёт в комнату. Зимой электрический нагреватель доводит приток до комфортной температуры."},{type:"h",text:"Что фильтрует прибор"},{type:"list",items:["Фильтр грубой очистки G4 задерживает пух, крупную пыль и насекомых.","HEPA-фильтр улавливает мелкие частицы и часть аллергенов.","Угольный фильтр в оснащённых моделях снижает запахи и часть газовых загрязнений.","Набор ступеней зависит от модели — проверяйте комплектацию до покупки."]},{type:"h",text:"Чем бризер не является"},{type:"p",text:"Он не охлаждает воздух как кондиционер и обычно не удаляет отработанный воздух. Для движения потока должны работать вытяжные каналы кухни и санузла. Если летом нужна прохлада, к бризеру добавляют сплит-систему."},{type:"h",text:"Производительность и размещение"},{type:"p",text:"Для спальни двух человек нужен стабильный приток, который подбирают по числу жильцов и режимам конкретного прибора. Бризер ставят у наружной стены, оставляя доступ для замены фильтров, и направляют струю так, чтобы она не мешала кровати и шторам."},{type:"h",text:"Монтаж без грязи"},{type:"p",text:"Отверстие бурим алмазной установкой с пылесосом и водосбором, проверив проводку и фасад. Канал теплоизолируем, снаружи устанавливаем решётку, внутри герметизируем примыкание. Типовой монтаж с бурением стоит от 9 000 ₽."},{type:"h",text:"Сколько стоит решение"},{type:"p",text:"Бризер стоит от 39 000 ₽, комплект под ключ — ориентировочно от 48 000 ₽. Если нужна самая бюджетная подача воздуха без тонкой фильтрации и нагрева, клапан КИВ-125 с монтажом начинается от 6 000 ₽."},{type:"h",text:"Обслуживание"},{type:"p",text:"G4 меняют раз в 3–6 месяцев, HEPA — примерно раз в год или по индикации и условиям улицы. Комплект стоит 2 000–4 000 ₽. Забитые фильтры уменьшают расход и повышают шум вентилятора."},{type:"p",text:"Хотите перестать спать с открытым окном? Позвоните +7 (914) 914-66-06 — «Вектор Комфорта» измерит условия, подберёт бризер и аккуратно установит его с алмазным бурением."}],faq:[{q:"Бризер — это то же самое, что кондиционер?",a:"Нет. Кондиционер охлаждает и нагревает воздух в комнате, бризер подаёт свежий воздух с улицы с очисткой и подогревом. Это разные приборы для разных задач."},{q:"Сколько стоит бризер с установкой?",a:"Сам бризер — от 39 000 ₽, монтаж с алмазным бурением отверстия — от 9 000 ₽. Бюджетная альтернатива — приточный клапан КИВ-125 от 6 000 ₽ с монтажом."},{q:"Нужно ли менять фильтры в бризере?",a:"Да, фильтры G4 меняют раз в 3–6 месяцев, HEPA — раз в год. Стоимость комплекта — 2 000–4 000 ₽ в зависимости от модели. Замена занимает 5 минут."}]},"brizer-ili-konditsioner":{date:"2026-03-05",title:"Бризер или кондиционер: что выбрать для квартиры",category:"Вентиляция",summary:"Кондиционер охлаждает и нагревает воздух в комнате, бризер подаёт свежий воздух с улицы. Если душно и тяжело дышать — нужен бризер, если жарко — кондиционер. Для полного комфорта часто нужны оба прибора.",content:[{type:"p",text:"Бризер и сплит-систему часто сравнивают по цене, хотя они решают разные задачи. Кондиционер управляет температурой того воздуха, который уже есть в комнате. Бризер заменяет часть этого воздуха свежим уличным и очищает его."},{type:"h",text:"Что делает кондиционер"},{type:"p",text:"Внутренний блок забирает комнатный воздух, охлаждает или нагревает и возвращает обратно. Обычная бытовая сплит-система не подаёт воздух с улицы. При закрытых окнах в комнате прохладно, но CO₂ продолжает расти."},{type:"h",text:"Что делает бризер"},{type:"p",text:"Он принудительно подаёт воздух через наружную стену, задерживает пыль фильтрами и подогревает поток зимой. Температуру летом он почти не снижает, поэтому в жару открытый приток не заменяет кондиционирование."},{type:"h",text:"Выбор по симптомам"},{type:"list",items:["Жарко, но с открытым окном дышится легко — нужен кондиционер.","Прохладно, но душно и утром болит голова — нужен бризер.","На окнах конденсат и слабая вытяжка — сначала организуйте приток и проверьте каналы.","Летом одновременно жарко и душно — нужны оба прибора."]},{type:"h",text:"Как они работают вместе"},{type:"p",text:"Бризер подаёт дозированный свежий воздух, а кондиционер снимает теплоприток и поддерживает температуру. Холодопроизводительность сплита подбирают с учётом летнего притока, а блоки располагают так, чтобы их струи не конфликтовали."},{type:"h",text:"Сколько стоит каждый вариант"},{type:"p",text:"Кондиционер с монтажом начинается примерно от 35 000 ₽, стандартный монтаж отдельно — от 18 400 ₽. Бризер стоит от 39 000 ₽, с типовой установкой — от 48 000 ₽. Приточный клапан КИВ-125 от 6 000 ₽ дешевле, но не имеет вентилятора, тонкой фильтрации и подогрева."},{type:"h",text:"Что запланировать до ремонта"},{type:"p",text:"Определите места обоих приборов, трассу кондиционера, электрические линии и отверстия в наружной стене. На готовой отделке монтаж тоже возможен, но предварительная закладка делает коммуникации аккуратнее."},{type:"h",text:"Наш честный вывод"},{type:"p",text:"Не выбирайте бризер вместо кондиционера только потому, что оба висят на стене. Сначала сформулируйте проблему: температура или качество воздуха. Для круглогодичного комфорта в герметичной квартире чаще нужна связка из двух устройств."},{type:"p",text:"Нужно определить, с чего начать? Позвоните +7 (914) 914-66-06 — «Вектор Комфорта» оценит духоту и теплопритоки, предложит бризер, кондиционер или совместную схему без лишнего оборудования."}],faq:[{q:"Чем бризер отличается от кондиционера?",a:"Кондиционер охлаждает и нагревает воздух в комнате, но не подаёт свежий. Бризер подаёт свежий уличный воздух с очисткой и подогревом, но не охлаждает. Это приборы с разными задачами."},{q:"Нужен ли кондиционер, если есть бризер?",a:"Если летом в квартире жарко — да. Бризер не охлаждает воздух, он только подаёт свежий. Для жары нужен кондиционер, для свежего воздуха — бризер, оптимально иметь оба."},{q:"Что дешевле — бризер или кондиционер?",a:"Кондиционер с монтажом — от 35 000 ₽, бризер с монтажом — от 48 000 ₽. Но сравнивать их некорректно: они решают разные задачи."}]},"klapan-brizer-ili-rekuperator":{date:"2026-02-28",title:"Приточный клапан, бризер или рекуператор: трехуровневое сравнение",category:"Вентиляция",summary:"Приточный клапан КИВ-125 (от 6 000 ₽) — дешёвый приток без электричества, но без очистки и подогрева. Бризер (от 39 000 ₽) — с фильтрами и подогревом. Рекуператор (от 35 000 ₽) — приток и вытяжка с экономией тепла до 80%.",content:[{type:"p",text:"Все три устройства устанавливаются в наружную стену, но дают разный контроль над воздухом. Клапан зависит от естественной тяги, бризер принудительно подаёт очищенный воздух, а рекуператор одновременно организует приток и вытяжку с возвратом части тепла."},{type:"h",text:"Уровень 1: приточный клапан КИВ-125"},{type:"p",text:"Это утеплённый канал с наружной решёткой, фильтром грубой очистки и регулятором. Электричество не нужно, но расход зависит от вытяжки, ветра и перепада температур. Нет HEPA-фильтра и автоматического подогрева. Цена с монтажом — от 6 000 ₽."},{type:"h",text:"Уровень 2: бризер"},{type:"p",text:"Вентилятор поддерживает заданный расход независимо от погоды, ступени фильтрации задерживают мелкую пыль, а нагреватель убирает холодный сквозняк. Прибор стоит от 39 000 ₽, типовой комплект с монтажом — от 48 000 ₽."},{type:"h",text:"Уровень 3: рекуператор"},{type:"p",text:"Тёплый удаляемый воздух передаёт до 80% энергии холодному приточному через теплообменник, не смешиваясь с ним. Устройство стоит от 35 000 ₽, под ключ — от 47 000 ₽. Важно учитывать шум, обмерзание, режимы разморозки и расположение парных каналов."},{type:"list",items:["КИВ-125: минимальная цена и нет электропотребления, но расход нестабилен.","Бризер: лучший контроль притока, фильтрации и температуры.","Рекуператор: приток и вытяжка с экономией тепла, но более сложное обслуживание.","Все варианты требуют правильного отверстия, теплоизоляции канала и свободного фасада."]},{type:"h",text:"Что лучше для иркутской зимы"},{type:"p",text:"В жилой спальне с аллергиком чаще выбирают бризер из-за HEPA и подогрева. Для помещения, где критичны расходы на отопление и можно организовать сбалансированный обмен, выгоден рекуператор. Клапан подходит как недорогой первый шаг при исправной вытяжке."},{type:"h",text:"Почему сначала проверяют вытяжку"},{type:"p",text:"Даже сильный приток не решит воздухообмен, если воздуху некуда уходить. Проверяем каналы кухни и санузла, зазоры под дверями и обратную тягу. Для рекуператора отдельно рассчитываем баланс притока и удаления."},{type:"p",text:"Алмазное бурение отверстия начинается от 2 000 ₽ как отдельная услуга, итоговая установка зависит от диаметра, толщины стены и отделки. Фильтры бризера меняют раз в 3–12 месяцев, рекуператор дополнительно очищают по обеим сторонам теплообменника."},{type:"h",text:"Как выбрать без переплаты"},{type:"p",text:"Определите число жильцов, уровень уличной пыли и шума, состояние вытяжки и допустимый бюджет. Не стоит ставить дорогой бризер там, где достаточно клапана, или пассивный клапан там, где нужна гарантированная подача воздуха."},{type:"p",text:"Хотите сравнить три решения для своей квартиры? Позвоните +7 (914) 914-66-06 — «Вектор Комфорта» проверит условия, рассчитает расход и предложит КИВ-125, бризер или рекуператор с монтажом."}],faq:[{q:"Чем приточный клапан отличается от бризера?",a:"Клапан — это пассивный приток без вентилятора, фильтров тонкой очистки и подогрева. Бризер — активная приточная вентиляция с вентилятором, HEPA-фильтром и подогревом."},{q:"Что выгоднее — бризер или рекуператор?",a:"Рекуператор дороже в монтаже, но экономит до 80% тепла и окупается за один-два отопительных сезона. Для иркутской зимы это выгоднее в перспективе."},{q:"Сколько стоит приточная вентиляция?",a:"Клапан КИВ-125 — от 6 000 ₽ с монтажом, бризер — от 48 000 ₽ под ключ, рекуператор — от 47 000 ₽ под ключ."}]},"pochemu-v-kvartire-dushno-co2":{date:"2026-02-20",title:"Почему в квартире душно: CO₂ и как вентиляция это решает",category:"Вентиляция",summary:"Духота — это не нехватка кислорода, а избыток углекислого газа CO₂. Норма до 1000 ppm; выше начинается усталость и головная боль. Герметичные окна без вентиляции поднимают уровень CO₂ до 2000–3000 ppm за ночь. Решение — приток свежего воздуха.",content:[{type:"p",text:"В закрытой комнате доля кислорода меняется незначительно, но каждый выдох добавляет углекислый газ. Именно рост CO₂ первым ощущается как тяжёлый воздух, сонливость и желание открыть окно. Запахи и влажность могут усиливать дискомфорт."},{type:"h",text:"Что означают показания CO₂"},{type:"list",items:["До 800 ppm — воздух воспринимается свежим большинством людей.","800–1000 ppm — приемлемый уровень для жилого помещения.","1000–2000 ppm — нарастают сонливость, усталость и снижение концентрации.","Выше 2000 ppm — выраженная духота и головная боль у чувствительных людей."]},{type:"h",text:"Почему пластиковые окна изменили воздухообмен"},{type:"p",text:"Старые рамы постоянно пропускали воздух через щели. Новые окна герметичны, поэтому естественной вытяжке кухни и санузла нечего удалять. За ночь в закрытой спальне двух человек датчик действительно может показать 2000–3000 ppm."},{type:"h",text:"Как измерить проблему"},{type:"p",text:"Поставьте откалиброванный NDIR-датчик на высоте дыхания, не вплотную к окну и не рядом с человеком. Сравните значения вечером, ночью и после проветривания. Бытовой датчик не заменяет проект, но хорошо показывает динамику."},{type:"h",text:"Почему одного кондиционера недостаточно"},{type:"p",text:"Сплит-система гоняет комнатный воздух по кругу. Температура падает, но CO₂ остаётся. Поэтому прохладная комната тоже может быть душной. Нужен приток с улицы и путь для удаления воздуха через вытяжку."},{type:"h",text:"Три способа вернуть свежий воздух"},{type:"list",items:["Регулярное сквозное проветривание — бесплатно, но шумно и холодно зимой.","Клапан КИВ-125 от 6 000 ₽ — пассивный приток при работающей вытяжке.","Бризер от 39 000 ₽ — управляемая подача с фильтрацией и подогревом."]},{type:"h",text:"Проверьте путь воздуха по квартире"},{type:"p",text:"Свежий воздух подают в спальни и гостиные, затем он должен проходить под дверями к кухне и санузлу и уходить через каналы. Плотные межкомнатные двери без зазора нарушают эту схему даже при установленном бризере."},{type:"p",text:"Высокая влажность и запотевание окон часто сопровождают слабый воздухообмен. Но зимой чрезмерный приток может пересушить помещение. Регулируйте расход по числу людей и показаниям датчиков, а не держите максимальную скорость постоянно."},{type:"p",text:"Измерьте CO₂ в спальне, проверьте тягу в санузле и обеспечьте зазор под дверью. После этого выбирайте производительность клапана или бризера. Так оборудование решит измеренную проблему, а не будет работать вслепую."},{type:"p",text:"Утром болит голова и хочется сразу открыть окно? Позвоните +7 (914) 914-66-06 — «Вектор Комфорта» проверит воздухообмен и подберёт клапан, бризер или рекуператор для вашей квартиры."}],faq:[{q:"Почему в квартире душно даже с открытым окном?",a:"Чаще всего дело в слабой вытяжке или в том, что окно открыто недостаточно. Если вытяжные каналы не работают, свежий воздух не циркулирует. Нужно наладить приток и проверить тягу."},{q:"Какой уровень CO₂ считается нормальным?",a:"До 1000 ppm. Выше — усталость и головная боль, выше 2000 ppm — выраженная духота. В спальне за ночь без вентиляции уровень легко достигает 2000–3000 ppm."},{q:"Как избавиться от духоты?",a:"Обеспечить приток свежего воздуха: проветривание, приточный клапан (от 6 000 ₽) или бризер (от 39 000 ₽). Это снижает CO₂ и убирает духоту."}]},"vytyazhka-ne-rabotaet-i-zapahi-ot-sosedey":{date:"2026-02-12",title:"Вытяжка не работает и пахнет от соседей: обратная тяга и что делать",category:"Вентиляция",summary:"Если вытяжка тянет в квартиру запахи соседей — это обратная тяга: в герметичной квартире вытяжному каналу не хватает притока воздуха. Решение — обратный клапан на решётку и приточный клапан или бризер, чтобы восстановить воздухообмен.",content:[{type:"p",text:"Запах еды или табака из вентиляционной решётки означает, что воздух движется не наружу, а в квартиру. Заклеивать канал нельзя: исчезнет вытяжка из собственного помещения, вырастут влажность и CO₂. Нужно найти причину обратной тяги и восстановить баланс."},{type:"h",text:"Почему после замены окон тяга пропадает"},{type:"p",text:"Естественный канал удаляет воздух только тогда, когда вместо него поступает новый. Герметичные окна перекрывают приток, в квартире возникает разрежение, и воздух начинает приходить через соседний или общий канал вместе с запахами."},{type:"h",text:"Другие причины обратной тяги"},{type:"list",items:["Засор или повреждение вентиляционного канала.","Сильная вытяжка у соседа без компенсационного притока.","Кухонный зонт подключён так, что перекрывает естественную решётку.","Плотные двери не пропускают воздух из жилых комнат к санузлу.","Ветер создаёт подпор у оголовка на крыше."]},{type:"p",text:"Приоткройте окно и поднесите полоску тонкой бумаги к решётке. Если с открытым окном тяга появилась, основная проблема — нехватка притока. Не используйте открытое пламя: в канале могут быть горючие отложения или газовые продукты."},{type:"h",text:"Что даёт обратный клапан"},{type:"p",text:"Клапан от 290 ₽ открывается только в сторону канала и перекрывается при обратном потоке. Он уменьшает приход чужих запахов, но не создаёт свежий воздух. Если ограничиться только клапаном, духота и влажность останутся."},{type:"h",text:"Как организовать приток"},{type:"list",items:["Проветривание — бесплатное, но нестабильное решение.","КИВ-125 от 6 000 ₽ с монтажом — пассивный приток без подогрева.","Бризер от 48 000 ₽ под ключ — вентилятор, фильтры и подогрев.","Зазоры или переточные решётки в дверях — путь воздуха к вытяжным каналам."]},{type:"h",text:"Когда обращаться в управляющую компанию"},{type:"p",text:"Если тяги нет даже при открытом окне, возможен засор или нарушение общедомового канала. Его обследование и очистку должна организовать управляющая организация. Самостоятельно разбирать шахту или ставить мощный вентилятор без расчёта нельзя."},{type:"h",text:"Правильная последовательность решения"},{type:"p",text:"Сначала проверяем канал при открытом окне, затем обеспечиваем постоянный приток, свободный переток под дверями и ставим обратный клапан. Только после этого оцениваем необходимость вытяжного вентилятора."},{type:"p",text:"Сам клапан на решётку начинается от 290 ₽, КИВ-125 с установкой — от 6 000 ₽, бризер с монтажом — от 48 000 ₽. Итог зависит от толщины стены, диаметра бурения и выбранного прибора."},{type:"p",text:"Пахнет из вентиляции и запотевают окна? Позвоните +7 (914) 914-66-06 — «Вектор Комфорта» проверит тягу и приток, установит клапан или бризер и объяснит, что должен исправить собственник, а что — управляющая компания."}],faq:[{q:"Почему вытяжка не тянет после установки пластиковых окон?",a:"Герметичные окна перекрыли приток воздуха, без которого естественная вытяжка не работает. Нужно вернуть приток — клапаном КИВ-125, бризером или регулярным проветриванием."},{q:"Как убрать запах от соседей из вентиляции?",a:"Поставить обратный клапан на решётку (от 290 ₽) — он пропускает воздух только наружу. Для полного решения добавьте приток свежего воздуха, иначе останется духота."},{q:"Сколько стоит наладить вентиляцию?",a:"Обратный клапан — от 290 ₽, приточный клапан КИВ-125 с монтажом — от 6 000 ₽, бризер с монтажом — от 48 000 ₽ под ключ."}]},"mozhno-li-sverlit-nesushchuyu-stenu":{date:"2026-02-05",title:"Можно ли сверлить несущую стену: что законно, а что нет",category:"Алмазное бурение",summary:"Сверлить несущую стену можно, если соблюдать правила: диаметр отверстия не больше четверти толщины стены и не задевать арматуру. Отверстия под вентиляцию, кондиционер и трубы малого диаметра законны и безопасны. Запрещено штробить несущие стены горизонтально и расширять проёмы без проекта.",content:[{type:"p",text:"Одиночное технологическое отверстие и новый дверной проём — разные вмешательства. Канал под трассу кондиционера или вентиляцию малого диаметра обычно не меняет расчётную схему стены, если выполнен в безопасном месте. Проём, ниша и длинная штроба требуют совсем другого подхода."},{type:"h",text:"Какие отверстия делают без перепланировки"},{type:"list",items:["Проход 40–60 мм под медную трассу и дренаж кондиционера.","Канал 100–200 мм под клапан, бризер или локальный рекуператор.","Отверстия малого диаметра под трубы и крепёж.","Каждую точку всё равно проверяют по материалу, арматуре и скрытым коммуникациям."]},{type:"h",text:"Почему важно не задеть арматуру"},{type:"p",text:"Стальная арматура воспринимает растягивающие усилия и обеспечивает совместную работу железобетона. Перед крупным бурением стену сканируют детектором, а точку смещают от стержней. Резать арматуру без проекта и заключения нельзя."},{type:"p",text:"Для одиночного отверстия ориентируются на диаметр не более четверти толщины стены, но это не универсальное разрешение. Важны серия дома, расстояние до края и других отверстий, состояние конструкции и требования управляющей организации. В сомнительном случае нужен проектировщик."},{type:"h",text:"Что делать запрещено или опасно"},{type:"list",items:["Резать горизонтальную штробу в несущей стене.","Расширять дверной или оконный проём без проекта усиления.","Создавать несколько близких отверстий, превращая их в ослабленный паз.","Бурить вслепую рядом со скрытой проводкой, стояками и газовыми линиями.","Перерезать обнаруженную арматуру ради сохранения выбранной точки."]},{type:"h",text:"Почему выбирают алмазное бурение"},{type:"p",text:"Коронка режет ровный круг без ударных нагрузок, трещин и сколов, которые создаёт перфоратор большого диаметра. Установка фиксируется на станине, а пыль и вода собираются промышленным оборудованием. Это особенно важно в жилой квартире с готовой отделкой."},{type:"list",items:["Согласуем диаметр, глубину и угол канала.","Проверяем обе стороны стены и скрытые коммуникации.","Сканируем участок на арматуру и выбираем безопасную точку.","Фиксируем установку, подключаем водосбор и выполняем проход.","Осматриваем отверстие и убираем рабочую зону."]},{type:"p",text:"Одиночный канал под кондиционер или бризер обычно не считается перепланировкой. Но изменение фасада может регулироваться домом, а проёмы, ниши и вмешательство в несущую схему требуют проекта и официального согласования. До спорных работ обратитесь к проектной организации."},{type:"h",text:"Стоимость в Иркутске"},{type:"p",text:"Алмазное бурение начинается от 2 000 ₽. Цена зависит от диаметра, толщины и материала стены, высоты, доступа к воде и необходимости сканирования. До начала работ называем расчёт и не увеличиваем диаметр без согласования."},{type:"p",text:"Безопаснее немного сместить прибор или трассу, чем перерезать арматуру либо попасть в скрытую линию. Отметка дизайнера на стене — пожелание, окончательную точку выбирают после технической проверки."},{type:"p",text:"Нужно отверстие под кондиционер, бризер или трубу? Позвоните +7 (914) 914-66-06 — «Вектор Комфорта» проверит место и выполнит аккуратное алмазное бурение от 2 000 ₽ без лишней ударной нагрузки."}],faq:[{q:"Можно ли сверлить несущую стену в квартире?",a:"Да, отверстия под кондиционер, вентиляцию и трубы малого диаметра делать можно — это не перепланировка. Главное — не задевать арматуру и не превышать четверть толщины стены."},{q:"Можно ли штробить несущую стену?",a:"Горизонтально — нельзя, это ослабляет стену и требует согласования, которое в жилых домах обычно не выдают. Вертикальные штробы под проводку допустимы с ограничениями и по нормам."},{q:"Нужно ли разрешение на отверстие под кондиционер?",a:"Для одиночного отверстия под трассу кондиционера или бризер разрешение не требуется. Оно нужно при изменении конструкций — новых проёмах, нишах, демонтаже части стены."}]},"pochemu-montazh-okon-stoit-dorozhe":{date:"2026-01-20",title:"Почему мой монтаж окон стоит чуть дороже: 8 ошибок, за которые вы заплатите дважды",category:"Окна",summary:"Мой монтаж дороже потому, что делается по ГОСТ 30971: клинья вдоль рамы, обеспыливание и увлажнение, пена в 2–3 слоя, паро-влагоизоляция шва и крепёж в армирующий профиль. «Дешёвый» монтаж экономит на этом и обходится дороже в итоге — переделка одного проёма стоит 8 000–15 000 ₽, плюс испорченный ремонт.",content:[{type:"p",text:"Когда заказчик сравнивает сметы, мой монтаж часто оказывается чуть дороже, чем у «соседней конторы». Обычно дальше звучит: «а у других дешевле». Я не спорю — дешевле действительно можно. Вопрос только в том, что вы получите за эти деньги. Я работаю монтажником больше десяти лет, монтирую по ГОСТ 30971 и отвечаю за каждый шов лично. Расскажу честно, из чего складывается моя цена и почему «дешёвый монтаж» в итоге обходится дороже всего."},{type:"h",text:"Сразу главное: почему моя цена чуть выше"},{type:"p",text:"Я работаю на себя. Это не просто слова: за каждый объект отвечаю лично — не передаю монтаж наёмным бригадам и «шабашникам», с которых потом не спросишь. У меня нет отдела продаж и маркетинга, которые надо кормить, — но и нет посредников, которые берут свой процент и экономят на монтажниках. Моя цена — это цена честной работы по технологии, без срезанных углов."},{type:"p",text:"Я каждый день вижу боль клиентов, которым установили дорогие окна, а смонтировали так, что они промерзают, дуют и «плачут». Окно стоит своих денег только тогда, когда монтажный шов сделан по технологии. Поэтому ниже — 8 ошибок, из-за которых «выгодный» монтаж превращается в дорогую переделку."},{type:"h",text:"8 ошибок дешёвого монтажа, за которые вы заплатите дважды"},{type:"list",items:["Мостики холода. Крепёж, подставочный профиль и швы, которые не утеплены, работают как «холодные мосты»: тепло уходит, стекло промерзает по краям, зимой появляется иней и конденсат.","Пена в один слой, «на глаз». Монтажный шов по технологии заполняется пеной в 2–3 слоя с промежуточным увлажнением. Один проход = пустоты внутри шва, и рано или поздно оттуда начинает дуть.","Шов без обеспыливания. Если перед запениванием не убрать пыль, бетонную крошку и влагу — пена не схватывается с поверхностью, со временем «сворачивается» и отстаёт. Результат — щели, которые появляются через год-два.","Пластиковые клинья поперёк рамы. Клинья — это опора, которая распределяет вес окна. Их ставят вдоль рамы, под вертикальными стойками. Поперёк — это готовый мостик холода: в этом месте рама промерзает и «плачет» зимой.","Монтажный шов без паро-влагоизоляции. Изнутри шов должен быть закрыт пароизоляционной лентой, снаружи — паропроницаемой (защищает от дождя и солнца). Без неё пена разрушается: изнутри — от пара и влаги квартиры, снаружи — от ультрафиолета и перепадов температуры.","Крепёж не в армирующий профиль. Саморезы должны входить в стальной контур рамы, а не «в пластик». Иначе крепление держит только на честном слове — рама «гуляет», геометрия меняется, створки перекашиваются.","Экономия на мелочах, которые не видны на фото: дешёвая пена с усадкой, тонкие подставочные профили, неотрегулированная фурнитура, защитная плёнка, снятая «потом» — точнее, никогда.","Гарантия на словах. «Да мы всё бесплатно исправим» — звучит красиво до первого звонка. Через год-два фирмы-однодневки уже нет, а у вас — промерзающий шов и никому до него нет дела."]},{type:"h",text:"Что входит в мой монтаж, когда вы платите чуть больше"},{type:"p",text:"Вот что реально стоит за моей ценой. Это не «доплата за имя», а перечень работ, которые делаются на каждом объекте:"},{type:"list",items:["Бесплатный выезд замерщика — до 50 км от Иркутска, с точным расчётом сметы до копейки.","Монтаж по ГОСТ 30971: шаг крепления, пластиковые клинья вдоль рамы, подставочный профиль.","Обеспыливание и увлажнение проёма перед запениванием.","Монтажная пена в 2–3 слоя с выдержкой — без пустот и усадки.","Паро-влагоизоляция шва: пароизоляционная лента изнутри, паропроницаемая — снаружи.","Регулировка фурнитуры, проверка работы створок, снятие защитной плёнки.","Уборка после монтажа: строительный мусор забираю с собой.","Гарантия на монтаж до 5 лет — и если что-то не так, я приезжаю и исправляю. Лично."]},{type:"h",text:"Как проверить монтаж за 10 минут — даже если окна уже стоят"},{type:"p",text:"Вам не нужно быть экспертом, чтобы оценить качество монтажа. Достаточно этих проверок:"},{type:"list",items:["Загляните под подоконник: монтажный шов должен быть закрыт лентой или аккуратно оштукатурен — голая пена, торчащая наружу, это «монтаж наспех».","Снаружи посмотрите на шов: он должен быть закрыт паропроницаемой лентой или наличником, пена не должна «смотреть» на солнце — иначе она разрушится за пару сезонов.","Постучите по откосам: глухой звук без пустот — шов заполнен ровно. Звонкий «бубнёж» — внутри пустоты.","Откройте створку и посмотрите на неё сбоку: она должна стоять ровно, без перекоса. Зазоры по периметру — одинаковые.","Проверьте прижим: лист бумаги, зажатый створкой, должен выдёргиваться с усилием по всему периметру.","Спросите монтажника про клинья: они должны стоять вдоль рамы, под вертикальными стойками — не поперёк."]},{type:"h",text:"Что выгоднее: переделать или сразу сделать правильно"},{type:"p",text:"Считаем честно. Окно VEKA с монтажом по технологии — это примерно на 2 000–4 000 ₽ дороже «дешёвого» варианта за проём. А переделка монтажа после некачественной установки — это демонтаж, новый крепёж, новая пена, новая изоляция и ремонт откосов: 8 000–15 000 ₽ за окно, плюс испорченный ремонт, который вы уже сделали. И это если окно само не повело — тогда это уже замена окна."},{type:"p",text:"Дорогой монтаж — это не то, что стоит дорого. Дорого стоит переделывать. Плюс вы платите своим временем, нервами и холодом в квартире — а зимой в Иркутске это ощутимо."},{type:"h",text:"Почему «работа на себя» — это другие стандарты"},{type:"p",text:"Когда я ставлю окно, на раме остаётся не логотип компании, а моя репутация. Я не могу сказать клиенту «это монтажники виноваты» — виноват буду я. Поэтому у меня нет «не моих» объектов: каждый шов я делаю так, чтобы через два года мне не было стыдно приехать на этот адрес по гарантии. За 10+ лет я видел десятки разобранных «дешёвых» монтажей — и почти никогда не видел, чтобы переделка обошлась дёшево."},{type:"h",text:"Итог"},{type:"p",text:"Моя цена — это не «чуть дороже». Это разница между окном, которое стоит 10 лет, и окном, которое через год начинает дуть и промерзать. Я не зазываю «самыми низкими ценами» — я предлагаю честную работу по ГОСТу с гарантией, за которую отвечаю лично. Сравните сметы, спросите монтажника про клинья и паро-влагоизоляцию — и вы поймёте, за что платите."},{type:"p",text:"Хотите посчитать ваше окно по-честному? Позвоните +7 (914) 914-66-06 — замерщик приедет бесплатно, покажет, из чего складывается смета, и ответит на любые вопросы по монтажу. Окна VEKA от 11 000 ₽/м², монтаж по ГОСТ 30971, гарантия до 5 лет."}]}};function I1(){const{slug:s}=Co(),c=s?F1[s]:void 0;return Ut([{name:"Главная",path:"/"},{name:"База знаний",path:"/baza-znaniy"},...c?[{name:c.title}]:[]]),v.useEffect(()=>{if(!c)return;const d=`${c.title} | Вектор Комфорта`;document.title=d;const o=c.metaDescription||c.summary||c.excerpt||c.title,u=(y,f,S=!1)=>{const j=S?"property":"name";let h=document.querySelector(`meta[${j}="${y}"]`);h||(h=document.createElement("meta"),h.setAttribute(j,y),document.head.appendChild(h)),h.content=f};u("description",o),u("og:title",d,!0),u("og:description",o,!0),u("og:url",window.location.href,!0),u("og:type","article",!0);const p=c.date?`${c.date}T08:00:00+08:00`:"2026- у и точки крепления."},{icon:"🕳️",title:"Алмазное бурение",text:"Отверстие в стене безударным способом с промышленным пылесосом — без трещин и пыли в квартире."},{icon:"🧵",title:"Прокладка трассы",text:"Медные трубы с теплоизоляцией, дренаж с уклоном, межблочный кабель. Штроба или короб — по согласованию."},{icon:"🧲",title:"Вакуумирование",text:"Обязательный этап: удаляем влагу и воздух из контура вакуумным насосом. Без него компрессор живёт вдвое меньше."},{icon:"❄️",title:"Пуско-наладка",text:"Проверка давления, тест режимов охлаждения и обогрева, замер температуры на выходе."},{icon:"📄",title:"Сдача по акту",text:"Инструктаж по эксплуатации, заполнение гарантийного талона, уборка после работ."}],priceTitle:"Цены на монтаж кондиционера в Иркутске",priceNote:"Стандартный монтаж под ключ с вакуумированием. Доп. трасса, штроба и зимний комплект считаются отдельно после замера.",priceRows:[{work:"Монтаж сплит-системы 07–09",note:"2.5 кВт, до 25 м²",price:"от 18 400 ₽"},{work:"Монтаж сплит-системы 12",note:"3.5 кВт, до 35 м²",price:"от 18 400 ₽"},{work:"Монтаж сплит-системы 18–24",note:"5–7 кВт, до 60 м²",price:"от 20 100 ₽"},{work:"Трасса, дополнительный метр",note:"медь, изоляция, дренаж",price:"от 2 500 ₽/м"},{work:"Зимний комплект",note:"работа кондиционера до −30 °C",price:"от 3 000 ₽"},{work:"Демонтаж старого кондиционера",note:"со сбором фреона",price:"от 2 000 ₽"}],priceFooter:"В стандартный монтаж входит: трасса 3 м, кронштейны, алмазное бурение, вакуумирование, пуско-наладка, инструктаж и гарантия 1 год на работы.",faq:[{q:"Сколько стоит установка кондиционера в Иркутске?",a:"Монтаж моделей 07–12 — от 18 400 ₽, 18–24 — от 20 100 ₽. В цену уже входит трасса 3 м, кронштейны, бурение и вакуумирование. Точную сумму называем после бесплатного выезда."},{q:"Сколько длится монтаж?",a:"Стандартная установка занимает 3–4 часа, то есть кондиционер работает в день приезда бригады. Сложные объекты с длинной трассой или штробой — по согласованию."},{q:"Установите кондиционер, купленный в другом месте?",a:"Да. Монтируем оборудование любых брендов независимо от места покупки. Гарантия 1 год распространяется на наши работы."},{q:"Нужен ли зимний комплект?",a:"Он нужен, если планируете включать кондиционер на охлаждение зимой (серверные, торговые залы) или на обогрев в сильные морозы. Комплект — от 3 000 ₽."},{q:"Много ли будет пыли при бурении?",a:"Нет. Бурим алмазной коронкой с промышленным пылесосом, отверстие получается ровным, стена не трескается, пыль собирается на месте."},{q:"Работаете за городом?",a:"Да, выезжаем в Ангарск, Шелехов, Хомутово, Молодёжный, Пивовариху, Урик и по трактам. Выезд бесплатный до 50 км от Иркутска."}],alsoSee:[{label:"Каталог кондиционеров",to:"/kondicionery"},{label:"Сервис и чистка кондиционеров",to:"/servis-kondicionerov"},{label:"Алмазное бурение",to:"/almaznoe-burenie"}]},"montazh-okon":{slug:"montazh-okon",title:"Монтаж ПВХ окон в Иркутске — цена от 2 400 ₽ за окно | Вектор Комфорта",description:"Монтаж пластиковых окон в Иркутске от 2 400 ₽ за окно. Установка строго по ГОСТ 30971-2012: трёхслойный шов, пароизоляция, тёплые откосы. Демонтаж 0 ₽ при заказе, гарантия 1 год.",h1:"Монтаж ПВХ окон в Иркутске — цена от 2 400 ₽ за окно",tagline:"Установка по ГОСТ 30971-2012: трёхслойный монтажный шов, пароизоляция, тёплые откосы. Демонтаж — 0 ₽",heroIcon:"🪟",parent:{name:"Пластиковые окна",path:"/okna"},intro:["Устанавливаем пластиковые окна и балконные блоки в квартирах, частных домах и на коммерческих объектах Иркутска. Монтаж выполняем строго по ГОСТ 30971-2012 — с трёхслойным монтажным швом, а не «на одну пену».","Ставим окна собственного производства и конструкции, купленные в другом месте. Демонтаж старого окна при заказе монтажа — 0 ₽. Гарантия на монтажные работы — 1 год, на окна нашего производства — 5 лет."],whatWeDo:[{icon:"📏",title:"Бесплатный замер",text:"Замерщик приезжает в удобное время, проверяет геометрию проёма и считает точную смету — выезд 0 ₽ до 50 км."},{icon:"🧱",title:"Демонтаж",text:"Аккуратно снимаем старое окно, подоконник и отлив, выносим мусор. При заказе монтажа — бесплатно."},{icon:"🔩",title:"Установка по ГОСТ 30971",text:"Крепление на анкерные пластины и пластиковые клинья, выставление по уровню в трёх плоскостях."},{icon:"🛡️",title:"Трёхслойный шов",text:"Пена + пароизоляционная лента изнутри + паропроницаемая ПСУЛ снаружи. Именно так шов не мокнет и не промерзает."},{icon:"🧊",title:"Тёплые откосы",text:"Сэндвич-панель 10 мм с утеплителем вместо голого гипсокартона — не промерзают и не покрываются плесенью."},{icon:"⚙️",title:"Регулировка и сдача",text:"Настройка фурнитуры на зимний/летний режим, проверка створок, уборка, сдача работ по акту."}],priceTitle:"Цены на монтаж окон ПВХ в Иркутске",priceNote:"Стоимость монтажных работ с материалами шва. Точная цена — после бесплатного замера, выезд 0 ₽ до 50 км.",priceRows:[{work:"Монтаж пластикового окна",note:"по ГОСТ 30971-2012",price:"от 2 400 ₽/шт"},{work:"Монтаж балконного блока",note:"окно + балконная дверь",price:"от 3 700 ₽"},{work:"Откосы (сэндвич 10 мм)",note:"с утеплением",price:"от 700 ₽/п.м"},{work:"Установка подоконника",note:"с запениванием и заглушками",price:"от 700 ₽/п.м"},{work:"Установка отлива",note:"оцинковка с полимерным покрытием",price:"от 200 ₽/п.м"},{work:"Демонтаж старого окна",note:"при заказе монтажа",price:"0 ₽",accent:!0}],priceFooter:"В монтаж входит: крепёж, монтажная пена, пароизоляционная и паропроницаемая ленты, выставление по уровню, регулировка фурнитуры, уборка и гарантия 1 год на работы.",faq:[{q:"Сколько стоит установка одного окна?",a:"Монтаж окна — от 2 400 ₽, балконного блока — от 3 700 ₽. Откосы, подоконник и отлив считаются отдельно по погонным метрам. Демонтаж старого окна при заказе — бесплатно."},{q:"Что такое монтаж по ГОСТ 30971 и зачем переплачивать?",a:"ГОСТ требует трёхслойный шов: пена в середине, пароизоляция изнутри и паропроницаемая лента снаружи. Голая пена впитывает влагу, промерзает и через 2–3 года начинает продувать. Трёхслойный шов служит десятилетиями."},{q:"За сколько устанавливаете окна?",a:"Стандартная квартира с 2–3 окнами — один день. Изготовление окон на нашем производстве занимает 5–7 рабочих дней до монтажа."},{q:"Установите окна, купленные в другом месте?",a:"Да, монтируем конструкции любых производителей. Гарантия 1 год действует на наши монтажные работы."},{q:"Можно ли ставить окна зимой?",a:"Да. Используем зимнюю монтажную пену до −18 °C и работаем поэтапно, чтобы квартира не выстывала: одно окно снимается и ставится за 1,5–2 часа."},{q:"Делаете монтаж в деревянном доме?",a:"Да, с обсадной коробкой (окосячкой), компенсационным зазором на усадку сруба и гидроизоляцией примыканий."}],alsoSee:[{label:"Пластиковые окна VEKA",to:"/okna"},{label:"Остекление балконов",to:"/osteklenie-balkonov"},{label:"Стандарты монтажа",to:"/standarty"}]},"servis-kondicionerov":{slug:"servis-kondicionerov",title:"Сервис и чистка кондиционеров в Иркутске — от 3 000 ₽ | Вектор Комфорта",description:"Обслуживание кондиционеров в Иркутске: диагностика от 3 000 ₽, чистка от 4 000 ₽, заправка фреоном R32/R410 от 4 000 ₽, антибактериальная обработка от 2 000 ₽. Выезд в день обращения.",h1:"Сервис и чистка кондиционеров в Иркутске — от 3 000 ₽",tagline:"Диагностика, чистка, антибактериальная обработка и заправка фреоном R32 / R410. Выезд в день обращения",heroIcon:"🧼",parent:{name:"Кондиционеры",path:"/kondicionery"},intro:["Обслуживаем сплит-системы любых марок в квартирах, офисах, магазинах и на производстве. Кондиционер, который не чистили год, теряет до 20% мощности и становится источником запаха и бактерий — регулярный сервис возвращает технику к заводским характеристикам.","Приезжаем со своим оборудованием: парогенератор, манометрический коллектор, вакуумный насос, течеискатель. Работы выполняем на месте, без демонтажа блока в большинстве случаев."],whatWeDo:[{icon:"🔍",title:"Диагностика",text:"Замер давления и температур, проверка электрики, поиск утечки фреона течеискателем. Заключение по состоянию техники."},{icon:"🚿",title:"Чистка внутреннего блока",text:"Промывка теплообменника, крыльчатки и дренажной ванны, мойка фильтров. Уходят запах и «капель» из блока."},{icon:"🌬️",title:"Чистка наружного блока",text:"Промывка конденсатора от тополиного пуха и пыли — возвращает мощность охлаждения и снижает нагрузку на компрессор."},{icon:"🧪",title:"Антибактериальная обработка",text:"Дезинфекция теплообменника и дренажа. Убирает плесень, грибок и неприятный запах при включении."},{icon:"❄️",title:"Заправка фреоном",text:"Дозаправка или полная заправка R32 / R410A по весу с предварительным вакуумированием контура."},{icon:"🔧",title:"Ремонт и замена узлов",text:"Устранение утечек, пайка трассы, замена платы управления, вентилятора, датчиков и дренажной помпы."}],priceTitle:"Цены на обслуживание кондиционеров в Иркутске",priceNote:"Цены за один блок в квартире. Для офисов, магазинов и парка техники — договор на обслуживание со скидкой.",priceRows:[{work:"Диагностика кондиционера",note:"замеры, поиск утечки, заключение",price:"от 3 000 ₽"},{work:"Чистка кондиционера",note:"внутренний + наружный блок",price:"от 4 000 ₽"},{work:"Заправка фреоном R32 / R410",note:"по весу, с вакуумированием",price:"от 4 000 ₽"},{work:"Антибактериальная обработка",note:"теплообменник и дренаж",price:"от 2 000 ₽"}],priceFooter:"Рекомендуем обслуживать кондиционер раз в год — весной перед сезоном. Регулярная чистка продлевает срок службы компрессора и экономит до 20% электроэнергии.",faq:[{q:"Как часто нужно чистить кондиционер?",a:"Раз в год для квартиры и два раза в год для офиса, кафе или магазина. Оптимально — весной перед началом сезона охлаждения."},{q:"Сколько стоит чистка кондиционера?",a:"Чистка внутреннего и наружного блока — от 4 000 ₽. Антибактериальная обработка — от 2 000 ₽. Диагностика — от 3 000 ₽ и засчитывается в стоимость работ при ремонте."},{q:"Почему кондиционер стал плохо охлаждать?",a:"Три частые причины: загрязнён теплообменник, утёк фреон через развальцовку, вышел из строя вентилятор наружного блока. Диагностика показывает причину за 30–40 минут."},{q:"Откуда неприятный запах при включении?",a:"Это бактерии и плесень в дренажной ванне и на теплообменнике. Решается чисткой с антибактериальной обработкой — запах уходит сразу."},{q:"Нужно ли заправлять фреон каждый год?",a:"Нет. Исправная система герметична и не теряет фреон. Ежегодная «дозаправка» означает утечку — её надо найти и устранить, иначе деньги уходят впустую."},{q:"Как быстро приедете?",a:"В большинстве случаев — в день обращения или на следующий день. Звоните +7 (914) 914-66-06."}],alsoSee:[{label:"Монтаж кондиционеров",to:"/montazh-kondicionerov"},{label:"Каталог кондиционеров",to:"/kondicionery"},{label:"База знаний",to:"/baza-znaniy"}]},"osteklenie-balkonov":{slug:"osteklenie-balkonov",title:"Остекление балконов и лоджий в Иркутске — под ключ от 38 000 ₽ | Вектор Комфорта",description:"Остекление балконов и лоджий в Иркутске под ключ: тёплое от 38 000 ₽, холодное алюминиевое от 18 000 ₽, крыша от 25 000 ₽, утепление от 15 000 ₽. Своё производство, гарантия 5 лет.",h1:"Остекление балконов и лоджий в Иркутске — под ключ от 38 000 ₽",tagline:"Тёплое и холодное остекление, крыша, утепление и отделка. Собственное производство, гарантия 5 лет",heroIcon:"🏠",parent:{name:"Пластиковые окна",path:"/okna"},intro:["Остекляем балконы и лоджии в Иркутске под ключ: от замера и демонтажа старого парапета до финишной отделки и укладки пола. Тёплое остекление профилем VEKA превращает балкон в жилую комнату, холодное алюминиевое — защищает от снега, ветра и пыли.","Работаем в панельных домах, хрущёвках, новостройках и частных домах. Конструкции изготавливаем на своём производстве в Иркутске — точно по размерам вашего парапета, срок 5–7 рабочих дней."],whatWeDo:[{icon:"🔥",title:"Тёплое остекление",text:"Профиль VEKA 70 мм, двухкамерный стеклопакет с энергосбережением. Балкон становится продолжением комнаты."},{icon:"❄️",title:"Холодное остекление",text:"Раздвижной алюминий Provedal: лёгкая конструкция, не нагружает плиту, защищает от осадков и пыли."},{icon:"🏗️",title:"Крыша на балкон",text:"Независимая или зависимая кровля с гидроизоляцией и шумопоглощением для последних этажей."},{icon:"🧊",title:"Утепление",text:"Пол, стены и парапет — пеноплэкс + фольгированный слой. Убираем мостики холода, ставим тёплый пол по желанию."},{icon:"🎨",title:"Отделка",text:"Внутри — панели ПВХ, ламинат, вагонка. Снаружи — профлист или сайдинг. Пол — фанера и напольное покрытие."},{icon:"📦",title:"Вынос и шкафы",text:"Вынос по подоконнику до 30 см расширяет площадь. Встроенные шкафы и сушилки — по размерам балкона."}],priceTitle:"Цены на остекление балконов в Иркутске",priceNote:"Цены за стандартный балкон 3 метра. Итоговая стоимость зависит от размеров, этажа и состояния парапета — считаем после бесплатного замера.",priceRows:[{work:"Тёплое остекление под ключ",note:"профиль VEKA, стеклопакет",price:"от 38 000 ₽"},{work:"Холодное остекление",note:"раздвижной алюминий",price:"от 18 000 ₽"},{work:"Крыша на балкон",note:"с гидроизоляцией",price:"от 25 000 ₽"},{work:"Утепление балкона",note:"пол, стены, парапет",price:"от 15 000 ₽"}],priceFooter:"В остекление под ключ входит: замер, демонтаж старой конструкции, изготовление, доставка, монтаж, отливы, козырьки и уборка. Гарантия 5 лет на конструкции.",faq:[{q:"Сколько стоит остеклить балкон в Иркутске?",a:"Тёплое остекление под ключ — от 38 000 ₽ за стандартный балкон 3 м, холодное алюминиевое — от 18 000 ₽. Крыша — от 25 000 ₽, утепление — от 15 000 ₽."},{q:"Чем тёплое остекление отличается от холодного?",a:"Тёплое (профиль ПВХ со стеклопакетом) держит плюсовую температуру зимой — балкон можно присоединить к комнате. Холодное (алюминий) защищает от снега, ветра и пыли, но температура на 5–7 °C выше уличной."},{q:"Выдержит ли плита вес конструкции?",a:"Холодный алюминий весит втрое меньше ПВХ и подходит для старых плит. Для тёплого варианта замерщик оценивает состояние плиты и парапета, при необходимости усиливаем основание."},{q:"Сколько времени занимает остекление?",a:"Изготовление 5–7 рабочих дней, монтаж остекления — один день. Крыша, утепление и отделка добавляют 2–3 дня."},{q:"Можно ли сделать балкон тёплой комнатой?",a:"Да: тёплое остекление + утепление пола, стен и парапета + тёплый пол. Выносить радиатор центрального отопления на балкон нельзя — ставим электрический контур или конвектор."},{q:"Делаете вынос балкона?",a:"Да, вынос по подоконнику до 30 см — площадь и ширина подоконника увеличиваются без переделки плиты."}],alsoSee:[{label:"Пластиковые окна VEKA",to:"/okna"},{label:"Монтаж окон ПВХ",to:"/montazh-okon"},{label:"Портфолио работ",to:"/portfolio"}]}};function a2({pageKey:s}){const c=Pp[s];return Qt(c?.title??"",c?.description??""),Ut(c?[{name:"Главная",path:"/"},{name:c.parent.name,path:c.parent.path},{name:c.h1}]:[]),c?a.jsxs(a.Fragment,{children:[a.jsxs("section",{className:"relative overflow-hidden bg-gradient-to-br from-brand-700 via-brand-800 to-slate-900 text-white",children:[a.jsx("div",{className:"absolute inset-0 bg-[radial-gradient(circle_at_20%_20%,rgba(249,115,22,0.2),transparent_50%)]"}),a.jsx("div",{className:"absolute inset-0 bg-[radial-gradient(circle_at_80%_80%,rgba(59,130,246,0.25),transparent_50%)]"}),a.jsxs("div",{className:"relative max-w-7xl mx-auto px-4 py-16 md:py-24 grid lg:grid-cols-2 gap-10 items-center",children:[a.jsxs("div",{className:"animate-fade-in-up",children:[a.jsxs("div",{className:"text-sm font-semibold text-accent-400 mb-3",children:[a.jsx(le,{to:"/",className:"hover:underline",children:"Главная"})," ","/"," ",a.jsx(le,{to:c.parent.path,className:"hover:underline",children:c.parent.name})]}),a.jsx("h1",{className:"text-3xl md:text-4xl lg:text-5xl font-extrabold leading-tight mb-4",children:c.h1}),a.jsx("p",{className:"text-lg md:text-xl text-brand-100 mb-6",children:c.tagline}),a.jsxs("div",{className:"flex flex-wrap gap-3",children:[a.jsx("a",{href:"#price",className:"inline-flex items-center gap-2 px-6 py-3 rounded-xl
