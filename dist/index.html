 (не громче 30 дБ в спальне)","Служить 10-15 лет без поломок"]},{type:"p",text:"Чтобы всё это работало, нужно:"},{type:"list",items:["Правильно рассчитать производительность под площадь и количество людей","Подобрать оборудование с нужными характеристиками","Качественно смонтировать (алмазное бурение, герметизация, шумоглушение)","Использовать качественные материалы (воздуховоды, фильтры, крепёж)"]},{type:"p",text:"Теперь разберём по компонентам, из чего складывается цена."},{type:"h",text:"Компонент №1: Оборудование (40-50% стоимости)"},{type:"h",text:"Бризер (приточная вентиляция)"},{type:"p",text:"Бризер — это компактное устройство, которое подаёт свежий воздух с улицы, очищает его и подогревает. Цены на бризеры в Иркутске:"},{type:"list",items:["Ballu OneAir ASP-100 — от 39 000 ₽ (базовая модель, до 40 м²)","Ballu OneAir ASP-200 — от 62 000 ₽ (более мощная, до 60 м²)","Vakio Base — от 35 000 ₽ (рекуператор, экономит на отоплении)","Тион 4S — от 45 000 ₽ (премиум, HEPA H13, умный дом)"]},{type:"p",text:"Почему такой разброс цен? Разница в:"},{type:"list",items:["Производительность — 100 м³/час vs 200 м³/час","Фильтры — G4 (грубая очистка) vs HEPA H13 (тонкая очистка от пыли и пыльцы)","Подогрев — без подогрева vs с подогревом (зимой без подогрева будет дуть холодом)","Уровень шума — 35 дБ vs 20 дБ (в спальне критично)","Умный дом — без Wi-Fi vs с Wi-Fi и управлением с телефона"]},{type:"h",text:"Рекуператор (приточно-вытяжная вентиляция)"},{type:"p",text:"Рекуператор не только подаёт свежий воздух, но и забирает тепло у выходящего воздуха, экономя на отоплении до 80%. Цены:"},{type:"list",items:["Vakio Base — от 35 000 ₽ (базовая модель, КПД рекуперации 80%)","Vakio Plus — от 55 000 ₽ (увеличенная мощность, КПД 85%)","Mitsubishi Lossnay — от 120 000 ₽ (премиум, КПД 90%, тихая работа)"]},{type:"p",text:"Рекуператор дороже бризера, но окупается за 3-5 лет за счёт экономии на отоплении. Для частного дома в Иркутске с отоплением 10 000 ₽/месяц экономия составит 8 000 ₽/месяц — окупаемость 15 месяцев."},{type:"h",text:"Компонент №2: Воздуховоды и материалы (15-20% стоимости)"},{type:"p",text:"Если вы делаете не просто бризер на стене, а полноценную систему вентиляции с разводкой по комнатам, нужны воздуховоды. Цены:"},{type:"list",items:["Гибкие воздуховоды (алюминиевые) — 300-500 ₽ за погонный метр","Жёсткие воздуховоды (оцинкованная сталь) — 800-1200 ₽ за погонный метр","Утеплённые воздуховоды (для прохода через холодные зоны) — 1500-2000 ₽ за погонный метр","Фасонные части (отводы, тройники, переходы) — 500-1500 ₽ за штуку"]},{type:"p",text:"Почему нельзя использовать дешёвые гибкие воздуховоды?"},{type:"list",items:["Высокое сопротивление — вентилятор работает на износ, шумит","Негерметичность — теряется до 30% воздуха на стыках","Недолговечность — через 3-5 лет алюминий окисляется, появляются дыры","Шум — гофрированная поверхность создаёт турбулентность и свист"]},{type:"p",text:"Для качественной системы мы используем жёсткие оцинкованные воздуховоды с утеплением. Это дороже, но работает тихо и служит 20-30 лет."},{type:"h",text:"Компонент №3: Монтаж (25-35% стоимости)"},{type:"p",text:"Монтаж — это не просто «повесить прибор на стену». Это:"},{type:"h",text:"Алмазное бурение отверстия в стене"},{type:"p",text:"Для бризера нужно отверстие диаметром 132 мм в наружной стене. Мы делаем алмазное бурение с пылесосом — без пыли и трещин. Стоимость:"},{type:"list",items:["Кирпичная стена — 3 500 ₽","Бетонная стена — 4 500 ₽","Железобетонная стена (с арматурой) — 5 500 ₽"]},{type:"p",text:"Почему нельзя сделать перфоратором? Перфоратор создаёт ударную нагрузку — стена трескается, появляются микротрещины, через которые уходит тепло и проникает влага. Алмазное бурение — безударное, отверстие идеально ровное."},{type:"h",text:"Герметизация прохода через стену"},{type:"p",text:"После бурения нужно герметизировать проход, чтобы:"},{type:"list",items:["Не дуло из щелей между трубой и стеной","Не проникала влага с улицы","Не было промерзания стены зимой"]},{type:"p",text:"Мы используем:"},{type:"list",items:["Монтажную пену (заполняет щели)","Пароизоляционную ленту (защищает от влаги изнутри)","Гидроизоляционную ленту (защищает от влаги снаружи)","Утеплитель (предотвращает промерзание)"]},{type:"p",text:"Стоимость герметизации — 2 000-3 000 ₽. Если сделать неправильно, через год стена начнёт промерзать, появится плесень."},{type:"h",text:"Шумоглушение"},{type:"p",text:"Вентилятор создаёт шум, который передаётся по воздуховодам в комнаты. Чтобы этого избежать, мы используем:"},{type:"list",items:["Шумоглушители (вставки из минеральной ваты) — 2 000-4 000 ₽ за штуку","Гибкие вставки (гасят вибрацию от вентилятора) — 1 500-2 500 ₽ за штуку","Виброизоляционные крепления (предотвращают передачу вибрации на стену) — 500-1 000 ₽ за штуку"]},{type:"p",text:"Без шумоглушения вентиляция будет гудеть, как холодильник. С шумоглушением — тише шёпота (25-30 дБ)."},{type:"h",text:"Компонент №4: Проектирование (5-10% стоимости)"},{type:"p",text:"Правильная вентиляция начинается с расчёта. Мы рассчитываем:"},{type:"list",items:["Производительность — по нормам СП 60.13330 (30 м³/час на человека)","Диаметр воздуховодов — чтобы сопротивление было минимальным","Мощность вентилятора — чтобы хватало на все комнаты","Схему разводки — чтобы воздух доходил до каждой комнаты"]},{type:"p",text:"Стоимость проектирования — 3 000-5 000 ₽ для квартиры, 10 000-20 000 ₽ для частного дома."},{type:"p",text:"Почему нельзя сделать «на глаз»? Если воздуховоды слишком узкие — вентилятор работает на износ, шумит, не хватает производительности. Если слишком широкие — переплата за материалы, занимает место под потолком."},{type:"h",text:"Итоговая таблица: из чего складывается стоимость"},{type:"p",text:"Для примера — система вентиляции для 3-комнатной квартиры 70 м² в Иркутске:"},{type:"list",items:["Бризер Ballu OneAir ASP-200 — 62 000 ₽","Воздуховоды (жёсткие, оцинкованные, 15 метров) — 12 000 ₽","Фасонные части (отводы, тройники) — 8 000 ₽","Алмазное бурение (3 отверстия) — 13 500 ₽","Герметизация проходов — 6 000 ₽","Шумоглушение (2 шумоглушителя + гибкие вставки) — 8 000 ₽","Монтажные работы (установка, разводка, пуско-наладка) — 25 000 ₽","Проектирование — 5 000 ₽","ИТОГО: 139 500 ₽"]},{type:"p",text:"Это честная цена за качественную систему, которая будет работать тихо и эффективно 15-20 лет."},{type:"h",text:"Почему нельзя сделать дешевле"},{type:"p",text:"Можно найти предложения за 80-100 тысяч. Но за счёт чего экономия?"},{type:"list",items:["Дешёвое оборудование — шумное, ломается через 2-3 года","Гибкие воздуховоды — высокое сопротивление, шум, негерметичность","Без шумоглушения — вентиляция гудит, как холодильник","Без проектирования — воздуховоды неправильного диаметра, не хватает производительности","Монтаж перфоратором — трещины в стене, промерзание","Без герметизации — дует из щелей, появляется плесень"]},{type:"p",text:"Результат: через год вы вызываете нас, чтобы переделать. И платите дважды."},{type:"h",text:"Наш профессиональный совет"},{type:"p",text:"Вентиляция — это не та статья расходов, на которой стоит экономить. Вы делаете её один раз на 15-20 лет. Лучше заплатить один раз за качественную систему, чем переделывать каждые 3 года."},{type:"p",text:"Если бюджет ограничен, мы рекомендуем:"},{type:"list",items:["Для одной комнаты — бризер Ballu OneAir ASP-100 (39 000 ₽ + монтаж 15 000 ₽ = 54 000 ₽)","Для квартиры — рекуператор Vakio Base (35 000 ₽ + монтаж 20 000 ₽ = 55 000 ₽)","Для частного дома — полноценная система с разводкой (от 140 000 ₽)"]},{type:"p",text:"Все варианты есть в нашем каталоге. Бесплатный выезд инженера поможет определить точную стоимость с учётом особенностей вашего помещения. Звоните — подберём оптимальный вариант под ваш бюджет."}]},"zachem-nuzhna-ventilyatsiya":{date:"2026-07-21",title:"Зачем нужна вентиляция в квартире и как она работает",category:"Вентиляция",summary:"Герметичные пластиковые окна перекрывают приток воздуха — отсюда духота, конденсат на стёклах, плесень и головные боли от избытка CO₂. Для одной комнаты обычно хватает бризера, для квартиры или дома нужна приточно-вытяжная система с рекуперацией.",content:[{type:"p",text:"Многие замечают: после установки новых пластиковых окон в квартире стало душно, на окнах появляется конденсат, а по утрам тяжело дышать. Это не случайность — дело в вентиляции. Разберём, почему так происходит и как решить проблему."},{type:"h",text:"Почему после пластиковых окон становится душно"},{type:"p",text:"Старые деревянные окна пропускали воздух через щели — это была естественная вентиляция, пусть и с потерями тепла. Современные пластиковые окна герметичны: они отлично держат тепло, но и «запирают» воздух. Свежему воздуху просто неоткуда взяться, а углекислый газ и влага накапливаются."},{type:"h",text:"К чему приводит нехватка свежего воздуха"},{type:"list",items:["Духота, тяжело дышать, плохой сон.","Конденсат на окнах, повышенная влажность.","Плесень в углах и на откосах.","Головные боли и усталость из-за избытка CO₂."]},{type:"h",text:"Бризер — простое решение для квартиры"},{type:"p",text:"Бризер (приточный очиститель воздуха) — это компактное устройство, которое подаёт свежий уличный воздух в комнату, очищает его через фильтры и при необходимости подогревает. Не нужно открывать окна — нет сквозняка, уличного шума и пыли. Идеально для спальни и детской."},{type:"h",text:"Рекуператор — с экономией на отоплении"},{type:"p",text:"Приточно-вытяжная установка с рекуперацией работает умнее: она не только подаёт свежий воздух, но и забирает тепло у выходящего воздуха, подогревая им входящий. Зимой это экономит на отоплении и даёт комфортную температуру притока без сквозняка."},{type:"h",text:"Что важно при монтаже вентиляции"},{type:"p",text:"Хорошая вентиляция — это не просто «поставить прибор». Важен правильный расчёт производительности под площадь и количество людей, герметичность соединений, шумоглушение и утепление проходов через стену от конденсата. Всё это мы учитываем при монтаже — подробнее в разделе «Стандарты монтажа»."},{type:"h",text:"Итог"},{type:"p",text:"Если в квартире душно, потеют окна или появляется плесень — проблема в нехватке свежего воздуха. Для одной комнаты обычно достаточно бризера, для квартиры или дома — приточно-вытяжной системы с рекуперацией. Позвоните нам — бесплатно подберём решение под вашу задачу и площадь."}]},"invertornyy-konditsioner-stoit-li-pereplachivat":{date:"2026-07-18",title:"Инверторный кондиционер: за что вы переплачиваете 15 000 ₽ и окупается ли это — разбираем с расчётами",category:"Кондиционеры",summary:"Переплата 15 000 ₽ идёт за инверторный компрессор (+8 000 ₽), электронику (+4 000 ₽), вентилятор (+2 000 ₽) и теплообменник (+1 000 ₽). На электричестве в квартире экономится всего 571 ₽ за сезон, но инвертор служит 12-15 лет вместо 7-10 — чистая выгода 26 852 ₽ за 12 лет.",content:[{type:"p",text:"«Зачем мне инвертор, если обычный на 15 000 ₽ дешевле? Они же оба холодят!» — этот вопрос мы слышим от каждого второго клиента. Давайте разберём честно, с калькулятором в руках: за что вы переплачиваете, как быстро это окупится и когда инвертор действительно не нужен."},{type:"h",text:"Как работает обычный кондиционер (on/off)"},{type:"p",text:"Обычный кондиционер работает по принципу «включился на полную — выключился». Вы ставите температуру +23°C. Компрессор включается на 100% мощности, охлаждает комнату до +23°C и выключается. Температура поднимается до +25°C — компрессор снова включается на 100%."},{type:"p",text:"Проблемы такого подхода:"},{type:"list",items:["Температура «скачет» — то +23°C, то +25°C. Это некомфортно","Пусковые токи — при каждом включении компрессор потребляет в 5-7 раз больше номинала. Это увеличивает расход электричества и износ","Шум — компрессор работает на полную мощность, внешний блок гудит","Перерасход электричества — из-за постоянных включений/выключений КПД системы падает"]},{type:"h",text:"Как работает инверторный кондиционер"},{type:"p",text:"Инверторный кондиционер плавно регулирует мощность компрессора. Вы ставите +23°C. Компрессор включается на 100%, быстро охлаждает комнату до +23°C, а затем снижает мощность до 20-30% и поддерживает температуру, не выключаясь."},{type:"p",text:"Преимущества:"},{type:"list",items:["Ровная температура — без скачков, всегда +23°C ±0.5°C","Нет пусковых токов — компрессор не дёргается, работает плавно","Тише — компрессор работает на пониженной мощности","Экономия электричества — до 30-40% по сравнению с обычным","Дольше служит — компрессор не испытывает пусковых нагрузок"]},{type:"h",text:"За что вы переплачиваете 15 000 ₽"},{type:"p",text:"Разберём по пунктам, из чего складывается разница в цене между обычным и инверторным кондиционером одной мощности (например, 09 BTU):"},{type:"h",text:"1. Инверторный компрессор (+8 000 ₽ к цене)"},{type:"p",text:"Инверторный компрессор сложнее обычного. В нём есть частотный преобразователь, который плавно регулирует скорость вращения. Обычный компрессор — просто включается и выключается."},{type:"p",text:"Инверторный компрессор:"},{type:"list",items:["Работает на переменной скорости (от 20% до 100% мощности)","Не испытывает пусковых нагрузок (в 5-7 раз меньше износа)","Точнее поддерживает температуру (±0.5°C вместо ±2°C)","Служит 12-15 лет вместо 7-10 лет у обычного"]},{type:"h",text:"2. Электроника управления (+4 000 ₽ к цене)"},{type:"p",text:"Инверторный кондиционер требует более сложной платы управления:"},{type:"list",items:["Частотный преобразователь для компрессора","Датчики температуры (внутренний, внешний, теплообменника)","Защита от перепадов напряжения (актуально для Иркутска)","Алгоритмы плавного регулирования мощности"]},{type:"h",text:"3. Более качественный вентилятор (+2 000 ₽ к цене)"},{type:"p",text:"В инверторных моделях обычно ставят вентиляторы с подшипниками качения (а не скольжения). Они тише и служат дольше. Подшипники качения — это +5 лет к сроку службы вентилятора."},{type:"h",text:"4. Лучший теплообменник (+1 000 ₽ к цене)"},{type:"p",text:"В инверторных моделях теплообменник обычно имеет антикоррозийное покрытие (Blue Fin или Gold Fin). Это защищает от ржавчины и увеличивает срок службы на 3-5 лет."},{type:"h",text:"Итого: за что вы переплачиваете"},{type:"list",items:["Инверторный компрессор — +8 000 ₽","Электроника управления — +4 000 ₽","Качественный вентилятор — +2 000 ₽","Лучший теплообменник — +1 000 ₽","ИТОГО: +15 000 ₽ к цене"]},{type:"h",text:"Расчёт экономии электричества"},{type:"p",text:"Теперь посчитаем, сколько электричества экономит инвертор. Для примера возьмём квартиру в Иркутске, кондиционер 09 BTU (2.5 кВт охлаждения), работает 4 месяца в году (июнь-сентябрь), по 8 часов в день."},{type:"h",text:"Обычный кондиционер (on/off)"},{type:"p",text:"Потребление: 0.8 кВт/час (компрессор 0.7 кВт + вентилятор 0.1 кВт). Но компрессор работает не постоянно — примерно 60% времени (остальное — паузы между включениями)."},{type:"list",items:["Потребление в час: 0.8 кВт × 0.6 = 0.48 кВт/час","В день (8 часов): 0.48 × 8 = 3.84 кВт","В месяц (30 дней): 3.84 × 30 = 115.2 кВт","За сезон (4 месяца): 115.2 × 4 = 460.8 кВт","Стоимость (тариф 3.5 ₽/кВт): 460.8 × 3.5 = 1 613 ₽ за сезон"]},{type:"h",text:"Инверторный кондиционер"},{type:"p",text:"Потребление: компрессор работает постоянно, но на пониженной мощности (в среднем 30% от номинала). Вентилятор — 0.1 кВт."},{type:"list",items:["Потребление компрессора: 0.7 кВт × 0.3 = 0.21 кВт/час","Общее потребление: 0.21 + 0.1 = 0.31 кВт/час","В день (8 часов): 0.31 × 8 = 2.48 кВт","В месяц (30 дней): 2.48 × 30 = 74.4 кВт","За сезон (4 месяца): 74.4 × 4 = 297.6 кВт","Стоимость (тариф 3.5 ₽/кВт): 297.6 × 3.5 = 1 042 ₽ за сезон"]},{type:"h",text:"Экономия"},{type:"list",items:["Обычный: 1 613 ₽ за сезон","Инвертор: 1 042 ₽ за сезон","Экономия: 571 ₽ за сезон (35%)"]},{type:"p",text:"На первый взгляд, экономия небольшая — всего 571 ₽ за сезон. Но давайте посчитаем окупаемость за весь срок службы."},{type:"h",text:"Расчёт окупаемости"},{type:"h",text:"Сценарий 1: Квартира, кондиционер работает 4 месяца в году"},{type:"list",items:["Переплата за инвертор: 15 000 ₽","Экономия за сезон: 571 ₽","Окупаемость: 15 000 / 571 = 26 лет"]},{type:"p",text:"Вывод: для квартиры, где кондиционер работает только летом, инвертор НЕ окупается за счёт электричества. Но есть другие факторы — срок службы и комфорт."},{type:"h",text:"Сценарий 2: Офис, кондиционер работает 8 месяцев в году (май-декабрь)"},{type:"list",items:["Экономия за сезон (8 месяцев): 571 × 2 = 1 142 ₽","Окупаемость: 15 000 / 1 142 = 13 лет"]},{type:"p",text:"Вывод: для офиса инвертор окупается за 13 лет — это примерно срок службы обычного кондиционера. То есть инвертор «отбивает» себя за счёт того, что служит дольше."},{type:"h",text:"Сценарий 3: Магазин, кондиционер работает 12 месяцев в году"},{type:"list",items:["Экономия за год: 571 × 3 = 1 713 ₽","Окупаемость: 15 000 / 1 713 = 8.8 лет"]},{type:"p",text:"Вывод: для коммерческих помещений, где кондиционер работает круглый год, инвертор окупается за 9 лет — это быстрее срока службы обычного кондиционера (7-10 лет)."},{type:"h",text:"Скрытая экономия: срок службы"},{type:"p",text:"Но экономия электричества — это не главное. Главное — срок службы:"},{type:"list",items:["Обычный кондиционер: 7-10 лет (из-за пусковых нагрузок компрессор изнашивается быстрее)","Инверторный кондиционер: 12-15 лет (компрессор работает плавно, без пусковых токов)"]},{type:"p",text:"Разница: 5 лет дополнительного срока службы. Сколько стоит новый кондиционер с монтажом? Минимум 35 000 ₽. То есть инвертор экономит вам 35 000 ₽ на замене кондиционера через 10 лет."},{type:"h",text:"Итоговая выгода от инвертора"},{type:"list",items:["Экономия электричества за 12 лет: 571 × 12 = 6 852 ₽","Экономия на замене кондиционера: 35 000 ₽","ИТОГО выгода: 41 852 ₽","Переплата за инвертор: 15 000 ₽","ЧИСТАЯ ВЫГОДА: 26 852 ₽ за 12 лет"]},{type:"h",text:"Когда инвертор НЕ нужен"},{type:"p",text:"Инвертор не нужен, если:"},{type:"list",items:["Кондиционер нужен редко — например, только в самые жаркие дни (10-15 дней в году)","Это дача или съёмная квартира — вы не планируете пользоваться кондиционером дольше 3-5 лет","Бюджет сильно ограничен — лучше взять обычный, чем вообще без кондиционера","Помещение используется не постоянно — гараж, подсобка, склад"]},{type:"p",text:"В этих случаях обычный кондиционер — разумный выбор. Он дешевле, а экономия электричества и срок службы не критичны."},{type:"h",text:"Когда инвертор НУЖЕН"},{type:"p",text:"Инвертор нужен, если:"},{type:"list",items:["Кондиционер работает регулярно — 3+ месяцев в году","Это ваша квартира или дом — вы планируете жить там 10+ лет","Важна тишина — спальня, детская, кабинет","Важна точная температура — винный погреб, серверная, детская","У вас скачки напряжения — инвертор лучше защищён от перепадов"]},{type:"p",text:"В этих случаях инвертор окупится за счёт экономии электричества, большего срока службы и комфорта."},{type:"h",text:"Наш профессиональный совет"},{type:"p",text:"За 10 лет работы мы установили более 3000 кондиционеров в Иркутске. Вот что мы заметили:"},{type:"list",items:["Клиенты с инверторами обращаются по гарантии в 3 раза реже","Инверторы работают тише — клиенты не жалуются на шум","Инверторы точнее держат температуру — клиенты не жалуются на «то холодно, то жарко»","Через 7-8 лет владельцы обычных кондиционеров часто звонят на замену компрессора","Владельцы инверторов через 10 лет звонят только на чистку"]},{type:"p",text:"Если вы берёте кондиционер для квартиры в Иркутске, где он будет работать 3-4 месяца в году, мы рекомендуем инвертор. Да, переплата 15 000 ₽. Но за 12 лет вы сэкономите 41 852 ₽ на электричестве и замене. Плюс комфорт — ровная температура, тишина, отсутствие сквозняков."},{type:"p",text:"Если бюджет ограничен — берите обычный кондиционер. Это лучше, чем вообще без кондиционера. Но будьте готовы, что через 7-10 лет可能需要 замена компрессора (10-15 000 ₽)."},{type:"p",text:"Все инверторные модели есть в нашем каталоге с доставкой и монтажом в Иркутске. Бесплатный выезд инженера поможет подобрать оптимальный вариант под ваш бюджет. Звоните — подберём кондиционер, который прослужит 12-15 лет."}]},"skolko-stoit-ustanovka-konditsionera-irkutsk":{date:"2026-07-15",title:"Сколько стоит установить кондиционер в Иркутске",category:"Кондиционеры",summary:"Стандартный монтаж сплит-системы в Иркутске — от 18 000 ₽, само оборудование — от 17 000 ₽; хороший инвертор для комнаты 20-25 м² обойдётся в 30 000-45 000 ₽. Цена растёт из-за трассы длиннее 3 метров, высотных работ и зимнего комплекта.",content:[{type:"p",text:"Цена на установку кондиционера в Иркутске складывается из двух частей: стоимости самого оборудования и работ по монтажу. Разберём честно, из чего формируется итоговая сумма, чтобы вы понимали, за что платите."},{type:"h",text:"Из чего складывается стоимость"},{type:"list",items:["Сам кондиционер — зависит от бренда, мощности и типа (инверторный или обычный).","Стандартный монтаж — установка блоков, прокладка трассы до 3 метров, вакуумирование, пуско-наладка.","Дополнительные работы — если трасса длиннее, нужен подъём на высоту или сложный доступ."]},{type:"h",text:"Сколько стоит оборудование"},{type:"p",text:"Настенные сплит-системы начинаются примерно от 17 000 ₽ за бюджетные модели on/off и доходят до 100 000 ₽ и выше за премиальные инверторные системы с умным домом. Для стандартной комнаты 20-25 м² хороший инверторный кондиционер обойдётся в 30 000–45 000 ₽."},{type:"h",text:"Сколько стоит монтаж"},{type:"p",text:"Стандартный монтаж кондиционера — от 18 000 ₽. В него входит установка внутреннего и наружного блоков, прокладка и изоляция трассы, вакуумирование магистрали и запуск. Вакуумирование — обязательный этап: без него внутри системы остаётся влага, которая выводит из строя компрессор."},{type:"h",text:"От чего цена может вырасти"},{type:"list",items:["Длинная трасса — каждый метр сверх стандартных 3 метров оплачивается отдельно.","Высотные работы — установка наружного блока на верхних этажах.","Сложное штробление стен под скрытую трассу.","Дополнительное оборудование — зимний комплект, помпа для отвода конденсата."]},{type:"h",text:"Как узнать точную цену"},{type:"p",text:"Точную стоимость мы называем после бесплатного выезда и осмотра — учитываем длину трассы, место установки блоков и особенности вашего помещения. В каталоге на нашем сайте можно выбрать модель по площади и сразу увидеть цену с монтажом. А консультация и замер — бесплатны и ни к чему не обязывают."}]},"skolko-stoyat-plastikovye-okna-irkutsk":{date:"2026-07-10",title:"Сколько стоят пластиковые окна в Иркутске",category:"Окна",summary:"Окно из профиля VEKA стоит от 11 000 ₽ за м², монтаж — примерно от 2 100 ₽ за м², откосы и подоконник считаются отдельно по погонному метру. Стандартное окно 1300×1400 мм под ключ обойдётся ориентировочно в 30 000-40 000 ₽.",content:[{type:"p",text:"Стоимость пластиковых окон зависит от размера, конструкции, профиля и стеклопакета. Плюс отдельно считается монтаж, откосы и подоконник. Разберём, из чего складывается цена, чтобы вы могли ориентироваться в предложениях."},{type:"h",text:"Цена самого окна"},{type:"p",text:"Готовое пластиковое окно из профиля VEKA начинается примерно от 11 000 ₽ за квадратный метр. Итоговая цена зависит от размера конструкции, количества створок, типа стеклопакета и фурнитуры. Чем больше окно и чем больше в нём открывающихся створок — тем выше цена."},{type:"h",text:"Что влияет на стоимость окна"},{type:"list",items:["Размер конструкции — цена считается за квадратный метр.","Количество створок — глухое окно дешевле, чем с двумя открывающимися створками.","Стеклопакет — двухкамерный энергосберегающий дороже обычного, но лучше держит тепло.","Ламинация — окна под дерево или в цвет стоят дороже белых."]},{type:"h",text:"Монтаж, откосы и подоконник"},{type:"p",text:"Кроме самого окна, в смету входят монтажные работы. Монтаж окна — примерно от 2 100 ₽ за м². Откосы и подоконник считаются отдельно по погонному метру. Важно: качественный монтаж шва с паро-влагоизоляцией напрямую влияет на то, будет ли окно тёплым и сухим долгие годы."},{type:"h",text:"Пример расчёта"},{type:"p",text:"Стандартное окно 1300×1400 мм под ключ (окно + монтаж + откосы + подоконник) обойдётся ориентировочно в 30 000–40 000 ₽. Точная сумма зависит от конструкции и комплектации. На нашем сайте есть онлайн-калькулятор окон — введите свои размеры и сразу увидите примерную стоимость с визуализацией."},{type:"h",text:"Как сэкономить без потери качества"},{type:"p",text:"Мы производим окна на собственном производстве, поэтому цена без наценок посредников. Бесплатный замер поможет точно определить размеры — это исключит переплату за «запас». А профиль VEKA и фурнитура MACO прослужат десятилетиями, что выгоднее, чем менять дешёвые окна через несколько лет."}]},"pochemu-poteyut-plastikovye-okna":{date:"2026-07-05",title:"Почему потеют пластиковые окна и что делать",category:"Окна",summary:"Причина конденсата почти всегда не брак окна, а повышенная влажность и нехватка вентиляции. Помогают регулярное проветривание или микропроветривание, свободный доступ тепла от батареи к стеклу и зимний режим фурнитуры. Если конденсат постоянный — нужен бризер.",content:[{type:"p",text:"Конденсат на пластиковых окнах — частая проблема, особенно зимой. Многие думают, что окна бракованные, но чаще причина в другом. Разберём, почему потеют окна и как это исправить."},{type:"h",text:"Главная причина — повышенная влажность и нехватка вентиляции"},{type:"p",text:"Пластиковые окна герметичны — они отлично держат тепло, но и «запирают» воздух в квартире. Влага от дыхания, готовки, стирки и растений накапливается и оседает конденсатом на самой холодной поверхности — стекле. Со старыми деревянными окнами такого не было, потому что они пропускали воздух через щели."},{type:"h",text:"Другие возможные причины"},{type:"list",items:["Широкий подоконник перекрывает поток тёплого воздуха от батареи к окну.","Плотные шторы, которые не дают тёплому воздуху прогревать стекло.","Однокамерный стеклопакет — для климата Иркутска нужен двухкамерный.","Ошибки монтажа — продувание и промерзание из-за некачественного шва."]},{type:"h",text:"Что можно сделать самому"},{type:"list",items:["Регулярно проветривать помещение или ставить окно на микропроветривание.","Не закрывать батарею широким подоконником и плотными шторами.","Переключить фурнитуру на зимний режим (более плотный прижим створки).","Использовать вытяжку на кухне и в ванной."]},{type:"h",text:"Кардинальное решение — вентиляция"},{type:"p",text:"Если проветривание не помогает, а конденсат появляется постоянно — проблема в нехватке свежего воздуха. Лучшее решение — установить бризер или приточно-вытяжную систему. Они подают свежий воздух без открывания окон, снижают влажность и убирают конденсат. Заодно исчезает духота и риск появления плесени."},{type:"h",text:"Когда причина в окне или монтаже"},{type:"p",text:"Если окно промерзает, дует из-под подоконника или из откосов — это уже вопрос качества монтажа. Мы устанавливаем окна по технологии: правильный шаг крепления, пластиковые клинья, запенивание в несколько слоёв и паро-влагоизоляция шва. Если у вас проблема с существующими окнами — приедем, найдём причину и предложим решение."}]},"nuzhno-li-obsluzhivat-konditsioner":{date:"2026-06-30",title:"Нужно ли обслуживать кондиционер и как часто",category:"Кондиционеры",summary:"Полное ТО нужно раз в год, лучше весной перед сезоном; при интенсивной работе в офисе или магазине — два раза в год. Фильтры промывают самостоятельно раз в 1-2 месяца в сезон. Раньше срока стоит вызвать мастера, если появился запах, капает вода или упала мощность.",content:[{type:"p",text:"Многие покупают кондиционер и забывают о нём, пока он работает. Но без обслуживания техника быстро теряет эффективность, начинает неприятно пахнуть и может выйти из строя. Разберём, зачем нужно ТО и как часто его проводить."},{type:"h",text:"Зачем обслуживать кондиционер"},{type:"list",items:["Чистый воздух — в грязном кондиционере размножаются бактерии и плесень, которые попадают в воздух.","Эффективность — забитые фильтры и теплообменник снижают мощность и увеличивают расход электричества.","Долговечность — регулярное ТО продлевает срок службы компрессора и всей системы.","Экономия — вовремя обнаруженная утечка фреона дешевле, чем ремонт компрессора."]},{type:"h",text:"Что входит в обслуживание"},{type:"list",items:["Чистка и промывка фильтров внутреннего блока.","Чистка теплообменника и крыльчатки от пыли и грязи.","Антибактериальная обработка внутреннего блока.","Проверка давления фреона и герметичности системы.","Чистка дренажной системы, чтобы не подтекал конденсат."]},{type:"h",text:"Как часто проводить ТО"},{type:"p",text:"Оптимально — один раз в год, лучше всего весной, перед началом активного сезона. Если кондиционер работает интенсивно (в офисе, магазине, круглый год) — рекомендуется два раза в год. Фильтры при этом желательно промывать самостоятельно раз в 1-2 месяца в сезон."},{type:"h",text:"Признаки, что пора на ТО"},{type:"list",items:["Кондиционер стал хуже холодить или дольше выходит на нужную температуру.","Появился неприятный запах при включении.","Из внутреннего блока капает вода.","Кондиционер стал громче работать.","Вырос расход электроэнергии."]},{type:"h",text:"Доверьте обслуживание специалистам"},{type:"p",text:"Мы выполняем полное обслуживание кондиционеров в Иркутске: чистку, антибактериальную обработку, диагностику и заправку фреоном. Регулярное ТО стоит недорого, а экономит вам на ремонте и продлевает жизнь технике. Позвоните — подскажем, когда вашему кондиционеру нужно обслуживание."}]},"almaznoe-burenie-tsena-i-tehnologiya":{date:"2026-06-25",title:"Алмазное бурение в Иркутске: цены и технология — честный разбор",category:"Алмазное бурение",summary:"В Иркутске отверстие под кондиционер (55-80 мм) стоит от 3 500 ₽, под бризер и вентиляцию (132 мм) — от 4 500 ₽, под трубы и электрику — от 2 000 ₽ за точку. Алмазная коронка режет стену без удара: точность ±1 мм, без трещин, а сухое бурение идёт с пылесосом.",content:[{type:"p",text:"Отверстие под кондиционер, вентиляцию или трубу — мелочь, на которой не принято заострять внимание. А зря: кривое отверстие перфоратором трескает стену и сыплет пыль на свежий ремонт. Как монтажники, мы каждый день сверлим стены и точно знаем, почему алмазное бурение — единственный правильный способ. Разберём технологию и честные цены в Иркутске."},{type:"h",text:"Что такое алмазное бурение"},{type:"p",text:"Это сверление отверстий специальной коронкой, на кромке которой закреплены технические алмазы. Коронка работает безударно: она не долбит стену, а режет её, как штопор. Поэтому отверстие получается идеально ровным и цилиндрическим, а сама стена не получает трещин."},{type:"p",text:"Мы сверлим отверстия диаметром от 32 до 250 мм в бетоне, железобетоне, кирпиче, блоках и натуральном камне."},{type:"h",text:"Где нужно алмазное бурение"},{type:"list",items:["Под кондиционер — отверстие 55–80 мм для трассы сплит-системы.","Под вентиляцию — отверстие 100–160 мм (стандарт для бризера — 132 мм).","Под трубы — водоснабжение, отопление, канализация, от 32 до 250 мм.","Под электрику — подрозетники, кабельные трассы, проходы через стены и перекрытия."]},{type:"h",text:"Чем алмазное бурение лучше перфоратора"},{type:"p",text:"Перфоратор работает ударом. Ударная волна расходится по стене и делает с ней то, что не видно глазу: микротрещины, ослабление краёв, сколы с обратной стороны. Алмазная коронка таких проблем не создаёт."},{type:"list",items:["Точность ±1 мм — отверстие ровное, без сколов и овалов.","Без вибрации — стена и отделка остаются целыми.","Без пыли — сухое бурение идёт с промышленным пылесосом.","Быстрее — бетон и железобетон проходятся в разы быстрее перфоратора.","Любая глубина — можно пройти и перегородку, и несущую стену."]},{type:"h",text:"Сухое и мокрое бурение: в чём разница"},{type:"p",text:"Сухое бурение идёт с подключением промышленного пылесоса, который втягивает всю пыль прямо у коронки. Это вариант для готового ремонта: после нас не нужно убирать. Мокрое бурение использует подачу воды для охлаждения коронки — его применяем для сверхтвёрдых материалов и больших диаметров, когда важнее скорость и ресурс коронки."},{type:"h",text:"От чего зависит цена"},{type:"list",items:["Диаметр отверстия — чем больше коронка, тем дороже.","Материал стены — кирпич дешевле, железобетон с арматурой дороже.","Толщина стены — перекрытия и несущие стены толще перегородок.","Количество отверстий — при объёме даём скидку.","Доступ и высота — работы на стремянке или с лесов считаются отдельно."]},{type:"h",text:"Цены на алмазное бурение в Иркутске"},{type:"list",items:["Отверстие под трубы и электрику (32–250 мм) — от 2 000 ₽/точка.","Отверстие под кондиционер (55–80 мм) — от 3 500 ₽.","Отверстие под бризер или вентиляцию (132 мм) — от 4 500 ₽.","Кирпичная стена — от 3 500 ₽, бетон — от 4 500 ₽, железобетон с арматурой — от 5 500 ₽."]},{type:"p",text:"Это ориентиры: точную цену называем после уточнения диаметра, материала и толщины стены. Звоните — за 5 минут посчитаем по телефону."},{type:"h",text:"Как проходит работа: 4 шага"},{type:"list",items:["Заявка — уточняем диаметр, материал стены, количество отверстий и адрес.","Выезд — приезжаем с оборудованием в согласованное время.","Бурение — разметка, бурение, обеспыливание, уборка рабочей зоны.","Сдача — проверяем отверстия, оплата по факту выполнения."]},{type:"h",text:"Совет от монтажников"},{type:"p",text:"Если стена уже с чистовой отделкой — требуйте именно сухое бурение с пылесосом. Это стоит тех же денег, но квартира останется чистой. Мы сверлим аккуратно и убираем за собой: после нас остаётся только ровное отверстие."},{type:"p",text:"Нужно отверстие под кондиционер, бризер или трубу в Иркутске? Позвоните +7 (914) 914-66-06 — приедем с оборудованием и просверлим без пыли и трещин. Выезд по Иркутску и пригороду до 50 км — 0 ₽."}]},"osteklenie-balkonov-tseny-po-variantam":{date:"2026-06-20",title:"Остекление балкона в Иркутске: цены по вариантам — тёплое и холодное",category:"Окна",summary:"Цены за стандартный балкон 3 метра: тёплое остекление VEKA под ключ — от 38 000 ₽, холодный раздвижной алюминий — от 18 000 ₽, крыша — от 25 000 ₽, утепление — от 15 000 ₽. Холодный вариант даёт +5-7 °C к уличной температуре, тёплый превращает балкон в комнату.",content:[{type:"p",text:"Остекление балкона — одна из тех задач, где цены «на рынке» различаются в два раза, а заказчику непонятно, за что он платит. Разберём по вариантам: тёплое и холодное остекление, крыша, утепление — с реальными ценами в Иркутске и честным объяснением, что в них входит."},{type:"h",text:"Тёплое и холодное остекление: в чём принципиальная разница"},{type:"p",text:"Холодное остекление защищает балкон от снега, дождя, ветра и пыли — но температура на нём зимой будет всего на 5–7 °C выше уличной. Тёплое остекление делает балкон помещением, где держится плюс: его можно объединить с комнатой или использовать как кабинет круглый год."},{type:"h",text:"Вариант 1: Тёплое остекление ПВХ — балкон как комната"},{type:"p",text:"Тёплое остекление делаем на немецком профиле VEKA Softline 70 мм (5 камер) с двухкамерным энергосберегающим стеклопакетом. Профиль с замкнутым стальным армированием держит геометрию десятилетиями, а стеклопакет с напылением Solar зимой бережёт тепло, летом отражает жару."},{type:"list",items:["Профиль VEKA 70 мм, 5 камер, замкнутое армирование.","Двухкамерный стеклопакет 40 мм с энергосбережением.","Фурнитура MACO с микропроветриванием.","Монтаж по ГОСТ 30971 с паро-влагоизоляцией шва."]},{type:"h",text:"Вариант 2: Холодное алюминиевое остекление — защита от осадков"},{type:"p",text:"Холодное остекление выполняем раздвижным алюминием Provedal. Это лёгкая конструкция, которая втрое легче ПВХ и почти не нагружает плиту — лучший выбор для старых балконов, где несущая способность под вопросом."},{type:"list",items:["Раздвижные створки — экономят место на узком балконе.","Вес втрое меньше ПВХ — подходит для старых плит.","Защита от снега, ветра и пыли круглый год.","Температура на балконе — на 5–7 °C выше уличной."]},{type:"h",text:"Цены на остекление балконов в Иркутске"},{type:"p",text:"Цены за стандартный балкон 3 метра. Итоговая стоимость зависит от размеров, этажа и состояния парапета — считаем после бесплатного замера."},{type:"list",items:["Тёплое остекление под ключ (VEKA + стеклопакет) — от 38 000 ₽.","Холодное остекление (раздвижной алюминий) — от 18 000 ₽.","Крыша на балкон с гидроизоляцией — от 25 000 ₽.","Утепление пола, стен и парапета — от 15 000 ₽.","Вынос по подоконнику до 30 см — расширяет площадь."]},{type:"h",text:"Что входит в цену под ключ"},{type:"list",items:["Выезд замерщика и замер парапета.","Демонтаж старой конструкции.","Изготовление на собственном производстве.","Доставка и монтаж, отливы, козырьки.","Уборка после работ и гарантия 5 лет на конструкции."]},{type:"h",text:"Можно ли превратить балкон в тёплую комнату"},{type:"p",text:"Да: тёплое остекление + утепление пола, стен и парапета + тёплый пол. Важный момент — радиатор центрального отопления выносить на балкон нельзя по нормам, поэтому ставим электрический контур или конвектор."},{type:"h",text:"Сроки"},{type:"p",text:"Изготовление конструкций — 5–7 рабочих дней, монтаж остекления — один день. Крыша, утепление и отделка добавляют ещё 2–3 дня."},{type:"h",text:"Наш совет"},{type:"p",text:"Если балкон нужен как кладовка или защита от осадков — берите холодный алюминий, он дешевле и не нагружает плиту. Если хотите тёплое помещение — только ПВХ VEKA с утеплением. Остальное — компромиссы, которые зимой обернутся холодом."},{type:"p",text:"Хотите точную цену на ваш балкон? Позвоните +7 (914) 914-66-06 — бесплатно приедем на замер, посчитаем все варианты и подскажем, что выгоднее именно в вашем доме."}]},"montazh-konditsionera-po-gostu-chek-list":{date:"2026-06-15",title:"Монтаж кондиционера по ГОСТу: чек-лист из 10 пунктов",category:"Кондиционеры",summary:"Отдельного ГОСТа на монтаж бытовых сплит-систем нет — работают по СП 60.13330 и требованиям производителей. Обязательные этапы: алмазное бурение, развальцовка, опрессовка, вакуумирование и пуско-наладка со сдачей по акту. Монтаж 07-12 — от 18 400 ₽, 18-24 — от 20 100 ₽.",content:[{type:"p",text:"Кондиционер ломается не сам по себе — его убивает монтаж. Из 10 лет службы компрессора 8 зависят от того, насколько правильно установлена система. Разберём, что входит в «монтаж по ГОСТу» и по какому чек-листу проверить работу монтажников, даже если вы ничего не понимаете в технике."},{type:"h",text:"Есть ли ГОСТ на монтаж кондиционера"},{type:"p",text:"Честно: единого ГОСТа именно на установку бытовых сплит-систем не существует — в отличие от окон, где есть ГОСТ 30971-2012. Но есть обязательные нормы, которые мы соблюдаем: СП 60.13330 по вентиляции и кондиционированию, требования заводов-производителей и правила безопасной работы с фреоновыми системами. Когда говорят «монтаж по ГОСТу», имеют в виду именно полный технологический цикл, а не «повесили и включили». Вот этот цикл по пунктам."},{type:"h",text:"Чек-лист: 10 пунктов правильного монтажа"},{type:"list",items:["Выезд и разметка — инженер выбирает место блоков, чтобы поток воздуха не дул на людей, а к наружному блоку был доступ для сервиса.","Крепление наружного блока — на анкерные кронштейны с виброгасящими прокладками, строго по уровню.","Алмазное бурение отверстия 55–80 мм с уклоном наружу — без пыли и трещин в стене.","Прокладка трассы — медные трубы в теплоизоляции, дренаж с уклоном, межблочный кабель в гофре.","Развальцовка правильным инструментом — без заломов и микротрещин меди.","Опрессовка — проверка контура давлением азота, чтобы убедиться, что фреон нигде не уйдёт.","Вакуумирование — удаление воздуха и влаги из трассы вакуумным насосом. Критичный этап, о нём ниже.","Электропитание — отдельная линия с автоматом, правильное сечение кабеля.","Пуско-наладка — проверка давления, тест охлаждения и обогрева, замер температуры на выходе.","Сдача по акту — инструктаж, гарантийный талон, уборка после работ."]},{type:"h",text:"Почему нельзя экономить на вакуумировании"},{type:"p",text:"Внутри новой трассы есть воздух и влага. Если их не удалить вакуумным насосом, влага вступает в реакцию с маслом компрессора, образуется кислота, и компрессор разрушается изнутри. Многие «быстрые» монтажники пропускают этот этап или вакуумируют 2 минуты вместо 15–20. Результат: кондиционер, который должен служить 12–15 лет, умирает за 3–5."},{type:"h",text:"Сколько стоит монтаж кондиционера в Иркутске"},{type:"list",items:["Монтаж сплит-системы 07–12 (до 35 м²) — от 18 400 ₽.","Монтаж сплит-системы 18–24 (до 60 м²) — от 20 100 ₽.","Трасса, дополнительный метр — от 2 500 ₽/м.","Зимний комплект (работа до −30 °C) — от 3 000 ₽."]},{type:"p",text:"В стандартный монтаж уже входит трасса 3 метра, кронштейны, алмазное бурение, вакуумирование и пуско-наладка. Точную сумму называем после бесплатного выезда."},{type:"h",text:"Как проверить, что монтаж сделан правильно"},{type:"list",items:["В смете отдельной строкой указано вакуумирование.","Дренажная трубка идёт с уклоном и не висит петлёй.","Наружный блок закреплён на кронштейнах, а не на подоконнике.","Вам выдали акт и гарантийный талон на работы.","Трасса аккуратно уложена в короб или штробу, а не болтается по стене."]},{type:"p",text:"Нужен монтаж кондиционера в Иркутске? Мы ставим по полному циклу — с вакуумированием, опрессовкой и гарантией 1 год на работы. Позвоните +7 (914) 914-66-06 — приедем, посчитаем и установим за один день."}]},"zapravka-konditsionera-freonom-kogda-i-skolko":{date:"2026-06-10",title:"Заправка кондиционера фреоном: когда нужна и сколько стоит",category:"Кондиционеры",summary:"Исправный кондиционер фреон не теряет, поэтому ежегодная дозаправка не нужна. Заправка требуется только при утечке: после некачественного монтажа, демонтажа, повреждения трубки или в технике старше 10 лет. В Иркутске заправка по весу — от 4 000 ₽, поиск утечки — от 3 000 ₽.",content:[{type:"p",text:"«Нужно каждый год заправлять кондиционер фреоном» — самый частый миф, с которым мы сталкиваемся. Разберём честно: когда заправка действительно нужна, как понять, что фреона не хватает, и сколько это стоит в Иркутске."},{type:"h",text:"Главное: исправный кондиционер не теряет фреон"},{type:"p",text:"Фреон циркулирует в герметичном контуре — это замкнутая система из медных труб и теплообменников. Если система исправна, фреон не расходуется и не «испаряется»: один раз заправленный кондиционер работает на этом фреоне весь срок службы. Ежегодная «дозаправка» означает одно — есть утечка, которую надо найти и устранить, а не доливать фреон бесконечно."},{type:"h",text:"Когда заправка действительно нужна"},{type:"list",items:["После некачественного монтажа — утечка через плохо развальцованные соединения.","После демонтажа и повторного монтажа — часть фреона теряется при переподключении.","После ремонта трассы или замены узлов.","Механическое повреждение — пробили трубку, перетёрся дренаж, коррозия соединений.","Кондиционеру 10+ лет — микроутечки на вальцовочных соединениях."]},{type:"h",text:"Признаки нехватки фреона"},{type:"list",items:["Кондиционер хуже холодит или дольше выходит на нужную температуру.","На кранах наружного блока или на медных трубках появляется лёд.","Компрессор работает без остановки, а температура не падает.","Из внутреннего блока дует тёплый воздух в режиме охлаждения.","Слышно шипение в месте соединения — это выходит фреон."]},{type:"h",text:"Сколько фреона нужно и как его заправляют"},{type:"p",text:"Количество фреона указывается на шильдике наружного блока и зависит от мощности. Ориентиры: модель 07 — около 500–700 г, 09 — 600–800 г, 12 — 800–1000 г. Заправку делаем только по весу, а не «на глаз»: контур вакуумируем и заливаем точное количество через весы. Перед заправкой обязательно ищем утечку — иначе через месяц фреон снова уйдёт."},{type:"h",text:"Какой фреон: R32 или R410A"},{type:"p",text:"Современные модели работают на R32 — он дешевле, экологичнее и эффективнее. R410A — устаревающий хладагент, который ещё встречается в технике старше 5–7 лет. Какой фреон нужен вашему кондиционеру, указано на шильдике блока."},{type:"h",text:"Сколько стоит заправка фреона в Иркутске"},{type:"list",items:["Заправка фреоном R32 / R410 по весу с вакуумированием — от 4 000 ₽.","Диагностика с поиском утечки — от 3 000 ₽.","Устранение утечки (пайка, перевальцовка) — по факту после осмотра.","Чистка кондиционера — от 4 000 ₽, антибактериальная обработка — от 2 000 ₽."]},{type:"h",text:"Почему «дозаправка каждый год» — плохой признак"},{type:"p",text:"Если мастер предлагает просто «долить фреон» без поиска утечки — это деньги впустую. Фреон уйдёт снова, а вместе с ним — масло, которое смазывает компрессор. Компрессор начнёт работать всухую и выйдет из строя, а это ремонт за 15 000–30 000 ₽. Правильный порядок: найти утечку → устранить → заправить по весу."},{type:"h",text:"Наш совет"},{type:"p",text:"Заправка нужна не по графику, а по факту — когда диагностика показала нехватку фреона и найдена утечка. За 10 лет работы мы чаще всего находим утечку в вальцовочных соединениях после некачественного монтажа. Если ваш кондиционер стал хуже холодить — не ждите, звоните."},{type:"p",text:"Нужна диагностика или заправка кондиционера в Иркутске? Позвоните +7 (914) 914-66-06 — приедем с манометрическим коллектором и течеискателем, найдём причину и заправим по весу. Выезд в день обращения."}]},"ventilyatsiya-v-chastnom-dome":{date:"2026-06-05",title:"Вентиляция в частном доме: как сделать правильно и сколько это стоит",category:"Вентиляция",summary:"По СП 60.13330 на человека нужно не меньше 30 м³/ч свежего воздуха плюс вытяжка: санузел 50 м³/ч, кухня 60-90 м³/ч. Клапан КИВ-125 с монтажом — от 6 000 ₽, бризер Тион — от 39 000 ₽, рекуператор Vakio — от 35 000 ₽, полная ПВУ с воздуховодами — от 140 000 ₽.",content:[{type:"p",text:"Частный дом сегодня — это тёплый термос: герметичные окна, утеплитель, пароизоляция. Дом перестал «дышать», а значит, свежему воздуху взяться неоткуда. Результат — духота, конденсат на окнах, плесень по углам и спёртый воздух. Разберём, какая вентиляция нужна частному дому и сколько это стоит в Иркутске."},{type:"h",text:"Почему в частном доме вентиляция обязательна"},{type:"p",text:"В квартире естественная вентиляция хоть как-то работает за счёт вытяжных каналов. В частном доме всё сложнее: нет общедомовой шахты, а герметичные окна и утеплитель полностью перекрывают приток. К этому добавляются свои источники влаги и CO₂:"},{type:"list",items:["Дыхание жильцов — накапливается углекислый газ, по утрам тяжело дышать.","Готовка, душ, стирка — повышенная влажность и конденсат на окнах.","Газовый или твердотопливный котёл — ему нужен приток воздуха для горения.","Влага от фундамента и строительных конструкций — риск плесени."]},{type:"h",text:"Какие решения бывают"},{type:"list",items:["Приточные клапаны КИВ-125 — естественный приток без электричества, для отдельных комнат.","Бризеры Тион — приточная вентиляция с многоступенчатой очисткой и подогревом.","Рекуператоры Vakio — приточно-вытяжная вентиляция с возвратом тепла, КПД до 80%.","Полноценная приточно-вытяжная установка с воздуховодами — решение для всего дома."]},{type:"h",text:"Сколько воздуха нужно: нормы"},{type:"p",text:"По нормам СП 60.13330 на каждого человека нужно не меньше 30 м³/ч свежего воздуха. Плюс отдельная вытяжка: санузел — 50 м³/ч, кухня — 60–90 м³/ч в зависимости от плиты. Для семьи из 4 человек в доме 120 м² это около 120 м³/ч притока плюс вытяжка из мокрых зон."},{type:"h",text:"Варианты для дома и цены"},{type:"list",items:["Приточный клапан КИВ-125 с монтажом — от 6 000 ₽.","Бризер Тион — от 39 000 ₽, монтаж от 9 000 ₽.","Рекуператор Vakio — от 35 000 ₽, монтаж от 12 000 ₽.","Полноценная ПВУ с разводкой воздуховодов под ключ — от 140 000 ₽."]},{type:"h",text:"Почему в доме выгодна рекуперация"},{type:"p",text:"Зимой приточный воздух нужно подогревать с −30 °C до +20 °C. Обычный бризер делает это электричеством и «съедает» приличные суммы. Рекуператор возвращает до 80% тепла вытяжного воздуха обратно в приток — подогревать приходится лишь немного. Для дома, где отопление стоит 10 000 ₽/месяц, рекуператор экономит до 8 000 ₽ в месяц и окупается за один-два отопительных сезона."},{type:"h",text:"На что смотреть при монтаже в доме"},{type:"list",items:["Проект — расчёт воздухообмена по площади и количеству жильцов, а не «на глаз».","Воздуховоды — жёсткие оцинкованные, герметичные стыки, без потерь воздуха.","Шумоглушение — вентиляция не должна гудеть в спальнях.","Утепление проходов через стену и холодных участков — против конденсата.","Баланс притока и вытяжки — чтобы не хлопали двери и не было обратной тяги.","Доступ к фильтрам — их нужно менять, значит, узел должен быть обслуживаемым."]},{type:"h",text:"Наш совет"},{type:"p",text:"Для одной-двух комнат в уже построенном доме хватит бризера или рекуператора. Если дом только строится или делаете капремонт — закладывайте полноценную ПВУ с воздуховодами: переделать потом будет в разы дороже. И обязательно с рекуперацией — в иркутские морозы она окупается быстрее всего."},{type:"p",text:"Хотите спроектировать вентиляцию для дома? Позвоните +7 (914) 914-66-06 — приедем на объект, посчитаем воздухообмен и подберём систему под ваш бюджет. Выезд по Иркутску и пригороду до 50 км — 0 ₽."}]},"okna-dlya-doma-iz-brusa":{date:"2026-05-30",title:"Окна для дома из бруса: обсада, усадка и правильный монтаж",category:"Окна",summary:"Окна в сруб ставят только в обсаду: брус естественной влажности усаживается до 5% высоты, это 3-5 см на этаж. Компенсационный зазор сверху — 5-10% высоты проёма, его заполняют утеплителем, а не пеной. Окно VEKA — от 12 800 ₽/м², монтаж по ГОСТ 30971 — от 2 400 ₽/шт.",content:[{type:"p",text:"Окна в доме из бруса — отдельная история. Деревянный сруб «дышит» и усаживается годами, поэтому окно, закреплённое намертво, через пару лет либо выдавит, либо перекосит, и створки перестанут закрываться. Разберём, что такое обсада, какой зазор оставлять и какие окна выбрать для деревянного дома."},{type:"h",text:"Главная ошибка: ставить окно без обсады"},{type:"p",text:"Если закрепить окно жёстко к срубу, при усадке брус давит на раму сверху. Пластиковый профиль не рассчитан на такие нагрузки: раму выгибает, стеклопакет трескается, фурнитура перестаёт работать. Обсада (окосячка) принимает давление усадки на себя и защищает окно."},{type:"h",text:"Что такое обсада и зачем она нужна"},{type:"p",text:"Обсада — это короб из бруса или клееной доски, который ставят в проём сруба. Между верхом обсады и бревном оставляют компенсационный зазор, заполненный утеплителем. Сруб садится, а обсада скользит по пазу и не передаёт нагрузку на окно."},{type:"list",items:["Принимает на себя давление усадки сруба.","Окно крепится к обсаде, а не к брусу напрямую.","Компенсационный зазор сверху — 5–10% высоты проёма.","Устраняет перекос проёма и защищает стеклопакет от выдавливания."]},{type:"h",text:"Сколько даёт усадку брус"},{type:"p",text:"Брус естественной влажности усаживается до 5% высоты — это 3–5 см на этаж. Клееный брус — всего 1–2%, но тоже садится. Поэтому зазор под усадку оставляют всегда, а отделку и окна в доме из бруса естественной влажности часто делают спустя 1–2 года после сборки сруба."},{type:"h",text:"Какие окна выбрать для дома из бруса"},{type:"p",text:"Для деревянного дома важно и тепло, и правильная геометрия. Мы рекомендуем:"},{type:"list",items:["Профиль VEKA WHS 72 или Softline 82 — 5–6 камер, замкнутое стальное армирование.","Двухкамерный энергосберегающий стеклопакет с аргоном.","Фурнитура MACO — выдерживает тяжёлые створки без провисания.","Ламинация под дерево — Золотой дуб, Махагон, Антрацит, чтобы окна вписались в фасад."]},{type:"h",text:"Цены на окна и монтаж в доме из бруса"},{type:"list",items:["Окно VEKA для загородного дома — от 12 800 ₽/м².","Монтаж окна по ГОСТ 30971 — от 2 400 ₽/шт.","Обсада (окосячка) — считается отдельно по проёму.","Откосы и подоконник — по погонным метрам."]},{type:"h",text:"Как правильно монтировать окно в сруб"},{type:"list",items:["Установить обсаду с пазом и компенсационным зазором сверху.","Зазор заполнить утеплителем, а не монтажной пеной — пена жёсткая и мешает усадке.","Окно крепить только к обсаде, с зазором по периметру.","Гидро- и пароизоляция примыканий — чтобы шов не мок и не промерзал.","Снаружи закрыть шов наличником с учётом будущей усадки."]},{type:"h",text:"Наш совет"},{type:"p",text:"Если строите дом из бруса естественной влажности — не торопитесь с чистовой отделкой и окнами, дайте срубу отстояться. А окна ставьте только с обсадой: это та деталь, на которой экономить нельзя, иначе через пару лет придётся менять и окна, и отделку."},{type:"p",text:"Нужны окна для дома из бруса в Иркутске или пригороде? Позвоните +7 (914) 914-66-06 — приедем на замер, рассчитаем окна и монтаж с обсадой, подберём ламинацию под ваш фасад. Выезд до 50 км — 0 ₽."}]},"duet-iz-plastikovogo-okna":{date:"2026-05-25",title:"Дует из пластикового окна: 6 причин и что делать",category:"Окна",summary:"В 9 из 10 случаев дует не из-за брака окна, а из-за сбитой регулировки фурнитуры или изношенного уплотнителя. Сначала проверьте прижим створки листом бумаги — это занимает 5 минут и часто решает проблему без замены окна.",content:[{type:"p",text:"Сквозняк от пластикового окна не означает, что всю конструкцию пора менять. На выездах в Иркутске мы чаще находим сбитый прижим, усевшую створку или задубевший уплотнитель. Найти источник можно поэтапно — от бесплатных проверок к ремонту монтажного шва."},{type:"h",text:"Проверка за 5 минут: тест с листом бумаги"},{type:"p",text:"Откройте створку, положите обычный лист между рамой и уплотнителем и закройте окно. Если лист легко вытягивается, прижим слабый. Повторите тест сверху, снизу и со стороны петель: так станет понятно, нужна общая регулировка или створка просела только в одном месте."},{type:"h",text:"Шесть основных причин продувания"},{type:"list",items:["Цапфы стоят в летнем положении и слабо прижимают створку.","Створка просела под весом стеклопакета и цепляет раму.","Уплотнитель потерял эластичность, потрескался или вышел из паза.","Петли, ответные планки или ручка разболтались.","Монтажный шов под откосом или подоконником имеет пустоты.","Профиль или стеклопакет повреждён — это редкая, но более серьёзная причина."]},{type:"h",text:"Что можно сделать самостоятельно"},{type:"list",items:["Повернуть цапфы шестигранником на 4 мм, усилив прижим на холодный сезон.","Очистить уплотнитель и обработать его силиконовой смазкой.","Подтянуть ручку и проверить, одинаково ли она закрывается по всему ходу.","Не заклеивать щель герметиком до диагностики: это маскирует, а не устраняет причину."]},{type:"h",text:"Когда проблема находится в монтажном шве"},{type:"p",text:"Если лист держится плотно, но холод идёт из-под подоконника, откоса или по периметру рамы, нужно вскрывать примыкание. Правильный узел состоит из монтажной пены, пароизоляции изнутри и защиты от влаги снаружи. Простое допенивание без подготовки обычно помогает только на один сезон."},{type:"h",text:"Сколько стоит ремонт в Иркутске"},{type:"p",text:"Регулировка и перевод фурнитуры в зимний режим стоят от 500 ₽, замена уплотнителя — от 1 500 ₽. Ремонт шва рассчитывается после осмотра, потому что иногда достаточно переделать участок под подоконником, а иногда приходится снимать откосы. Для сравнения: монтаж нового окна стоит от 2 400 ₽ без стоимости конструкции, поэтому начинать разумнее с ремонта."},{type:"h",text:"Как не допустить повторного продувания"},{type:"p",text:"Раз в год очищайте и смазывайте уплотнитель, весной ослабляйте прижим, а осенью проверяйте его листом. Не тяните ручку силой: тугой ход говорит о том, что створку пора отрегулировать."},{type:"p",text:"Не хотите разбирать окно наугад? Позвоните +7 (914) 914-66-06 — мастер «Вектор Комфорта» найдёт место продувания, предложит регулировку или ремонт шва и не станет навязывать замену исправного окна."}],faq:[{q:"Почему дует из нового пластикового окна?",a:"В 90% случаев дело не в окне, а в регулировке или монтажном шве. Сначала проверьте прижим створки листом бумаги и переведите фурнитуру в зимний режим. Если дует из-под подоконника — некачественно заделан шов, это исправляется без замены окна."},{q:"Сколько стоит устранить продувание?",a:"Замена уплотнителя — от 1 500 ₽, регулировка фурнитуры и перевод в зимний режим — от 500 ₽. Диагностика при заказе работ — бесплатно. Это дешевле, чем менять окно за 15 000–30 000 ₽."},{q:"Можно ли отрегулировать окно самостоятельно?",a:"Перевод цапф в зимний режим и регулировка петель шестигранником — простые операции, их реально сделать самому за 15 минут. Но если после этого дует не перестало, лучше вызвать мастера: причина может быть в монтажном шве."}]},"okna-propyskayut-shum":{date:"2026-05-20",title:"Пластиковые окна и шум: как сделать в квартире тише",category:"Окна",summary:"Шум в квартиру проходит через стеклопакет и монтажный шов. Решение — стеклопакет со стёклами разной толщины или триплексом и герметичный трёхслойный шов. Количество камер профиля на тишину почти не влияет.",content:[{type:"p",text:"Когда после установки пластиковых окон слышны машины, разговоры и гул улицы, виноват не обязательно профиль. Звук идёт по самому слабому участку: через стеклопакет, неплотный прижим створки или пустоты в монтажном шве. Поэтому сначала ищем канал шума, а уже потом выбираем решение."},{type:"h",text:"Почему число камер профиля не решает проблему"},{type:"p",text:"Профиль занимает небольшую часть площади окна, а основную — стеклопакет. Пять или семь камер помогают сохранять тепло и жёсткость рамы, но разницу в уличном шуме чаще определяют толщина стёкол, расстояние между ними и герметичность примыкания."},{type:"h",text:"Как работает стеклопакет со стёклами разной толщины"},{type:"p",text:"Одинаковые стёкла резонируют на близких частотах. Асимметричная формула, например 6–12–4–10–4 мм, сдвигает резонансы и лучше гасит транспортный гул. Для квартиры у оживлённой дороги мы рассматриваем наружное стекло 6 мм или триплекс."},{type:"h",text:"Когда нужен триплекс"},{type:"p",text:"Триплекс состоит из двух стёкол, соединённых плёнкой. Слоистая конструкция снижает шум примерно до 38–42 дБ в составе правильно подобранного пакета и дополнительно удерживает осколки при повреждении. Это разумная доплата для первых этажей и домов рядом с магистралью."},{type:"h",text:"Не забывайте о створке и монтажном шве"},{type:"list",items:["Проверьте прижим створки листом бумаги по всему периметру.","Осмотрите уплотнитель: разрывы и жёсткие участки пропускают звук и воздух.","Проверьте примыкания под откосами и подоконником на пустоты.","Трёхслойный шов должен иметь пену, внутреннюю пароизоляцию и наружную влагозащиту."]},{type:"h",text:"Можно ли улучшить тишину без замены всего окна"},{type:"p",text:"Да. Если профиль целый, можно отрегулировать фурнитуру, заменить уплотнитель или только стеклопакет. Но ставить более тяжёлый триплекс без проверки петель и армирования нельзя: мастер должен оценить допустимый вес створки."},{type:"h",text:"Как выбираем решение в Иркутске"},{type:"p",text:"На замере оцениваем источник и характер шума, размеры створок и состояние шва. Монтаж окна начинается от 2 400 ₽, а стоимость стеклопакета зависит от формулы и площади, поэтому точный расчёт делаем после замера, а не обещаем универсальную цену по телефону."},{type:"p",text:"Хотите понять, где именно проходит звук? Позвоните +7 (914) 914-66-06 — «Вектор Комфорта» проверит прижим и монтажный узел, рассчитает замену стеклопакета с разными стёклами или триплексом."}],faq:[{q:"Почему после замены окон стало шумнее?",a:"Чаще всего виноват монтажный шов: если его запенили без паро-влагоизоляции и оставили щели, звук проходит по периметру. Вторая причина — стеклопакет с одинаковыми стёклами, которые резонируют. Обе проблемы решаются."},{q:"Какое стекло лучше всего гасит шум?",a:"Триплекс — два стекла, склеенные плёнкой. Он гасит до 38–42 дБ и работает лучше обычного двухкамерного пакета. Для квартир у магистралей это оптимальный выбор."},{q:"Сколько камер профиля нужно для тишины?",a:"Камеры профиля отвечают за тепло, а не за звук. Для тишины важнее стеклопакет со стёклами разной толщины или триплекс и герметичный монтажный шов."}]},"zimniy-letniy-rezhim-okon":{date:"2026-05-15",title:"Зимний и летний режим окон: как перевести и зачем",category:"Окна",summary:"Зимний режим усиливает прижим створки, чтобы не дуло, летний — ослабляет, чтобы не изнашивать уплотнитель. Переводится шестигранником за 10 минут: цапфы (эксцентрики) на торце створки поворачивают меткой к уплотнителю.",content:[{type:"p",text:"Зимним и летним режимом называют положение запорных цапф, которое меняет силу прижима створки к уплотнителю. Функция есть не у каждой фурнитуры, поэтому перед регулировкой найдите на эксцентрике метку и убедитесь, что деталь действительно поворачивается."},{type:"h",text:"Как проверить текущий прижим"},{type:"p",text:"Зажмите лист бумаги закрытой створкой и потяните. Если он выходит почти без сопротивления, прижим слабый; если рвётся или вытягивается туго — сильный. Проверьте несколько точек, потому что просевшая створка может прижиматься неравномерно."},{type:"h",text:"Как перевести окно в зимний режим"},{type:"list",items:["Откройте створку и найдите все цапфы по её торцу.","Очистите механизм от пыли и нанесите каплю масла для фурнитуры.","Шестигранником на 4 мм поверните каждую цапфу меткой к уплотнителю.","Закройте окно без усилия и снова выполните тест с листом."]},{type:"h",text:"Почему нельзя держать максимальный прижим круглый год"},{type:"p",text:"Постоянно сжатая резина быстрее теряет форму, а ручка и запорные элементы работают с повышенной нагрузкой. Весной прижим лучше ослабить. Летний режим не проветривает комнату сам по себе — для воздуха используйте микропроветривание или приточную вентиляцию."},{type:"h",text:"Что делать, если ручка стала закрываться туго"},{type:"p",text:"Не давите на неё. Верните цапфы в среднее положение и проверьте, не задевает ли створка ответные планки. Возможно, нужно поднять или сместить створку регулировочными винтами на петлях."},{type:"h",text:"Когда смена режима не поможет"},{type:"list",items:["Уплотнитель потрескался или вышел из паза.","Холод идёт из-под откоса либо подоконника, а не между створкой и рамой.","Створка заметно провисла или профиль деформирован.","Цапфы и ответные планки изношены."]},{type:"h",text:"Цена регулировки в Иркутске"},{type:"p",text:"Простая регулировка стоит от 500 ₽, замена уплотнителя — от 1 500 ₽. Если причина в монтажном шве, стоимость назовём после осмотра. Исправную конструкцию менять не предлагаем."},{type:"p",text:"Не получается добиться равномерного прижима? Позвоните +7 (914) 914-66-06 — мастер «Вектор Комфорта» настроит створку, проверит уплотнитель и покажет, как безопасно менять сезонный режим."}],faq:[{q:"Как перевести окна в зимний режим?",a:"Найдите на торце створки цапфы (эксцентрики) и поверните их шестигранником на 4 мм меткой к уплотнителю. Это усилит прижим и уберёт продувание."},{q:"Когда переводить окна на зимний режим?",a:"Осенью, с наступлением холодов. Весной верните летний режим, чтобы уплотнитель не изнашивался от постоянного сжатия."},{q:"Что делать, если после перевода всё равно дует?",a:"Значит, изношен уплотнитель или некачественный монтажный шов. Замена уплотнителя — от 1 500 ₽, диагностика у нас бесплатна при заказе работ."}]},"energosberegayushchiy-steklopaket-i-steklo":{date:"2026-05-10",title:"Энергосберегающий стеклопакет: i-стекло, аргон и мультифункциональное покрытие",category:"Окна",summary:"i-стекло (Low-E) отражает тепло обратно в комнату и делает двухкамерный пакет на 30–40% теплее обычного. Для Иркутска оптимален двухкамерный пакет с i-стеклом и аргоном; мультифункциональное стекло дополнительно спасает от жары летом.",content:[{type:"p",text:"Теплоизоляция окна зависит прежде всего от стеклопакета: он занимает до 80% площади конструкции. В Иркутске обычного двухкамерного пакета часто недостаточно у больших проёмов и на ветреной стороне. Разбираемся, за какие технологии стоит доплатить."},{type:"h",text:"Что такое i-стекло"},{type:"p",text:"На поверхность Low-E стекла нанесён почти невидимый слой металлов. Он пропускает дневной свет, но отражает длинноволновое тепло от радиаторов и нагретых предметов обратно в комнату. Покрытие разворачивают внутрь герметичной камеры, поэтому при эксплуатации оно не стирается."},{type:"h",text:"Зачем камеру заполняют аргоном"},{type:"p",text:"Аргон проводит тепло хуже воздуха и уменьшает конвекцию внутри камеры. При герметичной сборке он даёт прибавку примерно 10–15%. Сам по себе аргон не заменяет Low-E покрытие, а работает вместе с ним."},{type:"h",text:"Чем мультифункциональное стекло отличается от i-стекла"},{type:"p",text:"i-стекло в основном сохраняет внутреннее тепло. Мультифункциональное покрытие дополнительно отражает часть солнечной энергии, поэтому летом комната меньше перегревается. Его выбирают для южных и западных окон, панорамного остекления и лоджий."},{type:"h",text:"Оптимальная формула для Иркутска"},{type:"list",items:["Две камеры — базовый вариант для отапливаемого жилья.","Low-E стекло со стороны комнаты — для сохранения тепла зимой.","Аргон в камерах — как доступное усиление теплоизоляции.","Тёплая дистанционная рамка — снижает риск конденсата по краю.","Мультифункциональное наружное стекло — для солнечного фасада."]},{type:"h",text:"Как проверить наличие энергосберегающего покрытия"},{type:"p",text:"Поднесите к стеклу пламя зажигалки и посмотрите на отражения под углом: одно обычно отличается по оттенку. Но такой тест показывает только наличие покрытия, а не состав пакета. Надёжнее сверить маркировку на дистанционной рамке и паспорт изделия."},{type:"h",text:"Цена и окупаемость"},{type:"p",text:"Доплата за i-стекло составляет от 500–800 ₽/м², за аргон — от 200–400 ₽/м². На отоплении и комфорте у холодного окна вложение обычно окупается за 2–4 сезона. Монтаж окна в Иркутске начинается от 2 400 ₽."},{type:"p",text:"Нужно рассчитать стеклопакет под ваш этаж и сторону света? Позвоните +7 (914) 914-66-06 — «Вектор Комфорта» подберёт формулу без лишних опций и рассчитает изготовление и монтаж."}],faq:[{q:"Что такое i-стекло в стеклопакете?",a:"Это стекло с низкоэмиссионным напылением, которое отражает тепло обратно в комнату. Такой стеклопакет на 30–40% теплее обычного при той же прозрачности."},{q:"Нужен ли аргон в стеклопакете?",a:"Да, для иркутского климата это оправданная доплата: аргон проводит тепло хуже воздуха, и окно держит тепло лучше на 10–15%."},{q:"Сколько стоит энергосберегающий стеклопакет?",a:"Доплата за i-стекло — от 500–800 ₽/м², аргон — от 200–400 ₽/м². Окупается экономией на отоплении за 2–4 сезона."}]},"mozhno-li-obedinit-balkon-s-komnatoi":{date:"2026-05-05",title:"Можно ли объединить балкон с комнатой: закон, согласование и что делать вместо",category:"Окна",summary:"Полное объединение балкона или лоджии с комнатой запрещено: сносить подоконный блок и порог, чтобы сделать единое пространство, не согласуют. Легальная альтернатива — французское остекление: демонтируют только окно и дверь, порог и подоконный блок остаются.",content:[{type:"p",text:"Идея присоединить лоджию кажется простой: убрать окно с дверью, снести нижнюю часть стены и продолжить комнату. На практике затрагиваются фасад, тепловой контур дома и иногда несущая конструкция. Поэтому сначала определяют допустимый вариант, а не начинают демонтаж."},{type:"h",text:"Что нельзя делать"},{type:"list",items:["Сносить подоконный блок и порог ради единого помещения без разделения.","Убирать несущие простенки или расширять проём без проекта.","Переносить радиатор центрального отопления на балкон или лоджию.","Подключать водяной тёплый пол к общедомовой системе.","Менять вид фасада и остекления вопреки правилам дома."]},{type:"h",text:"Легальная альтернатива: французское остекление"},{type:"p",text:"Демонтируют окно и балконную дверь, а проём закрывают прозрачными распашными или раздвижными дверями. Подоконный блок и порог сохраняются. Комната и лоджия остаются разделёнными, но света и визуального пространства становится больше."},{type:"h",text:"Как сделать лоджию тёплой"},{type:"list",items:["Установить тёплое остекление VEKA с двухкамерным энергосберегающим пакетом.","Утеплить парапет, боковые стены, потолок и пол единым контуром.","Исключить мостики холода в углах и монтажных примыканиях.","Смонтировать электрический тёплый пол или конвектор.","Обеспечить приток и вытяжку, чтобы на стёклах не собирался конденсат."]},{type:"h",text:"Почему одного тёплого окна недостаточно"},{type:"p",text:"Холод идёт не только через стекло, но и через бетонную плиту, парапет и стыки. Если утеплить лишь фасадную часть, углы промерзают, появляется конденсат и плесень. Нужен теплотехнически непрерывный контур."},{type:"h",text:"Согласование и проект"},{type:"p",text:"Требования зависят от серии дома и муниципальных правил. До работ запросите техническое заключение и согласуйте решение с проектировщиком и управляющей организацией. Исполнитель по остеклению не заменяет специалиста по перепланировкам."},{type:"h",text:"Сколько стоит остекление"},{type:"p",text:"Цена зависит от длины лоджии, высоты створок, профиля и состава стеклопакета. Монтаж окна начинается от 2 400 ₽, утепление и отделка считаются после замера. Мы отдельно показываем стоимость конструкции, монтажа и дополнительных работ."},{type:"h",text:"Правильная последовательность"},{type:"p",text:"Сначала определите законный вариант и получите необходимые согласования, затем закажите замер остекления, разработайте узлы утепления и только после этого переходите к демонтажу и отделке. Так не придётся переделывать уже готовый ремонт."},{type:"p",text:"Планируете тёплую лоджию в Иркутске? Позвоните +7 (914) 914-66-06 — «Вектор Комфорта» выполнит замер, подберёт VEKA и энергосберегающий пакет и честно обозначит, какие строительные решения нужно согласовать отдельно."}],faq:[{q:"Можно ли убрать стену между комнатой и балконом?",a:"Полностью — нет. Сносить подоконный блок и порог, объединяя балкон с комнатой, запрещено. Можно демонтировать только окно и балконную дверь (французское остекление) с сохранением порога и подоконного блока."},{q:"Можно ли вынести батарею на балкон?",a:"Нет, вынос радиатора центрального отопления на балкон или лоджию запрещён. Отапливать можно электрическим тёплым полом или конвектором."},{q:"Как сделать тёплую лоджию законно?",a:"Тёплое остекление VEKA + утепление стен, пола и потолка + электрический тёплый пол. Дверь между комнатой и лоджией остаётся, а помещением пользуетесь круглый год."}]},"kuda-veshat-konditsioner":{date:"2026-04-28",title:"Куда вешать кондиционер: правила размещения внутреннего и наружного блока",category:"Кондиционеры",summary:"Внутренний блок вешают на 10–15 см ниже потолка, чтобы холодный воздух шёл вдоль него, а не на кровать или рабочее место. Наружный блок ставят с зазором 20–25 см от стены и так, чтобы к нему оставался доступ для сервиса.",content:[{type:"p",text:"Место для кондиционера выбирают до покупки и отделки. От него зависят комфорт, длина трассы, отвод конденсата и стоимость монтажа. Главный принцип: охлаждать объём комнаты, а не человека под прямой струёй."},{type:"h",text:"Высота и свободное пространство"},{type:"p",text:"Верх внутреннего блока располагаем на 10–15 см ниже потолка, а по бокам оставляем место по инструкции производителя. Вплотную к шкафу или шторе ставить нельзя: перекрытый забор воздуха снижает производительность и повышает шум."},{type:"h",text:"Куда направить поток"},{type:"list",items:["В спальне — вдоль потолка, в сторону изножья, а не на голову.","В гостиной — мимо дивана и постоянного рабочего места.","В детской — так, чтобы поток не попадал в игровую и спальную зоны.","На кухне — подальше от плиты и вытяжки, где много жира и горячего воздуха."]},{type:"h",text:"Длина трассы и дренаж"},{type:"p",text:"Чем короче путь до наружного блока, тем проще и надёжнее монтаж. Дренаж ведём с постоянным уклоном к улице или в канализацию через сифон. Горизонтальные карманы становятся причиной застоя, запаха и протечек."},{type:"h",text:"Где размещать наружный блок"},{type:"p",text:"За задней стенкой оставляем 20–25 см, перед вентилятором — свободное пространство для выброса горячего воздуха. Блок не должен стоять в закрытой нише или на непроветриваемом застеклённом балконе. К кранам и крышке нужен безопасный доступ для чистки и ремонта."},{type:"h",text:"Вибрация, вода и соседи"},{type:"list",items:["Кронштейны крепим в прочное основание, а не в рыхлую облицовку.","Ставим виброопоры, если конструкция стены передаёт гул.","Конденсат отводим так, чтобы он не капал на окна, фасад и прохожих.","Проверяем требования управляющей компании к размещению на фасаде."]},{type:"h",text:"Что входит в правильный монтаж"},{type:"p",text:"Стандартный монтаж кондиционера в Иркутске стоит от 18 400 ₽ и включает крепление блоков, трассу до 3 м, алмазное бурение, вакуумирование и пуско-наладку. Длинная трасса, высотные работы и декоративные короба считаются отдельно после замера."},{type:"h",text:"Сначала план, потом отверстия"},{type:"p",text:"До бурения проверяем скрытую проводку, материал стены, направление трассы и возможность обслужить наружный блок. Перенос уже установленной системы почти всегда дороже бесплатного предварительного замера."},{type:"p",text:"Не уверены, какое место будет комфортным? Позвоните +7 (914) 914-66-06 — инженер «Вектор Комфорта» приедет на бесплатный замер, предложит безопасную схему блоков и рассчитает монтаж без скрытых работ."}],faq:[{q:"На какой высоте вешать внутренний блок кондиционера?",a:"На 10–15 см ниже потолка. Холодный воздух идёт вдоль потолка, охлаждает комнату и плавно опускается — поток не попадает на людей."},{q:"Можно ли вешать кондиционер над кроватью?",a:"Нежелательно: прямой поток холодного воздуха на спящего — главная причина переохлаждения и дискомфорта. Лучше сместить блок к изножью или в сторону, а поток направить вдоль потолка."},{q:"Можно ли ставить наружный блок на застеклённом балконе?",a:"Нет, если балкон не проветривается: блоку не хватит воздуха, он перегреется и потеряет мощность. Нужен свободный доступ воздуха к задней стенке и перед вентилятором."}]},"konditsioner-na-obogrev-zimoy":{date:"2026-04-22",title:"Можно ли обогревать квартиру кондиционером зимой",category:"Кондиционеры",summary:"Современные инверторные сплит-системы греют до −15 °C, с зимним комплектом — до −25…−30 °C. В сибирский мороз кондиционер — это подстраховка в межсезонье, а не замена отоплению: при −30 °C его эффективность резко падает.",content:[{type:"p",text:"В режиме обогрева кондиционер не превращает электричество в тепло напрямую, а переносит его с улицы в помещение. Поэтому осенью и весной он заметно экономичнее конвектора. Но у каждой модели есть нижний температурный предел, который нельзя игнорировать."},{type:"h",text:"Почему тепловой насос экономичнее обогревателя"},{type:"p",text:"При плюсовой температуре и лёгком морозе исправная сплит-система переносит 3–4 кВт тепла на каждый 1 кВт потреблённой электроэнергии. Конвектор даёт примерно 1 кВт тепла на 1 кВт электричества. Именно поэтому кондиционер выгоден в межсезонье."},{type:"h",text:"Температурные ограничения"},{type:"list",items:["Обычные on/off модели часто разрешено включать только до −5…−7 °C.","Большинство бытовых инверторов рассчитано на обогрев до −15 °C.","Низкотемпературные модели и системы с зимним комплектом работают до −25…−30 °C.","Точный предел указан в паспорте конкретной модели, а не определяется только словом «инвертор»."]},{type:"h",text:"Что происходит в сильный мороз"},{type:"p",text:"Тепла в наружном воздухе становится меньше, давление хладагента падает, а наружный теплообменник чаще обмерзает. Система уходит в разморозку и на несколько минут перестаёт греть комнату. Производительность снижается, а нагрузка на компрессор растёт."},{type:"h",text:"Что даёт зимний комплект"},{type:"p",text:"Подогрев картера помогает компрессору безопасно стартовать, а подогрев дренажа не даёт конденсату замёрзнуть в трубке. Комплект стоит от 3 000 ₽, но он не создаёт дополнительного тепла и не отменяет паспортный предел модели."},{type:"h",text:"Как безопасно включать обогрев"},{type:"list",items:["Сверьтесь с температурным диапазоном в инструкции.","После холодного простоя дайте подогреву картера время поработать, если он предусмотрен.","Не отключайте питание наружного блока на весь зимний сезон у низкотемпературной модели.","Следите, чтобы лёд не блокировал вентилятор и дренаж."]},{type:"h",text:"Какую роль кондиционер играет в Иркутске"},{type:"p",text:"Это отличная подстраховка до начала отопительного сезона, источник тепла в прохладный летний день и экономичное решение при небольшом минусе. При иркутских −30 °C основное отопление должно оставаться отдельным и рассчитанным на дом."},{type:"h",text:"Стоимость установки"},{type:"p",text:"Монтаж сплит-системы начинается от 18 400 ₽: до 3 м трассы, бурение, вакуумирование и запуск. Низкотемпературную модель и зимний комплект подбираем по площади и реальным условиям, а не только по рекламной цифре."},{type:"p",text:"Нужен кондиционер для обогрева в межсезонье? Позвоните +7 (914) 914-66-06 — «Вектор Комфорта» подберёт модель с подходящим температурным диапазоном и установит её с гарантией на работы."}],faq:[{q:"До какой температуры кондиционер греет?",a:"Инверторные модели штатно работают на обогрев до −15 °C, с зимним комплектом — до −25…−30 °C. При более сильных морозах эффективность падает, и кондиционер перестаёт быть выгодным."},{q:"Выгодно ли топить кондиционером вместо обогревателя?",a:"Да, в межсезонье и при лёгких морозах: тепловой насос даёт 3–4 кВт тепла на 1 кВт электричества, это втрое дешевле электроконвектора. В сильный мороз (−30 °C) выгода сходит на нет."},{q:"Нужен ли зимний комплект для обогрева?",a:"Если планируете греть при морозах ниже −15 °C — да. Комплект (подогрев картера и дренажа) стоит от 3 000 ₽ и защищает компрессор от холодного пуска."}]},"konditsioner-ploho-holodit":{date:"2026-04-16",title:"Кондиционер плохо холодит: 7 причин и что делать",category:"Кондиционеры",summary:"Три главные причины: грязные фильтры, утечка фреона и забитый радиатор наружного блока. Начните с промывки фильтров — это 5 минут и бесплатно, а в половине случаев проблема уходит сразу.",content:[{type:"p",text:"Если кондиционер включается и дует, но комната остаётся жаркой, не спешите заправлять фреон. Исправная герметичная система не расходует хладагент ежегодно. Диагностику начинаем с режима, фильтров и теплообменников, а давление измеряем после этих проверок."},{type:"h",text:"Первые действия без мастера"},{type:"list",items:["Поставьте режим Cool, температуру 18–20 °C и среднюю скорость вентилятора.","Закройте окна и двери, уберите плотные шторы от блока.","Достаньте сетчатые фильтры, промойте водой и полностью высушите.","Через 15 минут сравните температуру воздуха на входе и выходе."]},{type:"h",text:"Семь частых причин слабого охлаждения"},{type:"list",items:["Грязные фильтры внутреннего блока ограничивают поток воздуха.","Пылью и пухом забит теплообменник наружного блока.","Через негерметичное соединение ушла часть фреона.","Теплообменник обмерзает из-за грязи, нехватки воздуха или хладагента.","Кондиционер подобран без запаса на солнечную сторону и теплопритоки.","Наружный блок перегревается в закрытой нише или на балконе.","Неисправен датчик, плата, вентилятор или компрессор."]},{type:"h",text:"Как распознать утечку фреона"},{type:"p",text:"Косвенные признаки — иней на кранах и тонкой трубке, масляные следы на соединениях, шипение и постепенное падение мощности. Но похожие симптомы даёт грязный теплообменник. Поэтому мастер сначала ищет место утечки течеискателем и устраняет его, а потом вакуумирует и заправляет систему по норме."},{type:"h",text:"Почему нельзя просто долить хладагент"},{type:"p",text:"Без ре
