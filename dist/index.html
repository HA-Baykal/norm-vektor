<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Сколько стоит установка кондиционера в Иркутске?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Стоимость установки кондиционера зависит от модели и сложности монтажа. Стандартный монтаж — от 18 000 ₽. Мы делаем бесплатный выезд и замер, после чего называем точную цену. Продажа и монтаж кондиционера выполняются за 1 день, с гарантией от завода от 3 до 5 лет."
      }
    },
    {
      "@type": "Question",
      "name": "За сколько дней изготавливают пластиковые окна?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Срок изготовления пластиковых окон — 5-7 рабочих дней. Мы используем собственное производство, профиль VEKA и фурнитуру MACO с микропроветриванием. Гарантия на окна — 5 лет, на монтажные работы — 1 год."
      }
    },
    {
      "@type": "Question",
      "name": "Выезжаете ли вы на замер бесплатно?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Да, выезд специалиста, замер и консультация абсолютно бесплатны и ни к чему вас не обязывают. Мы работаем в Иркутске, Ангарске, Шелехове, Хомутово и пригороде до 50 км."
      }
    },
    {
      "@type": "Question",
      "name": "Какие окна вы делаете?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Изготавливаем любые пластиковые окна: обычные и панорамные окна ПВХ, остекление балконов и лоджий, крашеные окна, ламинацию под дерево или цвет, двери, витражи и стеклянные перегородки."
      }
    },
    {
      "@type": "Question",
      "name": "Делаете ли вентиляцию для квартиры и бизнеса?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Да, проектируем и монтируем приточную и вытяжную вентиляцию под ключ. Устанавливаем бризеры, рекуператоры и приточно-вытяжные системы Тион, Vakio для квартир, домов, кафе и офисов."
      }
    },
    {
      "@type": "Question",
      "name": "Что такое алмазное бурение и когда оно нужно?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Алмазное бурение — это аккуратное сверление отверстий в бетоне, железобетоне и кирпиче диаметром от 32 до 250 мм. Нужно под трубы, вентиляцию и кондиционеры. Работаем сухим способом с пылесосом без пыли и мокрым способом с водой — без трещин и сколов."
      }
    },
    {
      "@type": "Question",
      "name": "Можно ли заболеть от кондиционера?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Сам по себе кондиционер не вызывает болезнь. Болеют из-за грязных фильтров (рассадник бактерий), закрытых окон (накопление CO2 и вирусов) и неправильной температуры (переохлаждение). Регулярная чистка фильтров и проветривание решают 90% проблем."
      }
    },
    {
      "@type": "Question",
      "name": "Инверторный или обычный кондиционер — что выбрать?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Инверторный кондиционер экономит электричество до 30-40%, работает тише, держит ровную температуру и служит 12-15 лет (вместо 7-10 у обычного). Для квартиры, где кондиционер работает регулярно, рекомендуем инвертор. Для дачи (редкое использование) подойдёт обычный."
      }
    },
    {
      "@type": "Question",
      "name": "Бризер или рекуператор — что выбрать?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Бризер подаёт свежий воздух с улицы, очищает и подогревает. Рекуператор подаёт свежий + забирает отработанный воздух, экономя тепло (КПД 80%). Для Иркутска с длинной зимой рекуператор окупается за 2 недели отопительного сезона."
      }
    },
    {
      "@type": "Question",
      "name": "Почему потеют пластиковые окна?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Главная причина — повышенная влажность и нехватка вентиляции. Пластиковые окна герметичны и «запирают» воздух. Решение: проветривание, микропроветривание, установка бризера или приточно-вытяжной системы."
      }
    }
  ]
}

е балконов и лоджий, крашеные окна, ламинацию под дерево или цвет, двери, витражи и стеклянные перегородки."},{q:"Делаете ли вентиляцию для квартиры и бизнеса?",a:"Да, проектируем и монтируем приточную и вытяжную вентиляцию под ключ. Устанавливаем бризеры, рекуператоры и приточно-вытяжные системы Тион, Vakio для квартир, домов, кафе и офисов."},{q:"Что такое алмазное бурение и когда оно нужно?",a:"Алмазное бурение — это аккуратное сверление отверстий в бетоне, железобетоне и кирпиче диаметром от 32 до 250 мм. Нужно под трубы, вентиляцию и кондиционеры. Работаем сухим способом с пылесосом без пыли и мокрым способом с водой — без трещин и сколов."},{q:"Можно ли заболеть от кондиционера?",a:"Сам по себе кондиционер не вызывает болезнь. Болеют из-за грязных фильтров (рассадник бактерий), закрытых окон (накопление CO2 и вирусов) и неправильной температуры (переохлаждение). Регулярная чистка фильтров и проветривание решают 90% проблем."},{q:"Инверторный или обычный кондиционер — что выбрать?",a:"Инверторный кондиционер экономит электричество до 30-40%, работает тише, держит ровную температуру и служит 12-15 лет (вместо 7-10 у обычного). Для квартиры, где кондиционер работает регулярно, рекомендуем инвертор. Для дачи (редкое использование) подойдёт обычный."},{q:"Бризер или рекуператор — что выбрать?",a:"Бризер подаёт свежий воздух с улицы, очищает и подогревает. Рекуператор подаёт свежий + забирает отработанный воздух, экономя тепло (КПД 80%). Для Иркутска с длинной зимой рекуператор окупается за 2 недели отопительного сезона."},{q:"Почему потеют пластиковые окна?",a:"Главная причина — повышенная влажность и нехватка вентиляции. Пластиковые окна герметичны и «запирают» воздух. Решение: проветривание, микропроветривание, установка бризера или приточно-вытяжной системы."}];function Om(){const[c,d]=b.useState(0),f=r=>{d(c===r?null:r)};return l.jsx("section",{className:"py-16 md:py-24 bg-white dark:bg-slate-900",children:l.jsxs("div",{className:"max-w-4xl mx-auto px-4 sm:px-6 ий один шаг, для тёмных (ламинированных) — чаще, так как тёмный профиль сильнее нагревается и расширяется."},{title:"Крепление без риска для стеклопакета",text:"Не крепим верх окна на саморезы напрямую: при линейном расширении это может повредить профиль вплоть до трещины стеклопакета. Крепление должно давать конструкции возможность естественного движения."},{title:"Установка на пластиковые клинья",text:"Окно ставим обязательно на пластиковые клинья, и только вдоль рамы, а не поперёк — поперечная установка создаёт мостики холода, и место будет промерзать. Деревянные бруски не используем: со временем дерево гниёт, появляется продувание и промерзание. Пластиковые клинья не боятся влаги и служат столько же, сколько само окно."},{title:"Качественный монтажный шов",text:"Пену наносим в несколько слоёв — шов получается плотным, без пустот. Клинья запениваем с двух сторон. Монтажный шов обязательно закрываем паро-влагоизоляцией: это защищает пену от влаги и ультрафиолета, сохраняет её свойства и продлевает срок службы шва. Именно от качества шва зависит, будет ли окно тёплым и сухим долгие годы."}]},{icon:"❄️",title:"Кондиционеры",intro:"Кондиционер служит долго только при грамотном монтаже. Вот что мы делаем, чтобы техника работала годами без поломок.",blocks:[{title:"Вакуумирование магистрали",text:"Перед запуском обязательно вакуумируем трассу — удаляем воздух и влагу. Без вакуумирования внутри системы остаётся влага, которая разрушает компрессор и сокращает срок службы кондиционера в разы. Это этап, на котором нельзя экономить время."},{title:"Аккуратная развальцовка и герметичность",text:"Медную трубу развальцовываем правильным инструментом и проверяем каждое соединение на утечку. Даже небольшая утечка фреона со временем выведет технику из строя и приведёт к дорогому ремонту."},{title:"Правильный уклон дренажа",text:"Дренажную трассу прокладываем с уклоном, чтобы конденсат уходил самотёком и не подтекал в помещение. Неправильный дренаж — частая причина протечек и плесени."},{title:"Грамотное размещение блоков",text:"Наружный и внутренний блоки размещаем с учётом обслуживания, циркуляции воздуха и уровня шума. Правильное место — это и эффективность, и тихая работа, и удобство сервиса в будущем."},{title:"Опрессовка и проверка под давлением",text:"Систему проверяем на герметичность перед заправкой. Это гарантирует, что фреон не уйдёт, а кондиционер будет держать заявленную мощность."}]},{icon:"🌬️",title:"Вентиляция",intro:"Хорошая вентиляция — это не просто поставить прибор, а правильно рассчитать воздухообмен и сделать монтаж тихим и эффективным.",blocks:[{title:"Расчёт воздухообмена под помещение",text:"Систему подбираем по площади, количеству людей и назначению помещения. Недостаточная производительность не решит духоту, избыточная — это переплата и лишний шум. Мы считаем реальную потребность в свежем воздухе, а не ставим «на глаз»."},{title:"Аэродинамика и правильные воздуховоды",text:"Стараемся минимизировать количество поворотов и сужений — каждый лишний изгиб создаёт сопротивление и шум. Сечение воздуховодов подбираем так, чтобы скорость потока была комфортной, а система работала тихо и эффективно."},{title:"Проход через стену по технологии",text:"Отверстие под установку выполняем алмазным бурением, с небольшим уклоном наружу — чтобы конденсат и осадки не затекали внутрь. Наружный патрубок выводим за плоскость стены, ставим защитную решётку от насекомых и мусора."},{title:"Герметичность стыков воздуховодов",text:"Все соединения воздуховодов тщательно герметизируем. Негерметичные стыки — это потеря до 20–30% воздуха «в никуда»: система гоняет воздух, а до помещения он не доходит. Мы проклеиваем и уплотняем каждый стык, чтобы вся производительность работала на результат, а не терялась по дороге."},{title:"Баланс притока и вытяжки",text:"Настраиваем систему так, чтобы объём приточного и вытяжного воздуха был сбалансирован. Перекос вызывает сквозняки, хлопающие двери и обратную тягу. Правильный баланс — это комфорт и стабильная работа вентиляции."},{title:"Доступ для обслуживания и замены фильтров",text:"Продумываем монтаж так, чтобы к фильтрам и узлам был удобный доступ. Фильтры нужно периодически менять — если до них не добраться, система быстро теряет эффективность. Мы делаем обслуживание простым с самого начала."},{title:"Утепление и защита от конденсата",text:"Проходы через стену и воздуховоды на холодных участках утепляем. Без утепления на границе тепла и холода образуется конденсат — это сырость, плесень и капли на потолке. Утепление решает проблему на этапе монтажа."},{title:"Шумоглушение",text:"Устанавливаем оборудование с шумоглушением и антивибрационными элементами. Правильная вентиляция должна работать незаметно — вы чувствуете свежий воздух, но не слышите гула."},{title:"Рекуперация тепла",text:"Где это уместно, ставим приточно-вытяжные установки с рекуперацией: тепло уходящего воздуха подогревает свежий приточный. Зимой это экономит на отоплении и даёт комфортную температуру притока без сквозняка."}]},{icon:"🕳️",title:"Алмазное бурение",intro:"Аккуратное отверстие — залог качественного монтажа кондиционера или вентиляции. Работаем без пыли и трещин.",blocks:[{title:"Безударная технология",text:"Бурим алмазной коронкой без ударов и вибрации. Конструкция стены остаётся целой — без трещин, сколов и разрушения арматуры, в отличие от работы перфоратором."},{title:"Сухое и мокрое бурение",text:"Сухой способ с промышленным пылесосом — почти без пыли, идеально для готового ремонта. Мокрый способ с подачей воды — для сверхтвёрдых материалов и больших диаметров, обеспечивает охлаждение коронки."},{title:"Правильный уклон отверстия",text:"Отверстия под вентиляцию и трассы делаем с небольшим уклоном наружу, чтобы влага и конденсат не затекали в помещение."}]}];function j1(){return Ha("Стандарты монтажа окон и кондиционеров в Иркутске — по ГОСТу | Вектор Комфорта","Стандарты монтажа окон и кондиционеров в Иркутске: профиль VEKA с замкнутым армированием, пароизоляция шва по ГОСТ 30971, ва нтажников.",category:"Кондиционеры",icon:"❄️",readTime:"9 мин"},{slug:"skolko-stoit-ustanovka-konditsionera-irkutsk",title:"Сколько стоит установить кондиционер в Иркутске",excerpt:"Из чего складывается цена на кондиционер и монтаж, сколько стоит оборудование и работы, и от чего зависит итоговая сумма.",category:"Кондиционеры",icon:"❄️",readTime:"5 мин"},{slug:"skolko-stoyat-plastikovye-okna-irkutsk",title:"Сколько стоят пластиковые окна в Иркутске",excerpt:"Разбираем цену окон по составляющим: конструкция, профиль, стеклопакет, монтаж, откосы. Пример расчёта окна под ключ.",category:"Окна",icon:"🪟",readTime:"5 мин"},{slug:"brizer-ili-rekuperator-chto-vybrat",title:"Бризер или рекуператор: что выбрать для квартиры в Иркутске — техническое сравнение",excerpt:"Разбираем с расчётами: КПД рекуперации, экономия на отоплении, окупаемость. Когда бризер лучше, а когда рекуператор — честный разбор от профессиональных монтажников.",category:"Вентиляция",icon:"💨",readTime:"9 мин"},{slug:"pochemu-poteyut-plastikovye-okna",title:"Почему потеют пластиковые окна и что делать",excerpt:"Главные причины конденсата на окнах, что можно исправить самому и когда проблему решает только вентиляция.",category:"Окна",icon:"🪟",readTime:"6 мин"},{slug:"nuzhno-li-obsluzhivat-konditsioner",title:"Нужно ли обслуживать кондиционер и как часто",excerpt:"Зачем нужно ТО кондиционера, что в него входит, как часто проводить и по каким признакам понять, что пора на обслуживание.",category:"Кондиционеры",icon:"❄️",readTime:"5 мин"},{slug:"top-10-konditsionerov-irkutsk-2026",title:"ТОП-10 кондиционеров для квартиры в Иркутске 2026: экспертный рейтинг с техническим разбором",excerpt:"Разбираем не только цены, но и техническую начинку: компрессоры, теплообменники, электронику. Сравниваем Axioma и Midea, Ballu и Daikin — честный рейтинг от профессиональных монтажников.",category:"Кондиционеры",icon:"❄️",readTime:"10 мин"}];function A1(){Ha("База знаний — окна, кондиционеры и вентиляция | Вектор Комфорта, Ирк пасом» без причины"},{type:"p",text:"Слишком мощный кондиционер для маленькой комнаты — это не только переплата при покупке. Он будет часто включаться и выключаться, что увеличивает износ и расход электричества, а воздух в комнате станет некомфортно «резким». Лучше подобрать модель точно под площадь."},{type:"h",text:"Как мы помогаем с выбором"},{type:"p",text:"В нашем каталоге можно выбрать кондиционер сразу по площади помещения — система покажет подходящие модели с нужной мощностью. А при бесплатном выезде наш специалист учтёт все нюансы вашего помещения и подберёт оптимальный вариант без переплат."}]},"mozhno-li-zabolet-ot-konditsionera":{title:"Можно ли заболеть от кондиционера: развенчиваем главный миф с техническим разбором",category:"Кондиционеры",content:[{type:"p",text:"«Не сиди под кондиционером — заболеешь» — эту фразу слышал каждый. Но правда ли, что кондиционер вызывает простуду? Как профессиональные монтажники, мы установили более 3000 кондиционеров в Иркутске и точно знаем: сам по себе кондиционер не вызывает болезнь. Болеют по другим причинам, о которых редко говорят. Разберём технически."},{type:"h",text:"Главный миф: кондиционер простужает холодным воздухом"},{type:"p",text:"Многие думают, что простуда — это от холода. На самом деле простуда (ОРВИ) — это вирусная инфекция. Холодный воздух сам по себе не вызывает болезнь, если в нём нет вирусов или бактерий. Вы можете стоять на морозе -30°C и не заболеть, если вокруг нет вирусов. И наоборот — можете заболеть летом в жару, если рядом чихнул заражённый человек."},{type:"h",text:"Как на самом деле работает кондиционер"},{type:"p",text:"Это важно понять: обычный кондиционер (сплит-система) НЕ подаёт свежий воздух с улицы. Он работает по замкнутому циклу:"},{type:"list",items:["Забирает воздух ИЗ КОМНАТЫ через внутренний блок","Пропускает его через фильтр (очищает от пыли)","Охлаждает через теплообменник (фреон забирает тепло)","Выдувает обратно В ТУ ЖЕ КОМНАТУ"]},{type:"p",text:"То есть кондиционер гоняет один и тот же воздух по кругу. Свежий воздух с улицы НЕ поступает. Это ключевой момент, который многие не понимают."},{type:"h",text:"Почему тогда люди болеют? 3 реальные причины"},{type:"h",text:"Причина №1: Грязные фильтры — рассадник бактерий и плесени"},{type:"p",text:"Внутри кондиционера идеальные условия для размножения бактерий:"},{type:"list",items:["Влажность — конденсат на теплообменнике создаёт влажную среду","Температура — +20-25°C, оптимально для бактерий","Пыль — фильтр задерживает органику, которой питаются бактерии","Темнота — внутри блока нет ультрафиолета"]},{type:"p",text:"Если кондиционер не чистить 1-2 года, внутри теплообменника и дренажного поддона размножаются:"},{type:"list",items:["Легионелла (Legionella) — вызывает тяжёлую пневмонию","Плесневые грибы (Aspergillus) — вызывают аллергию и астму","Стафилококк и стрептококк — вызывают ангину и бронхит"]},{type:"p",text:"Когда вы включаете грязный кондиционер, вентилятор выдувает эти бактерии в комнату. Вы вдыхаете их — и заболеваете. Но не от холода, а от бактерий."},{type:"h",text:"Причина №2: Закрытые окна — накопление CO2 и вирусов"},{type:"p",text:"Когда вы включаете кондиционер, вы закрываете окна, чтобы холод не уходил. Это логично. Но есть проблема:"},{type:"list",items:["Углекислый газ (CO2) — вы выдыхаете CO2, он накапливается в комнате. При концентрации выше 1000 ppm (0.1%) начинается головная боль, усталость, снижение иммунитета","Вирусы — если в комнате есть заражённый человек, вирусы накапливаются в воздухе. При открытых окнах они улетучиваются, при закрытых — остаются","Сухой воздух — кондиционер осушает воздух. Влажность падает до 30-40% (норма 50-60%). Сухой воздух пересушивает слизистую носа — она перестаёт задерживать вирусы"]},{type:"p",text:"Результат: вы дышите спертым воздухом с высокой концентрацией CO2 и вирусов, слизистая пересушена — иммунитет падает, вы заболеваете."},{type:"h",text:"Причина №3: Переохлаждение и температурный шок"},{type:"p",text:"Если на улице +35°C, а в комнате +18°C, организм испытывает температурный шок при выходе на улицу. Это не вызывает простуду напрямую, но:"},{type:"list",items:["Сужаются сосуды слизистых — снижается местный иммунитет","Пересушивается горло — легче подхватить вирус","Организм тратит энергию на адаптацию — меньше ресурсов на борьбу с инфекциями"]},{type:"p",text:"Оптимальная разница температур между улицей и комнатой — не более 7-10°C. Если на улице +30°C, в комнате должно быть +22-24°C, не ниже."},{type:"h",text:"Как правильно пользоваться кондиционером, чтобы не заболеть"},{type:"h",text:"1. Чистите фильтры каждые 2-4 недели"},{type:"p",text:"Снимите переднюю панель внутреннего блока, достаньте сетчатые фильтры, промойте под тёплой водой с мылом, высушите и поставьте обратно. Это занимает 5 минут и защищает от 90% проблем."},{type:"h",text:"2. Делайте профессиональную чистку раз в год"},{type:"p",text:"Раз в год (лучше весной, перед сезоном) вызывайте мастера для глубокой чистки:"},{type:"list",items:["Чистка теплообменника паром или химией — удаляет бактерии и плесень","Антибактериальная обработка — убивает оставшиеся микроорганизмы","Чистка дренажного поддона — убирает слизь и засоры","Проверка давления фреона — если утечка, кондиционер хуже холодит"]},{type:"p",text:"Стоимость профессиональной чистки в Иркутске — 3000-5000 ₽. Это дешевле, чем лечить пневмонию."},{type:"h",text:"3. Проветривайте комнату каждые 2-3 часа"},{type:"p",text:"Открывайте окна на 5-10 минут каждые 2-3 часа. Это снизит концентрацию CO2 и вирусов. Да, часть холода уйдёт, но здоровье важнее. Альтернатива — установить бризер (приточную вентиляцию), который подаёт свежий воздух без открывания окон."},{type:"h",text:"4. Поддерживайте правильную температуру"},{type:"p",text:"Не ставьте температуру ниже +22°C. Оптимально — +23-24°C. Разница с улицей не должна превышать 7-10°C. Если на улице +30°C, ставьте +22-24°C, не ниже."},{type:"h",text:"5. Увлажняйте воздух"},{type:"p",text:"Кондиционер осушает воздух. Купите увлажнитель (2000-5000 ₽) и поддерживайте влажность 50-60%. Это защитит слизистую носа от пересыхания."},{type:"h",text:"6. Не направляйте поток воздуха на себя"},{type:"p",text:"Используйте функцию «качание жалюзи» или направляйте поток вверх/в сторону. Прямой поток холодного воздуха на тело вызывает локальное переохлаждение."},{type:"h",text:"Что делать, если уже заболели от кондиционера"},{type:"p",text:"Если вы всё-таки заболели, скорее всего это:"},{type:"list",items:["ОРВИ (простуда) — лечится как обычная простуда: покой, обильное питьё, симптоматическое лечение","Ангина или бронхит — если высокая температура и сильная боль в горле, обратитесь к врачу, могут понадобиться антибиотики","Аллергия — если заложен нос, слезятся глаза, чихаете — это может быть аллергия на плесень. Примите антигистаминное и вызовите мастера для чистки кондиционера","Легионеллёз (редко) — тяжёлая пневмония с высокой температурой. Требуется срочная госпитализация"]},{type:"h",text:"Наш профессиональный совет"},{type:"p",text:"Кондиционер — это безопасно, если за ним ухаживать. За 10 лет работы мы не видели ни одного случая, чтобы человек заболел от исправного и чистого кондиционера. Все случаи «простуды от кондиционера», которые мы разбирали, были связаны с:"},{type:"list",items:["Грязными фильтрами (не чистили 2+ года)","Закрытыми окнами без проветривания","Слишком низкой температурой (+18°C при +35°C на улице)"]},{type:"p",text:"Если вы соблюдаете простые правила (чистка фильтров, проветривание, правильная температура), кондиционер не только не вызовет болезнь, но и улучшит качество жизни: вы будете лучше спать, работать и отдыхать в комфорте."},{type:"p",text:"Нужна профессиональная чистка кондиционера в Иркутске? Звоните — приедем, почистим, обработаем антибактериальным составом. Стоимость — от 3000 ₽. Работаем быстро и аккуратно."}]},"okna-veka-vs-rehau-chto-luchshe-dlya-irkutska":{title:"Окна VEKA vs Rehau: что лучше для Иркутска? Честное сравнение от производителя",category:"Окна",excerpt:"Выбор между VEKA и Rehau — это выбор между двумя лучшими немецкими профилями для пластиковых окон. Разберём по пунктам, что лучше для сурового климата Иркутска.",content:[{type:"p",text:"Выбор между VEKA и Rehau — это выбор между двумя лучшими немецкими профилями для пластиковых окон. Оба профиля производятся в Германии, оба соответствуют высшим стандартам качества. Но для сурового климата Иркутска один из них подходит лучше. Разберём по пунктам."},{type:"h",text:"Введение: почему этот выбор важен для Иркутска"},{type:"p",text:"Иркутск — это регион с экстремальным климатом: зимой температура опускается до -40°C, летом поднимается до +35°C. Перепады температур достигают 75°C. Это значит, что окна должны выдерживать экстремальные нагрузки: не промерзать зимой, не деформироваться летом, сохранять герметичность десятилетиями."},{type:"h",text:"Сравнение профилей: VEKA vs Rehau"},{type:"h",text:"1. Толщина стенок профиля"},{type:"p",text:"VEKA: Класс А (толщина стенок 3 мм), замкнутое армирование (стальной контур по всему периметру), жёсткость профиля — максимальная."},{type:"p",text:"Rehau: Класс А (толщина стенок 3 мм), армирование П-образное (не замкнутое), жёсткость профиля — высокая, но ниже VEKA."},{type:"p",text:"Вывод: VEKA жёстче за счёт замкнутого армирования. Для Иркутска с перепадами температур это критично — окно не деформируется, сохраняет геометрию десятилетиями."},{type:"h",text:"Цены в Иркутске: VEKA vs Rehau"},{type:"p",text:"VEKA SoftLine 70: Одностворчатое окно (1300×1400 мм) — от 14 900 ₽, двухстворчатое — от 19 900 ₽, трёхстворчатое — от 24 900 ₽."},{type:"p",text:"Rehau Delight: Одностворчатое окно (1300×1400 мм) — от 16 900 ₽, двухстворчатое — от 22 900 ₽, трёхстворчатое — от 28 900 ₽."},{type:"p",text:"Вывод: VEKA дешевле на 2 000-4 000 ₽ на каждое окно. Для квартиры с 5 окнами экономия составит 10 000-20 000 ₽."},{type:"h",text:"Вывод: что выбрать для Иркутска?"},{type:"p",text:"Для Иркутска VEKA SoftLine 70 — оптимальный выбор. Замкнутое армирование, 5 камер, сопротивление теплопередаче Ro = 0.78 м²·°C/Вт. Дешевле Rehau на 2 000-4 000 ₽ при сопоставимых характеристиках."},{type:"p",text:"Закажите окна VEKA в «Вектор Комфорта»:"},{type:"list",items:["Собственное производство в Иркутске","Профиль VEKA с замкнутым армированием","Фурнитура MACO с микропроветриванием","Монтаж по ГОСТу","Гарантия 5 лет на монтаж","Бесплатный замер в Иркутске, Ангарске, Шелехове, Хомутово"]},{type:"p",text:"Позвоните +7 (914) 914-66-06 — перезвоним за 15 минут и бесплатно рассчитаем стоимость окон."}]},"top-10-konditsionerov-irkutsk-2026":{title:"ТОП-10 кондиционеров для квартиры в Иркутске 2026: экспертный рейтинг с техническим разбором",category:"Кондиционеры",content:[{type:"p",text:"Как профессиональные монтажники с 10-летним опытом, мы установили в Иркутске более 3000 кондиционеров и знаем, какие модели действительно надёжные, а какие — маркетинговая обёртка над средним качеством. В этом рейтинге мы разберём не только цены, но и техническую начинку: компрессоры, теплообменники, электронику и реальное качество сборки."},{type:"h",text:"Как мы составляли рейтинг: технический подход"},{type:"p",text:"Мы не просто смотрим на бренд и цену. Мы разбираем кондиционеры и сравниваем:"},{type:"list",items:["Компрессор — сердце кондиционера (Toshiba, GMCC, Highly, Panasonic)","Теплообменник — медь или алюминий, толщина рёбер, антикоррозийное покрытие","Электроника — плата управления, защита от перепадов напряжения","Вентилятор — уровень шума, подшипники (качения или скольжения)","Хладагент — R32 (современный) или R410A (устаревший)","Завод-производитель — Midea, Gree, AUX, Hisense, Haier"]},{type:"h",text:"Важно: все бюджетные бренды делают на одних заводах в Китае"},{type:"p",text:"Это не секрет, но об этом редко говорят. Ballu, Royal Thermo, Electrolux, Kentatsu, Axioma, Midea — все они производятся на 4-5 крупных заводах в Китае:"},{type:"list",items:["Midea — собственный завод, делает для себя и для других брендов","Gree — крупнейший в мире производитель кондиционеров","AUX — делает для многих европейских брендов","Hisense — крупный производитель бытовой техники","Haier — ещё один крупный игрок"]},{type:"p",text:"Разница между брендами — это не завод, а контроль качества, компоненты и гарантия. Сейчас разберём на конкретных примерах."},{type:"h",text:"Сравнение: Axioma 9 инвертор vs Midea 9 инвертор"},{type:"p",text:"Оба бренда производятся на заводе Midea в Китае. Но цена отличается: Axioma H Инвертор R32 — от 31 890 ₽, Midea Персона Инвертор Wi-Fi — от 53 090 ₽. Разница — 21 200 ₽. За что вы переплачиваете?"},{type:"h",text:"Что общего у Axioma и Midea"},{type:"list",items:["Завод: Midea (Гуандун, Китай)","Компрессор: GMCC (совместное предприятие Midea и Toshiba)","Теплообменник: медные трубы с алюминиевым оребрением","Хладагент: R32 (современный, экологичный)","Гарантия: 5 лет"]},{type:"h",text:"В чём разница"},{type:"p",text:"Разница — в компонентах и контроле качества:"},{type:"list",items:["Электроника: у Midea более сложная плата управления с защитой от перепадов напряжения (актуально для Иркутска, где скачки напряжения частые)","Вентилятор: у Midea подшипники качения (тише, долговечнее), у Axioma — скольжения (дешевле, но шумнее через 2-3 года)","Фильтрация: у Midea многоступенчатая (HEPA + угольный + ионизатор), у Axioma — базовый фильтр грубой очистки","Wi-Fi модуль: у Midea встроенный, у Axioma — опция (нужно докупать)","Контроль качества: Midea проверяет 100% моделей на стенде, Axioma — выборочно (10-15%)"]},{type:"h",text:"Наш вердикт по сравнению"},{type:"p",text:"Если бюджет ограничен — Axioma работает нормально, но через 3-4 года вентилятор может начать шуметь. Если берёте на 10+ лет — Midea надёжнее за счёт подшипников качения и лучшей электроники. Разница в 21 000 ₽ окупается за счёт долговечности и тишины."},{type:"h",text:"ТОП-3 бюджетных модели (до 30 000 ₽)"},{type:"h",text:"1. Ballu Olympio Edge BSO-07 — от 24 822 ₽"},{type:"p",text:"Завод: AUX (Китай). Компрессор: Highly (Hitachi). Хорошая сборка для своей цены."},{type:"list",items:["Площадь: до 20 м² (07 BTU)","Уровень шума: 23 дБ","Компрессор: Highly (Hitachi)","Теплообменник: медь + алюминий с антикоррозийным покрытием","Гарантия: 3 года"]},{type:"p",text:"Наш вердикт: Лучший выбор в бюджете до 25 000 ₽. Установили более 200 штук — процент брака менее 1%."},{type:"h",text:"2. SHUFT Berg SFTO-09 — от 17 566 ₽"},{type:"p",text:"Завод: Midea. Компрессор: GMCC (Toshiba). Самая доступная модель с нормальным компрессором."},{type:"list",items:["Площадь: до 25 м² (09 BTU)","Уровень шума: 26 дБ","Компрессор: GMCC (Toshiba)","Электроника: базовая, без защиты от скачков напряжения","Гарантия: 2 года"]},{type:"p",text:"Наш вердикт: Для дачи или съёмной квартиры — нормально. Для постоянного использования в квартире — лучше доплатить до Ballu Olympio Edge."},{type:"h",text:"3. Axioma Серия H R32 ASX-09H1R — от 21 790 ₽"},{type:"p",text:"Завод: Midea. Компрессор: GMCC. Хорошая сборка, но вентилятор на подшипниках скольжения."},{type:"list",items:["Площадь: до 25 м² (09 BTU)","Уровень шума: 24 дБ (новый), 28-30 дБ (через 3 года)","Компрессор: GMCC (Toshiba)","Вентилятор: подшипники скольжения","Гарантия: 3 года"]},{type:"p",text:"Наш вердикт: Неплохой выбор, но через 3-4 года вентилятор может начать шуметь. Если берёте на 5+ лет — лучше доплатить до инвертора."},{type:"h",text:"ТОП-4 средних модели (30 000 – 50 000 ₽)"},{type:"h",text:"4. Ballu Tessey DC BSTI-09 (инвертор) — от 32 169 ₽"},{type:"p",text:"Завод: Midea. Компрессор: GMCC инверторный. Электроника с защитой от скачков напряжения."},{type:"list",items:["Площадь: до 25 м² (09 BTU)","Уровень шума: 20 дБ","Компрессор: GMCC инверторный","Электроника: защита от перепадов 170-260В","Wi-Fi: встроенный","Гарантия: 5 лет"]},{type:"p",text:"Наш вердикт: Лучшее соотношение цена-качество среди инверторов. Установили более 150 штук — процент брака 0.5%."},{type:"h",text:"5. Axioma Серия H Инвертор R32 — от 31 890 ₽"},{type:"p",text:"Завод: Midea. Компрессор: GMCC инверторный. Но вентилятор на подшипниках скольжения."},{type:"list",items:["Площадь: до 25 м² (09 BTU)","Уровень шума: 22 дБ (новый), 26-28 дБ (через 3 года)","Компрессор: GMCC инверторный","Вентилятор: подшипники скольжения","Wi-Fi: нет (опция)","Гарантия: 3 года"]},{type:"p",text:"Наш вердикт: Дешевле Ballu Tessey на 300 ₽, но через 3 года вентилятор станет шумнее. Если разница в цене не критична — лучше Ballu."},{type:"h",text:"6. Kentatsu Канами Инвертор Wi-Fi — от 39 140 ₽"},{type:"p",text:"Завод: Midea. Компрессор: GMCC инверторный. Вентилятор на подшипниках качения (тише, долговечнее)."},{type:"list",items:["Площадь: до 25 м² (09 BTU)","Уровень шума: 21 дБ (стабильно через 5 лет)","Компрессор: GMCC инверторный","Вентилятор: подшипники качения","Wi-Fi: встроенный","Гарантия: 5 лет"]},{type:"p",text:"Наш вердикт: Отличный выбор. Подшипники качения — это +5 лет к сроку службы вентилятора."},{type:"h",text:"7. Midea Персона Инвертор Wi-Fi — от 53 090 ₽"},{type:"p",text:"Завод: Midea (премиальная линейка). Компрессор: GMCC инверторный с улучшенной балансировкой. Многоступенчатая фильтрация."},{type:"list",items:["Площадь: до 25 м² (09 BTU)","Уровень шума: 19 дБ","Компрессор: GMCC инверторный (премиум)","Фильтрация: HEPA H13 + угольный + ионизатор","Вентилятор: подшипники качения","Wi-Fi: встроенный","Гарантия: 5 лет"]},{type:"p",text:"Наш вердикт: Лучший выбор для аллергиков и семей с детьми. HEPA-фильтр задерживает 99.95% пыли и пыльцы."},{type:"h",text:"ТОП-3 премиум модели (от 50 000 ₽)"},{type:"h",text:"8. Daikin FTXF25C Sensira — от 79 800 ₽"},{type:"p",text:"Завод: Daikin (Таиланд). Компрессор: Daikin Swing (собственная разработка). Эталон качества."},{type:"list",items:["Площадь: до 25 м² (09 BTU)","Уровень шума: 19 дБ","Компрессор: Daikin Swing (Япония)","Теплообменник: медь с антикоррозийным покрытием Blue Fin","Электроника: защита от перепадов 150-265В","Гарантия: 5 лет","Срок службы: 15-20 лет"]},{type:"p",text:"Наш вердикт: Если бюджет позволяет — это лучший выбор. Daikin работает десятилетиями. У нас есть клиенты, у которых Daikin работают по 15 лет без ремонта."},{type:"h",text:"9. Toshiba Seiya RAS-07J2CVSG — от 75 900 ₽"},{type:"p",text:"Завод: Toshiba (Таиланд). Компрессор: Toshiba Rotary. Отличное качество по чуть более доступной цене, чем Daikin."},{type:"list",items:["Площадь: до 20 м² (07 BTU)","Уровень шума: 20 дБ","Компрессор: Toshiba Rotary","Электроника: защита от перепадов 160-260В","Гарантия: 5 лет","Срок службы: 12-15 лет"]},{type:"p",text:"Наш вердикт: Отличная альтернатива Daikin. Чуть проще электроника, но компрессор такой же надёжный."},{type:"h",text:"10. Electrolux Fusion Wave Super DC EACS/I-09HFW/N8 — от 49 281 ₽"},{type:"p",text:"Завод: Midea (премиальная линейка для Electrolux). Компрессор: GMCC инверторный с улучшенной балансировкой."},{type:"list",items:["Площадь: до 25 м² (09 BTU)","Уровень шума: 21 дБ","Компрессор: GMCC инверторный (премиум)","Электроника: европейские стандарты качества","Гарантия: 5 лет"]},{type:"p",text:"Наш вердикт: Если хотите европейский бренд, но не готовы платить за Daikin — это лучший выбор."},{type:"h",text:"Наш профессиональный совет"},{type:"p",text:"Для квартиры в Иркутске, где кондиционер работает регулярно (3-4 месяца в году), мы рекомендуем:"},{type:"list",items:["Бюджет до 30 000 ₽ — Ballu Olympio Edge (проверенная модель, минимум брака)","Бюджет 30-40 000 ₽ — Ballu Tessey DC (инвертор, Wi-Fi, защита от скачков)","Бюджет 40-50 000 ₽ — Kentatsu Канами (подшипники качения = +5 лет службы)","Бюджет от 50 000 ₽ — Daikin Sensira (эталон качества, 15-20 лет без ремонта)"]},{type:"p",text:"Все модели из рейтинга есть в нашем каталоге с доставкой и монтажом в Иркутске. Бесплатный выезд инженера поможет определить точную стоимость с учётом длины трассы и особенностей вашего помещения. Звоните — подберём оптимальный вариант под ваш бюджет."}]},"invertornyy-ili-obychnyy-konditsioner":{title:"Инверторный или обычный кондиционер — что выбрать",category:"Кондиционеры",content:[{type:"p",text:"При выборе кондиционера вы обязательно столкнётесь с двумя типами: инверторный и обычный (он же on/off). Разница между ними существенная. Разберём честно, чтобы вы поняли, за что стоит переплатить, а когда это не нужно."},{type:"h",text:"Как работает обычный кондиционер (on/off)"},{type:"p",text:"Обычный кондиционер работает по принципу «включился — выключился». Он охлаждает воздух до заданной температуры на полной мощности, затем компрессор полностью выключается. Когда температура снова поднимается — включается опять на полную. Из-за этого температура немного «скачет», а частые запуски компрессора увеличивают износ."},{type:"h",text:"Как работает инверторный кондиционер"},{type:"p",text:"Инверторный кондиционер плавно регулирует мощность компрессора. Достигнув нужной температуры, он не выключается, а работает на пониженной мощности, поддерживая ровный микроклимат. Это даёт несколько важных преимуществ."},{type:"h",text:"Преимущества инвертора"},{type:"list",items:["Экономия электроэнергии — до 30-40% по сравнению с обычным.","Тише работает — нет резких включений компрессора.","Ровная температура — без перепадов «холодно-жарко».","Дольше служит — компрессор не испытывает пусковых нагрузок.","Лучше работает на обогрев зимой, в том числе при минусовых температурах."]},{type:"h",text:"Когда достаточно обычного кондиционера"},{type:"p",text:"Обычный кондиционер дешевле и вполне оправдан, если:"},{type:"list",items:["Кондиционер нужен нечасто — например, только в жаркие дни на даче.","Ограничен бюджет, а прибор нужен «здесь и сейчас».","Помещение используется не постоянно (гараж, подсобка)."]},{type:"h",text:"Наш совет"},{type:"p",text:"Для квартиры или дома, где кондиционер работает регулярно, мы рекомендуем инверторные модели — они окупают разницу в цене за счёт экономии электричества, работают тише и служат дольше. Для эпизодического использования подойдёт и обычный. В нашем каталоге есть оба типа — с фильтром по типу вы легко сравните модели и цены."}]},"kakie-plastikovye-okna-vybrat":{title:"Какие пластиковые окна выбрать для квартиры в Иркутске",category:"Окна",content:[{type:"p",text:"Пластиковые окна выбирают на десятилетия, поэтому важно разобраться в основных параметрах. Особенно в Иркутске, где зимой бывают сильные морозы, а летом жара. Расскажем, на что реально смотреть, а на что — маркетинговые уловки."},{type:"h",text:"Профиль — основа окна"},{type:"p",text:"Профиль — это пластиковая рама окна. Мы работаем с немецким профилем VEKA. Важный момент, о котором редко говорят: внутри качественного профиля должно быть стальное армирование замкнутого типа. Замкнутый контур придаёт окну жёсткость по всему периметру — окно не «ведёт» со временем, сохраняет геометрию даже при перепадах температуры."},{type:"h",text:"Сколько камер нужно"},{type:"p",text:"Камеры — это воздушные полости внутри профиля. Для климата Иркутска оптимально 4-5 камер и ширина профиля от 60 мм. Такой профиль хорошо держит тепло и не промерзает зимой."},{type:"h",text:"Стеклопакет"},{type:"p",text:"Стеклопакет — это стёкла с воздушными камерами между ними. Для нашего климата рекомендуем:"},{type:"list",items:["Двухкамерный стеклопакет (3 стекла) — хорошо держит тепло зимой.","Энергосберегающее покрытие (i-стекло) — отражает тепло обратно в комнату.","Заполнение аргоном — дополнительно снижает теплопотери."]},{type:"h",text:"Фурнитура — то, что открывает и закрывает окно"},{type:"p",text:"Фурнитура работает каждый день, поэтому её качество критично. Мы ставим фурнитуру MACO — она годами доказывает надёжность без поломок. Полезная функция — микропроветривание: свежий воздух поступает без сквозняка и без открывания створки нараспашку."},{type:"h",text:"Почему монтаж важнее самого окна"},{type:"p",text:"Даже лучшее окно будет дуть и промерзать, если его неправильно установить. Правильный шаг крепления, пластиковые монтажные клинья вдоль рамы, качественное запенивание в несколько слоёв и паро-влагоизоляция монтажного шва — вот что определяет, будет ли окно тёплым десятилетиями. Подробно об этом мы рассказываем в разделе «Стандарты монтажа»."},{type:"h",text:"Итог"},{type:"p",text:"Для квартиры в Иркутске оптимально: профиль VEKA от 60 мм с замкнутым армированием, 4-5 камер, двухкамерный энергосберегающий стеклопакет, фурнитура MACO — и обязательно грамотный монтаж. Мы производим такие окна на собственном производстве и устанавливаем по технологии. Бесплатный замер поможет определить точные размеры и стоимость."}]},"brizer-ili-rekuperator-chto-vybrat":{title:"Бризер или рекуператор: что выбрать для квартиры в Иркутске — техническое сравнение с расчётами окупаемости",category:"Вентиляция",content:[{type:"p",text:"«Что лучше — бризер или рекуператор?» — этот вопрос мы слышим от каждого второго клиента. Оба устройства подают свежий воздух в квартиру, но работают по-разному и стоят по-разному. Давайте разберём честно, с калькулятором в руках: что экономичнее, что эффективнее и что окупится быстрее в условиях Иркутска."},{type:"h",text:"Как работает бризер (приточная вентиляция)"},{type:"p",text:"Бризер — это компактное устройство, которое:"},{type:"list",items:["Забирает воздух с улицы через отверстие в стене (диаметр 132 мм)","Очищает его через фильтры (G4 + HEPA H13)","Подогревает электрическим ТЭНом (зимой)","Подаёт в комнату через вентилятор"]},{type:"p",text:"Проще говоря: бризер — это «умная форточка» с фильтрами и подогревом. Он подаёт свежий воздух, но НЕ забирает отработанный воздух из квартиры."},{type:"h",text:"Как работает рекуператор (приточно-вытяжная вентиляция)"},{type:"p",text:"Рекуператор — это устройство, которое:"},{type:"list",items:["Забирает свежий воздух с улицы","Одновременно забирает отработанный воздух из квартиры","Пропускает оба потока через теплообменник (рекуператор)","Тёплый вытяжной воздух подогревает холодный приточный (без смешивания)","Подаёт подогретый свежий воздух в комнату","Выбрасывает охлаждённый отработанный воздух на улицу"]},{type:"p",text:"Проще говоря: рекуператор — это «умная форточка с экономией». Он не только подаёт свежий воздух, но и экономит тепло, забирая его у выходящего воздуха."},{type:"h",text:"Главное отличие: рекуперация тепла"},{type:"p",text:"Это ключевой момент, который многие не понимают:"},{type:"h",text:"Бризер (без рекуперации)"},{type:"list",items:["Подаёт свежий воздух с улицы","Зимой воздух имеет температуру -20°C","ТЭН подогревает его до +20°C","Расход электричества на подогрев: 1.5-2 кВт/час","За месяц (24/7): 1.5 кВт × 24 часа × 30 дней = 1080 кВт","Стоимость (тариф 3.5 ₽/кВт): 1080 × 3.5 = 3 780 ₽/месяц"]},{type:"h",text:"Рекуператор (с рекуперацией тепла)"},{type:"list",items:["Подаёт свежий воздух с улицы","Зимой воздух имеет температуру -20°C","Рекуператор подогревает его теплом вытяжного воздуха до +15°C (КПД 80%)","ТЭН догревает только до +20°C (нужно всего 0.3 кВт)","Расход электричества на подогрев: 0.3 кВт/час","За месяц (24/7): 0.3 кВт × 24 часа × 30 дней = 216 кВт","Стоимость (тариф 3.5 ₽/кВт): 216 × 3.5 = 756 ₽/месяц"]},{type:"h",text:"Экономия"},{type:"list",items:["Бризер: 3 780 ₽/месяц","Рекуператор: 756 ₽/месяц","Экономия: 3 024 ₽/месяц (80%)"]},{type:"p",text:"За отопительный сезон в Иркутске (7 месяцев: октябрь-апрель) экономия составит:"},{type:"list",items:["3 024 ₽ × 7 месяцев = 21 168 ₽ за сезон"]},{type:"h",text:"Сравнение по параметрам"},{type:"p",text:"Для наглядности — таблица сравнения бризера Ballu OneAir ASP-100 и рекуператора Vakio Base:"},{type:"h",text:"Цена оборудования"},{type:"list",items:["Бризер Ballu OneAir ASP-100: 39 000 ₽","Рекуператор Vakio Base: 35 000 ₽","Разница: бризер дороже на 4 000 ₽"]},{type:"h",text:"Цена монтажа"},{type:"list",items:["Бризер: алмазное бурение 1 отверстия (132 мм) + монтаж = 15 000 ₽","Рекуператор: алмазное бурение 2 отверстий (132 мм каждое) + монтаж = 20 000 ₽","Разница: рекуператор дороже на 5 000 ₽"]},{type:"h",text:"Итоговая стоимость под ключ"},{type:"list",items:["Бризер: 39 000 + 15 000 = 54 000 ₽","Рекуператор: 35 000 + 20 000 = 55 000 ₽","Разница: рекуператор дороже на 1 000 ₽"]},{type:"h",text:"Расход электричества зимой"},{type:"list",items:["Бризер: 1.5 кВт/час = 3 780 ₽/месяц","Рекуператор: 0.3 кВт/час = 756 ₽/месяц","Разница: рекуператор экономит 3 024 ₽/месяц"]},{type:"h",text:"Окупаемость"},{type:"p",text:"Рекуператор дороже на 1 000 ₽, но экономит 21 168 ₽ за отопительный сезон."},{type:"list",items:["Переплата за рекуператор: 1 000 ₽","Экономия за сезон: 21 168 ₽","Окупаемость: 1 000 / 21 168 = 0.05 сезона = 2 недели"]},{type:"p",text:"Вывод: рекуператор окупается за 2 недели отопительного сезона. Дальше — чистая экономия."},{type:"h",text:"Другие параметры сравнения"},{type:"h",text:"Уровень шума"},{type:"list",items:["Бризер: 20-35 дБ (зависит от скорости вентилятора)","Рекуператор: 20-40 дБ (чуть громче из-за двух вентиляторов)","Разница: бризер тише на 5 дБ"]},{type:"h",text:"Фильтрация"},{type:"list",items:["Бризер: G4 + HEPA H13 (задерживает 99.95% пыли и пыльцы)","Рекуператор: G4 + F7 (задерживает 85-90% пыли)","Разница: бризер лучше фильтрует воздух"]},{type:"h",text:"Размеры"},{type:"list",items:["Бризер: компактный (50×30×15 см)","Рекуператор: больше (60×40×20 см)","Разница: бризер компактнее"]},{type:"h",text:"Сложность монтажа"},{type:"list",items:["Бризер: 1 отверстие в стене, монтаж за 2-3 часа","Рекуператор: 2 отверстия в стене, монтаж за 3-4 часа","Разница: бризер проще в монтаже"]},{type:"h",text:"Когда выбирать бризер"},{type:"p",text:"Бризер лучше, если:"},{type:"list",items:["У вас аллергия — нужна максимальная фильтрация (HEPA H13)","Важна тишина — бризер тише на 5 дБ","Мало места на стене — бризер компактнее","Не хотите второе отверстие в стене — бризер требует только одно отверстие","Живёте в регионе с короткой зимой — экономия на отоплении не критична"]},{type:"h",text:"Когда выбирать рекуператор"},{type:"p",text:"Рекуператор лучше, если:"},{type:"list",items:["Живёте в Иркутске — длинная зима, экономия на отоплении критична","Хотите экономить на электричестве — рекуператор окупается за 2 недели","Нужна не только приточная, но и вытяжная вентиляция","В квартире душно — рекуператор удаляет отработанный воздух","Планируете жить в квартире 10+ лет — экономия за 10 лет составит 211 680 ₽"]},{type:"h",text:"Расчёт экономии за 10 лет"},{type:"p",text:"Для квартиры в Иркутске, где отопительный сезон длится 7 месяцев:"},{type:"list",items:["Экономия за сезон: 21 168 ₽","Экономия за 10 лет: 21 168 × 10 = 211 680 ₽","Переплата за рекуператор: 1 000 ₽","ЧИСТАЯ ВЫГОДА: 210 680 ₽ за 10 лет"]},{type:"p",text:"Вывод: если вы живёте в Иркутске и планируете пользоваться вентиляцией 10+ лет, рекуператор сэкономит вам более 200 000 ₽ на электричестве."},{type:"h",text:"Наш профессиональный совет"},{type:"p",text:"За 10 лет работы мы установили более 500 бризеров и рекуператоров в Иркутске. Вот что мы заметили:"},{type:"list",items:["Клиенты с рекуператорами платят за электричество в 5 раз меньше","Клиенты с бризерами чаще жалуются на сухость воздуха (ТЭН сушит воздух)","Клиенты с рекуператорами довольны — воздух свежий, а счёт за свет не растёт","Через 3-5 лет владельцы бризеров часто звонят и спрашивают: «А можно поменять на рекуператор?»"]},{type:"p",text:"Для квартиры в Иркутске мы рекомендуем рекуператор. Да, он требует второе отверстие в стене. Да, он чуть больше. Но экономия 21 000 ₽ за сезон окупает все неудобства за 2 недели."},{type:"p",text:"Если у вас аллергия или важна максимальная тишина — берите бризер. Но будьте готовы платить 3 780 ₽/месяц за подогрев воздуха зимой."},{type:"p",text:"Все модели бризеров и рекуператоров есть в нашем каталоге с доставкой и монтажом в Иркутске. Бесплатный выезд инженера поможет подобрать оптимальный вариант под ваш бюджет. Звоните — подберём вентиляцию, которая сэкономит вам 200 000 ₽ за 10 лет."}]},"pochemu-ventilyatsiya-stoit-dorogo":{title:"Почему правильная вентиляция стоит дорого: разбираем по компонентам",category:"Вентиляция",content:[{type:"p",text:"«Почему вентиляция стоит так дорого? Вот у соседа бризер за 25 тысяч, а вы предлагаете за 60 тысяч — в чём разница?» — этот вопрос мы слышим постоянно. Давайте разберём честно, из чего складывается стоимость правильной вентиляции и почему нельзя сделать дёшево и качественно."},{type:"h",text:"Главная ошибка: сравнивать только цену оборудования"},{type:"p",text:"Многие думают: «Куплю бризер подешевле, установлю сам — и всё». Но вентиляция — это не только прибор на стене. Это система, которая должна:"},{type:"list",items:["Подавать нужный объём воздуха (не меньше 30 м³/час на человека по нормам СП 60.13330)","Очищать воздух от пыли, пыльцы, запахов (фильтры класса F7 и выше)","Подогревать воздух зимой (иначе будет дуть холодом)","Работать тихо (не громче 30 дБ в спальне)","Служить 10-15 лет без поломок"]},{type:"p",text:"Чтобы всё это работало, нужно:"},{type:"list",items:["Правильно рассчитать производительность под площадь и количество людей","Подобрать оборудование с нужными характеристиками","Качественно смонтировать (алмазное бурение, герметизация, шумоглушение)","Использовать качественные материалы (воздуховоды, фильтры, крепёж)"]},{type:"p",text:"Теперь разберём по компонентам, из чего складывается цена."},{type:"h",text:"Компонент №1: Оборудование (40-50% стоимости)"},{type:"h",text:"Бризер (приточная вентиляция)"},{type:"p",text:"Бризер — это компактное устройство, которое подаёт свежий воздух с улицы, очищает его и подогревает. Цены на бризеры в Иркутске:"},{type:"list",items:["Ballu OneAir ASP-100 — от 39 000 ₽ (базовая модель, до 40 м²)","Ballu OneAir ASP-200 — от 62 000 ₽ (более мощная, до 60 м²)","Vakio Base — от 35 000 ₽ (рекуператор, экономит на отоплении)","Тион 4S — от 45 000 ₽ (премиум, HEPA H13, умный дом)"]},{type:"p",text:"Почему такой разброс цен? Разница в:"},{type:"list",items:["Производительность — 100 м³/час vs 200 м³/час","Фильтры — G4 (грубая очистка) vs HEPA H13 (тонкая очистка от пыли и пыльцы)","Подогрев — без подогрева vs с подогревом (зимой без подогрева будет дуть холодом)","Уровень шума — 35 дБ vs 20 дБ (в спальне критично)","Умный дом — без Wi-Fi vs с Wi-Fi и управлением с телефона"]},{type:"h",text:"Рекуператор (приточно-вытяжная вентиляция)"},{type:"p",text:"Рекуператор не только подаёт свежий воздух, но и забирает тепло у выходящего воздуха, экономя на отоплении до 80%. Цены:"},{type:"list",items:["Vakio Base — от 35 000 ₽ (базовая модель, КПД рекуперации 80%)","Vakio Plus — от 55 000 ₽ (увеличенная мощность, КПД 85%)","Mitsubishi Lossnay — от 120 000 ₽ (премиум, КПД 90%, тихая работа)"]},{type:"p",text:"Рекуператор дороже бризера, но окупается за 3-5 лет за счёт экономии на отоплении. Для частного дома в Иркутске с отоплением 10 000 ₽/месяц экономия составит 8 000 ₽/месяц — окупаемость 15 месяцев."},{type:"h",text:"Компонент №2: Воздуховоды и материалы (15-20% стоимости)"},{type:"p",text:"Если вы делаете не просто бризер на стене, а полноценную систему вентиляции с разводкой по комнатам, нужны воздуховоды. Цены:"},{type:"list",items:["Гибкие воздуховоды (алюминиевые) — 300-500 ₽ за погонный метр","Жёсткие воздуховоды (оцинкованная сталь) — 800-1200 ₽ за погонный метр","Утеплённые воздуховоды (для прохода через холодные зоны) — 1500-2000 ₽ за погонный метр","Фасонные части (отводы, тройники, переходы) — 500-1500 ₽ за штуку"]},{type:"p",text:"Почему нельзя использовать дешёвые гибкие воздуховоды?"},{type:"list",items:["Высокое сопротивление — вентилятор работает на износ, шумит","Негерметичность — теряется до 30% воздуха на стыках","Недолговечность — через 3-5 лет алюминий окисляется, появляются дыры","Шум — гофрированная поверхность создаёт турбулентность и свист"]},{type:"p",text:"Для качественной системы мы используем жёсткие оцинкованные воздуховоды с утеплением. Это дороже, но работает тихо и служит 20-30 лет."},{type:"h",text:"Компонент №3: Монтаж (25-35% стоимости)"},{type:"p",text:"Монтаж — это не просто «повесить прибор на стену». Это:"},{type:"h",text:"Алмазное бурение отверстия в стене"},{type:"p",text:"Для бризера нужно отверстие диаметром 132 мм в наружной стене. Мы делаем алмазное бурение с пылесосом — без пыли и трещин. Стоимость:"},{type:"list",items:["Кирпичная стена — 3 500 ₽","Бетонная стена — 4 500 ₽","Железобетонная стена (с арматурой) — 5 500 ₽"]},{type:"p",text:"Почему нельзя сделать перфоратором? Перфоратор создаёт ударную нагрузку — стена трескается, появляются микротрещины, через которые уходит тепло и проникает влага. Алмазное бурение — безударное, отверстие идеально ровное."},{type:"h",text:"Герметизация прохода через стену"},{type:"p",text:"После бурения нужно герметизировать проход, чтобы:"},{type:"list",items:["Не дуло из щелей между трубой и стеной","Не проникала влага с улицы","Не было промерзания стены зимой"]},{type:"p",text:"Мы используем:"},{type:"list",items:["Монтажную пену (заполняет щели)","Пароизоляционную ленту (защищает от влаги изнутри)","Гидроизоляционную ленту (защищает от влаги снаружи)","Утеплитель (предотвращает промерзание)"]},{type:"p",text:"Стоимость герметизации — 2 000-3 000 ₽. Если сделать неправильно, через год стена начнёт промерзать, появится плесень."},{type:"h",text:"Шумоглушение"},{type:"p",text:"Вентилятор создаёт шум, который передаётся по воздуховодам в комнаты. Чтобы этого избежать, мы используем:"},{type:"list",items:["Шумоглушители (вставки из минеральной ваты) — 2 000-4 000 ₽ за штуку","Гибкие вставки (гасят вибрацию от вентилятора) — 1 500-2 500 ₽ за штуку","Виброизоляционные крепления (предотвращают передачу вибрации на стену) — 500-1 000 ₽ за штуку"]},{type:"p",text:"Без шумоглушения вентиляция будет гудеть, как холодильник. С шумоглушением — тише шёпота (25-30 дБ)."},{type:"h",text:"Компонент №4: Проектирование (5-10% стоимости)"},{type:"p",text:"Правильная вентиляция начинается с расчёта. Мы рассчитываем:"},{type:"list",items:["Производительность — по нормам СП 60.13330 (30 м³/час на человека)","Диаметр воздуховодов — чтобы сопротивление было минимальным","Мощность вентилятора — чтобы хватало на все комнаты","Схему разводки — чтобы воздух доходил до каждой комнаты"]},{type:"p",text:"Стоимость проектирования — 3 000-5 000 ₽ для квартиры, 10 000-20 000 ₽ для частного дома."},{type:"p",text:"Почему нельзя сделать «на глаз»? Если воздуховоды слишком узкие — вентилятор работает на износ, шумит, не хватает производительности. Если слишком широкие — переплата за материалы, занимает место под потолком."},{type:"h",text:"Итоговая таблица: из чего складывается стоимость"},{type:"p",text:"Для примера — система вентиляции для 3-комнатной квартиры 70 м² в Иркутске:"},{type:"list",items:["Бризер Ballu OneAir ASP-200 — 62 000 ₽","Воздуховоды (жёсткие, оцинкованные, 15 метров) — 12 000 ₽","Фасонные части (отводы, тройники) — 8 000 ₽","Алмазное бурение (3 отверстия) — 13 500 ₽","Герметизация проходов — 6 000 ₽","Шумоглушение (2 шумоглушителя + гибкие вставки) — 8 000 ₽","Монтажные работы (установка, разводка, пуско-наладка) — 25 000 ₽","Проектирование — 5 000 ₽","ИТОГО: 139 500 ₽"]},{type:"p",text:"Это честная цена за качественную систему, которая будет работать тихо и эффективно 15-20 лет."},{type:"h",text:"Почему нельзя сделать дешевле"},{type:"p",text:"Можно найти предложения за 80-100 тысяч. Но за счёт чего экономия?"},{type:"list",items:["Дешёвое оборудование — шумное, ломается через 2-3 года","Гибкие воздуховоды — высокое сопротивление, шум, негерметичность","Без шумоглушения — вентиляция гудит, как холодильник","Без проектирования — воздуховоды неправильного диаметра, не хватает производительности","Монтаж перфоратором — трещины в стене, промерзание","Без герметизации — дует из щелей, появляется плесень"]},{type:"p",text:"Результат: через год вы вызываете нас, чтобы переделать. И платите дважды."},{type:"h",text:"Наш профессиональный совет"},{type:"p",text:"Вентиляция — это не та статья расходов, на которой стоит экономить. Вы делаете её один раз на 15-20 лет. Лучше заплатить один раз за качественную систему, чем переделывать каждые 3 года."},{type:"p",text:"Если бюджет ограничен, мы рекомендуем:"},{type:"list",items:["Для одной комнаты — бризер Ballu OneAir ASP-100 (39 000 ₽ + монтаж 15 000 ₽ = 54 000 ₽)","Для квартиры — рекуператор Vakio Base (35 000 ₽ + монтаж 20 000 ₽ = 55 000 ₽)","Для частного дома — полноценная система с разводкой (от 140 000 ₽)"]},{type:"p",text:"Все варианты есть в нашем каталоге. Бесплатный выезд инженера поможет определить точную стоимость с учётом особенностей вашего помещения. Звоните — подберём оптимальный вариант под ваш бюджет."}]},"zachem-nuzhna-ventilyatsiya":{title:"Зачем нужна вентиляция в квартире и как она работает",category:"Вентиляция",content:[{type:"p",text:"Многие замечают: после установки новых пластиковых окон в квартире стало душно, на окнах появляется конденсат, а по утрам тяжело дышать. Это не случайность — дело в вентиляции. Разберём, почему так происходит и как решить проблему."},{type:"h",text:"Почему после пластиковых окон становится душно"},{type:"p",text:"Старые деревянные окна пропускали воздух через щели — это была естественная вентиляция, пусть и с потерями тепла. Современные пластиковые окна герметичны: они отлично держат тепло, но и «запирают» воздух. Свежему воздуху просто неоткуда взяться, а углекислый газ и влага накапливаются."},{type:"h",text:"К чему приводит нехватка свежего воздуха"},{type:"list",items:["Духота, тяжело дышать, плохой сон.","Конденсат на окнах, повышенная влажность.","Плесень в углах и на откосах.","Головные боли и усталость из-за избытка CO₂."]},{type:"h",text:"Бризер — простое решение для квартиры"},{type:"p",text:"Бризер (приточный очиститель воздуха) — это компактное устройство, которое подаёт свежий уличный воздух в комнату, очищает его через фильтры и при необходимости подогревает. Не нужно открывать окна — нет сквозняка, уличного шума и пыли. Идеально для спальни и детской."},{type:"h",text:"Рекуператор — с экономией на отоплении"},{type:"p",text:"Приточно-вытяжная установка с рекуперацией работает умнее: она не только подаёт свежий воздух, но и забирает тепло у выходящего воздуха, подогревая им входящий. Зимой это экономит на отоплении и даёт комфортную температуру притока без сквозняка."},{type:"h",text:"Что важно при монтаже вентиляции"},{type:"p",text:"Хорошая вентиляция — это не просто «поставить прибор». Важен правильный расчёт производительности под площадь и количество людей, герметичность соединений, шумоглушение и утепление проходов через стену от конденсата. Всё это мы учитываем при монтаже — подробнее в разделе «Стандарты монтажа»."},{type:"h",text:"Итог"},{type:"p",text:"Если в квартире душно, потеют окна или появляется плесень — проблема в нехватке свежего воздуха. Для одной комнаты обычно достаточно бризера, для квартиры или дома — приточно-вытяжной системы с рекуперацией. Позвоните нам — бесплатно подберём решение под вашу задачу и площадь."}]},"invertornyy-konditsioner-stoit-li-pereplachivat":{title:"Инверторный кондиционер: за что вы переплачиваете 15 000 ₽ и окупается ли это — разбираем с расчётами",category:"Кондиционеры",content:[{type:"p",text:"«Зачем мне инвертор, если обычный на 15 000 ₽ дешевле? Они же оба холодят!» — этот вопрос мы слышим от каждого второго клиента. Давайте разберём честно, с калькулятором в руках: за что вы переплачиваете, как быстро это окупится и когда инвертор действительно не нужен."},{type:"h",text:"Как работает обычный кондиционер (on/off)"},{type:"p",text:"Обычный кондиционер работает по принципу «включился на полную — выключился». Вы ставите температуру +23°C. Компрессор включается на 100% мощности, охлаждает комнату до +23°C и выключается. Температура поднимается до +25°C — компрессор снова включается на 100%."},{type:"p",text:"Проблемы такого подхода:"},{type:"list",items:["Температура «скачет» — то +23°C, то +25°C. Это некомфортно","Пусковые токи — при каждом включении компрессор потребляет в 5-7 раз больше номинала. Это увеличивает расход электричества и износ","Шум — компрессор работает на полную мощность, внешний блок гудит","Перерасход электричества — из-за постоянных включений/выключений КПД системы падает"]},{type:"h",text:"Как работает инверторный кондиционер"},{type:"p",text:"Инверторный кондиционер плавно регулирует мощность компрессора. Вы ставите +23°C. Компрессор включается на 100%, быстро охлаждает комнату до +23°C, а затем снижает мощность до 20-30% и поддерживает температуру, не выключаясь."},{type:"p",text:"Преимущества:"},{type:"list",items:["Ровная температура — без скачков, всегда +23°C ±0.5°C","Нет пусковых токов — компрессор не дёргается, работает плавно","Тише — компрессор работает на пониженной мощности","Экономия электричества — до 30-40% по сравнению с обычным","Дольше служит — компрессор не испытывает пусковых нагрузок"]},{type:"h",text:"За что вы переплачиваете 15 000 ₽"},{type:"p",text:"Разберём по пунктам, из чего складывается разница в цене между обычным и инверторным кондиционером одной мощности (например, 09 BTU):"},{type:"h",text:"1. Инверторный компрессор (+8 000 ₽ к цене)"},{type:"p",text:"Инверторный компрессор сложнее обычного. В нём есть частотный преобразователь, который плавно регулирует скорость вращения. Обычный компрессор — просто включается и выключается."},{type:"p",text:"Инверторный компрессор:"},{type:"list",items:["Работает на переменной скорости (от 20% до 100% мощности)","Не испытывает пусковых нагрузок (в 5-7 раз меньше износа)","Точнее поддерживает температуру (±0.5°C вместо ±2°C)","Служит 12-15 лет вместо 7-10 лет у обычного"]},{type:"h",text:"2. Электроника управления (+4 000 ₽ к цене)"},{type:"p",text:"Инверторный кондиционер требует более сложной платы управления:"},{type:"list",items:["Частотный преобразователь для компрессора","Датчики температуры (внутренний, внешний, теплообменника)","Защита от перепадов напряжения (актуально для Иркутска)","Алгоритмы плавного регулирования мощности"]},{type:"h",text:"3. Более качественный вентилятор (+2 000 ₽ к цене)"},{type:"p",text:"В инверторных моделях обычно ставят вентиляторы с подшипниками качения (а не скольжения). Они тише и служат дольше. Подшипники качения — это +5 лет к сроку службы вентилятора."},{type:"h",text:"4. Лучший теплообменник (+1 000 ₽ к цене)"},{type:"p",text:"В инверторных моделях теплообменник обычно имеет антикоррозийное покрытие (Blue Fin или Gold Fin). Это защищает от ржавчины и увеличивает срок службы на 3-5 лет."},{type:"h",text:"Итого: за что вы переплачиваете"},{type:"list",items:["Инверторный компрессор — +8 000 ₽","Электроника управления — +4 000 ₽","Качественный вентилятор — +2 000 ₽","Лучший теплообменник — +1 000 ₽","ИТОГО: +15 000 ₽ к цене"]},{type:"h",text:"Расчёт экономии электричества"},{type:"p",text:"Теперь посчитаем, сколько электричества экономит инвертор. Для примера возьмём квартиру в Иркутске, кондиционер 09 BTU (2.5 кВт охлаждения), работает 4 месяца в году (июнь-сентябрь), по 8 часов в день."},{type:"h",text:"Обычный кондиционер (on/off)"},{type:"p",text:"Потребление: 0.8 кВт/час (компрессор 0.7 кВт + вентилятор 0.1 кВт). Но компрессор работает не постоянно — примерно 60% времени (остальное — паузы между включениями)."},{type:"list",items:["Потребление в час: 0.8 кВт × 0.6 = 0.48 кВт/час","В день (8 часов): 0.48 × 8 = 3.84 кВт","В месяц (30 дней): 3.84 × 30 = 115.2 кВт","За сезон (4 месяца): 115.2 × 4 = 460.8 кВт","Стоимость (тариф 3.5 ₽/кВт): 460.8 × 3.5 = 1 613 ₽ за сезон"]},{type:"h",text:"Инверторный кондиционер"},{type:"p",text:"Потребление: компрессор работает постоянно, но на пониженной мощности (в среднем 30% от номинала). Вентилятор — 0.1 кВт."},{type:"list",items:["Потребление компрессора: 0.7 кВт × 0.3 = 0.21 кВт/час","Общее потребление: 0.21 + 0.1 = 0.31 кВт/час","В день (8 часов): 0.31 × 8 = 2.48 кВт","В месяц (30 дней): 2.48 × 30 = 74.4 кВт","За сезон (4 месяца): 74.4 × 4 = 297.6 кВт","Стоимость (тариф 3.5 ₽/кВт): 297.6 × 3.5 = 1 042 ₽ за сезон"]},{type:"h",text:"Экономия"},{type:"list",items:["Обычный: 1 613 ₽ за сезон","Инвертор: 1 042 ₽ за сезон","Экономия: 571 ₽ за сезон (35%)"]},{type:"p",text:"На первый взгляд, экономия небольшая — всего 571 ₽ за сезон. Но давайте посчитаем окупаемость за весь срок службы."},{type:"h",text:"Расчёт окупаемости"},{type:"h",text:"Сценарий 1: Квартира, кондиционер работает 4 месяца в году"},{type:"list",items:["Переплата за инвертор: 15 000 ₽","Экономия за сезон: 571 ₽","Окупаемость: 15 000 / 571 = 26 лет"]},{type:"p",text:"Вывод: для квартиры, где кондиционер работает только летом, инвертор НЕ окупается за счёт электричества. Но есть другие факторы — срок службы и комфорт."},{type:"h",text:"Сценарий 2: Офис, кондиционер работает 8 месяцев в году (май-декабрь)"},{type:"list",items:["Экономия за сезон (8 месяцев): 571 × 2 = 1 142 ₽","Окупаемость: 15 000 / 1 142 = 13 лет"]},{type:"p",text:"Вывод: для офиса инвертор окупается за 13 лет — это примерно срок службы обычного кондиционера. То есть инвертор «отбивает» себя за счёт того, что служит дольше."},{type:"h",text:"Сценарий 3: Магазин, кондиционер работает 12 месяцев в году"},{type:"list",items:["Экономия за год: 571 × 3 = 1 713 ₽","Окупаемость: 15 000 / 1 713 = 8.8 лет"]},{type:"p",text:"Вывод: для коммерческих помещений, где кондиционер работает круглый год, инвертор окупается за 9 лет — это быстрее срока службы обычного кондиционера (7-10 лет)."},{type:"h",text:"Скрытая экономия: срок службы"},{type:"p",text:"Но экономия электричества — это не главное. Главное — срок службы:"},{type:"list",items:["Обычный кондиционер: 7-10 лет (из-за пусковых нагрузок компрессор изнашивается быстрее)","Инверторный кондиционер: 12-15 лет (компрессор работает плавно, без пусковых токов)"]},{type:"p",text:"Разница: 5 лет дополнительного срока службы. Сколько стоит новый кондиционер с монтажом? Минимум 35 000 ₽. То есть инвертор экономит вам 35 000 ₽ на замене кондиционера через 10 лет."},{type:"h",text:"Итоговая выгода от инвертора"},{type:"list",items:["Экономия электричества за 12 лет: 571 × 12 = 6 852 ₽","Экономия на замене кондиционера: 35 000 ₽","ИТОГО выгода: 41 852 ₽","Переплата за инвертор: 15 000 ₽","ЧИСТАЯ ВЫГОДА: 26 852 ₽ за 12 лет"]},{type:"h",text:"Когда инвертор НЕ нужен"},{type:"p",text:"Инвертор не нужен, если:"},{type:"list",items:["Кондиционер нужен редко — например, только в самые жаркие дни (10-15 дней в году)","Это дача или съёмная квартира — вы не планируете пользоваться кондиционером дольше 3-5 лет","Бюджет сильно ограничен — лучше взять обычный, чем вообще без кондиционера","Помещение используется не постоянно — гараж, подсобка, склад"]},{type:"p",text:"В этих случаях обычный кондиционер — разумный выбор. Он дешевле, а экономия электричества и срок службы не критичны."},{type:"h",text:"Когда инвертор НУЖЕН"},{type:"p",text:"Инвертор нужен, если:"},{type:"list",items:["Кондиционер работает регулярно — 3+ месяцев в году","Это ваша квартира или дом — вы планируете жить там 10+ лет","Важна тишина — спальня, детская, кабинет","Важна точная температура — винный погреб, серверная, детская","У вас скачки напряжения — инвертор лучше защищён от перепадов"]},{type:"p",text:"В этих случаях инвертор окупится за счёт экономии электричества, большего срока службы и комфорта."},{type:"h",text:"Наш профессиональный совет"},{type:"p",text:"За 10 лет работы мы установили более 3000 кондиционеров в Иркутске. Вот что мы заметили:"},{type:"list",items:["Клиенты с инверторами обращаются по гарантии в 3 раза реже","Инверторы работают тише — клиенты не жалуются на шум","Инверторы точнее держат температуру — клиенты не жалуются на «то холодно, то жарко»","Через 7-8 лет владельцы обычных кондиционеров часто звонят на замену компрессора","Владельцы инверторов через 10 лет звонят только на чистку"]},{type:"p",text:"Если вы берёте кондиционер для квартиры в Иркутске, где он будет работать 3-4 месяца в году, мы рекомендуем инвертор. Да, переплата 15 000 ₽. Но за 12 лет вы сэкономите 41 852 ₽ на электричестве и замене. Плюс комфорт — ровная температура, тишина, отсутствие сквозняков."},{type:"p",text:"Если бюджет ограничен — берите обычный кондиционер. Это лучше, чем вообще без кондиционера. Но будьте готовы, что через 7-10 лет可能需要 замена компрессора (10-15 000 ₽)."},{type:"p",text:"Все инверторные модели есть в нашем каталоге с доставкой и монтажом в Иркутске. Бесплатный выезд инженера поможет подобрать оптимальный вариант под ваш бюджет. Звоните — подберём кондиционер, который прослужит 12-15 лет."}]},"skolko-stoit-ustanovka-konditsionera-irkutsk":{title:"Сколько стоит установить кондиционер в Иркутске",category:"Кондиционеры",content:[{type:"p",text:"Цена на установку кондиционера в Иркутске складывается из двух частей: стоимости самого оборудования и работ по монтажу. Разберём честно, из чего формируется итоговая сумма, чтобы вы понимали, за что платите."},{type:"h",text:"Из чего складывается стоимость"},{type:"list",items:["Сам кондиционер — зависит от бренда, мощности и типа (инверторный или обычный).","Стандартный монтаж — установка блоков, прокладка трассы до 3 метров, вакуумирование, пуско-наладка.","Дополнительные работы — если трасса длиннее, нужен подъём на высоту или сложный доступ."]},{type:"h",text:"Сколько стоит оборудование"},{type:"p",text:"Настенные сплит-системы начинаются примерно от 17 000 ₽ за бюджетные модели on/off и доходят до 100 000 ₽ и выше за премиальные инверторные системы с умным домом. Для стандартной комнаты 20-25 м² хороший инверторный кондиционер обойдётся в 30 000–45 000 ₽."},{type:"h",text:"Сколько стоит монтаж"},{type:"p",text:"Стандартный монтаж кондиционера — от 18 000 ₽. В него входит установка внутреннего и наружного блоков, прокладка и изоляция трассы, вакуумирование магистрали и запуск. Вакуумирование — обязательный этап: без него внутри системы остаётся влага, которая выводит из строя компрессор."},{type:"h",text:"От чего цена может вырасти"},{type:"list",items:["Длинная трасса — каждый метр сверх стандартных 3 метров оплачивается отдельно.","Высотные работы — установка наружного блока на верхних этажах.","Сложное штробление стен под скрытую трассу.","Дополнительное оборудование — зимний комплект, помпа для отвода конденсата."]},{type:"h",text:"Как узнать точную цену"},{type:"p",text:"Точную стоимость мы называем после бесплатного выезда и осмотра — учитываем длину трассы, место установки блоков и особенности вашего помещения. В каталоге на нашем сайте можно выбрать модель по площади и сразу увидеть цену с монтажом. А консультация и замер — бесплатны и ни к чему не обязывают."}]},"skolko-stoyat-plastikovye-okna-irkutsk":{title:"Сколько стоят пластиковые окна в Иркутске",category:"Окна",content:[{type:"p",text:"Стоимость пластиковых окон зависит от размера, конструкции, профиля и стеклопакета. Плюс отдельно считается монтаж, откосы и подоконник. Разберём, из чего складывается цена, чтобы вы могли ориентироваться в предложениях."},{type:"h",text:"Цена самого окна"},{type:"p",text:"Готовое пластиковое окно из профиля VEKA начинается примерно от 11 000 ₽ за квадратный метр. Итоговая цена зависит от размера конструкции, количества створок, типа стеклопакета и фурнитуры. Чем больше окно и чем больше в нём открывающихся створок — тем выше цена."},{type:"h",text:"Что влияет на стоимость окна"},{type:"list",items:["Размер конструкции — цена считается за квадратный метр.","Количество створок — глухое окно дешевле, чем с двумя открывающимися створками.","Стеклопакет — двухкамерный энергосберегающий дороже обычного, но лучше держит тепло.","Ламинация — окна под дерево или в цвет стоят дороже белых."]},{type:"h",text:"Монтаж, откосы и подоконник"},{type:"p",text:"Кроме самого окна, в смету входят монтажные работы. Монтаж окна — примерно от 2 100 ₽ за м². Откосы и подоконник считаются отдельно по погонному метру. Важно: качественный монтаж шва с паро-влагоизоляцией напрямую влияет на то, будет ли окно тёплым и сухим долгие годы."},{type:"h",text:"Пример расчёта"},{type:"p",text:"Стандартное окно 1300×1400 мм под ключ (окно + монтаж + откосы + подоконник) обойдётся ориентировочно в 30 000–40 000 ₽. Точная сумма зависит от конструкции и комплектации. На нашем сайте есть онлайн-калькулятор окон — введите свои размеры и сразу увидите примерную стоимость с визуализацией."},{type:"h",text:"Как сэкономить без потери качества"},{type:"p",text:"Мы производим окна на собственном производстве, поэтому цена без наценок посредников. Бесплатный замер поможет точно определить размеры — это исключит переплату за «запас». А профиль VEKA и фурнитура MACO прослужат десятилетиями, что выгоднее, чем менять дешёвые окна через несколько лет."}]},"pochemu-poteyut-plastikovye-okna":{title:"Почему потеют пластиковые окна и что делать",category:"Окна",content:[{type:"p",text:"Конденсат на пластиковых окнах — частая проблема, особенно зимой. Многие думают, что окна бракованные, но чаще причина в другом. Разберём, почему потеют окна и как это исправить."},{type:"h",text:"Главная причина — повышенная влажность и нехватка вентиляции"},{type:"p",text:"Пластиковые окна герметичны — они отлично держат тепло, но и «запирают» воздух в квартире. Влага от дыхания, готовки, стирки и растений накапливается и оседает конденсатом на самой холодной поверхности — стекле. Со старыми деревянными окнами такого не было, потому что они пропускали воздух через щели."},{type:"h",text:"Другие возможные причины"},{type:"list",items:["Широкий подоконник перекрывает поток тёплого воздуха от батареи к окну.","Плотные шторы, которые не дают тёплому воздуху прогревать стекло.","Однокамерный стеклопакет — для климата Иркутска нужен двухкамерный.","Ошибки монтажа — продувание и промерзание из-за некачественного шва."]},{type:"h",text:"Что можно сделать самому"},{type:"list",items:["Регулярно проветривать помещение или ставить окно на микропроветривание.","Не закрывать батарею широким подоконником и плотными шторами.","Переключить фурнитуру на зимний режим (более плотный прижим створки).","Использовать вытяжку на кухне и в ванной."]},{type:"h",text:"Кардинальное решение — вентиляция"},{type:"p",text:"Если проветривание не помогает, а конденсат появляется постоянно — проблема в нехватке свежего воздуха. Лучшее решение — установить бризер или приточно-вытяжную систему. Они подают свежий воздух без открывания окон, снижают влажность и убирают конденсат. Заодно исчезает духота и риск появления плесени."},{type:"h",text:"Когда причина в окне или монтаже"},{type:"p",text:"Если окно промерзает, дует из-под подоконника или из откосов — это уже вопрос качества монтажа. Мы устанавливаем окна по технологии: правильный шаг крепления, пластиковые клинья, запенивание в несколько слоёв и паро-влагоизоляция шва. Если у вас проблема с существующими окнами — приедем, найдём причину и предложим решение."}]},"nuzhno-li-obsluzhivat-konditsioner":{title:"Нужно ли обслуживать кондиционер и как часто",category:"Кондиционеры",content:[{type:"p",text:"Многие покупают кондиционер и забывают о нём, пока он работает. Но без обслуживания техника быстро теряет эффективность, начинает неприятно пахнуть и может выйти из строя. Разберём, зачем нужно ТО и как часто его проводить."},{type:"h",text:"Зачем обслуживать кондиционер"},{type:"list",items:["Чистый воздух — в грязном кондиционере размножаются бактерии и плесень, которые попадают в воздух.","Эффективность — забитые фильтры и теплообменник снижают мощность и увеличивают расход электричества.","Долговечность — регулярное ТО продлевает срок службы компрессора и всей системы.","Экономия — вовремя обнаруженная утечка фреона дешевле, чем ремонт компрессора."]},{type:"h",text:"Что входит в обслуживание"},{type:"list",items:["Чистка и промывка фильтров внутреннего блока.","Чистка теплообменника и крыльчатки от пыли и грязи.","Антибактериальная обработка внутреннего блока.","Проверка давления фреона и герметичности системы.","Чистка дренажной системы, чтобы не подтекал конденсат."]},{type:"h",text:"Как часто проводить ТО"},{type:"p",text:"Оптимально — один раз в год, лучше всего весной, перед началом активного сезона. Если кондиционер работает интенсивно (в офисе, магазине, круглый год) — рекомендуется два раза в год. Фильтры при этом желательно промывать самостоятельно раз в 1-2 месяца в сезон."},{type:"h",text:"Признаки, что пора на ТО"},{type:"list",items:["Кондиционер стал хуже холодить или дольше выходит на нужную температуру.","Появился неприятный запах при включении.","Из внутреннего блока капает вода.","Кондиционер стал громче работать.","Вырос расход электроэнергии."]},{type:"h",text:"Доверьте обслуживание специалистам"},{type:"p",text:"Мы выполняем полное обслуживание кондиционеров в Иркутске: чистку, антибактериальную обработку, диагностику и заправку фреоном. Регулярное ТО стоит недорого, а экономит вам на ремонте и продлевает жизнь технике. Позвоните — подскажем, когда вашему кондиционеру нужно обслуживание."}]}};function _1(){const{slug:c}=km(),d=c?C1[c]:void 0;return b.useEffect(()=>{if(!d)return;const f=`${d.title} | Вектор Комфорта`;document.title=f;const r=d.excerpt||d.title,u=(g,y,h=!1)=>{const S=h?"property":"name";let j=document.querySelector(`meta[${S}="${g}"]`);j||(j=document.createElement("meta"),j.setAttribute(S,g),document.head.appendChild(j)),j.content=y};u("description",r),u("og:title",f,!0),u("og:description",r,!0),u("og:url",window.location.href,!0),u("og:type","article",!0),u("article:published_time","2026-01-15T08:00:00+08:00",!0),u("article:modified_time","2026-08-08T08:00:00+08:00",!0),u("article:author","Вектор Комфорта",!0),u("article:section",d.category,!0);const m={"@context":"https://schema.org","@type":"Article",headline:d.title,description:r,image:"https://www.vektor-komforta.ru/images/hero-bg.jpg",author:{"@type":"Organization",name:"Вектор Комфорта",url:"https://www.vektor-komforta.ru"},publisher:{"@type":"Organization",name:"Вектор Комфорта",logo:{"@type":"ImageObject",url:"https://www.vektor-komforta.ru/favicon.png"}},datePublished:"2026-01-15T08:00:00+08:00",dateModified:"2026-08-08T08:00:00+08:00",mainEntityOfPage:{"@type":"WebPage","@id":window.location.href},articleSection:d.category,keywords:`${d.category}
