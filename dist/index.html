<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Сколько стоит установка кондиционера в Иркутске?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Стоимость установки кондиционера зависит от модели и сложности монтажа. Стандартный монтаж — от 18 000 ₽. Мы делаем бесплатный выезд и замер, после чего называем точную цену. Продажа и монтаж кондиционера выполняются за 1 день, с гарантией от завода от 3 до 5 лет."
      }
    },
    {
      "@type": "Question",
      "name": "За сколько дней изготавливают пластиковые окна?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Срок изготовления пластиковых окон — 5-7 рабочих дней. Мы используем собственное производство, профиль VEKA и фурнитуру MACO с микропроветриванием. Гарантия на окна — 5 лет, на монтажные работы — 1 год."
      }
    },
    {
      "@type": "Question",
      "name": "Выезжаете ли вы на замер бесплатно?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Да, выезд специалиста, замер и консультация абсолютно бесплатны и ни к чему вас не обязывают. Мы работаем в Иркутске, Ангарске, Шелехове, Хомутово и пригороде до 50 км."
      }
    },
    {
      "@type": "Question",
      "name": "Какие окна вы делаете?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Изготавливаем любые пластиковые окна: обычные и панорамные окна ПВХ, остекление балконов и лоджий, крашеные окна, ламинацию под дерево или цвет, двери, витражи и стеклянные перегородки."
      }
    },
    {
      "@type": "Question",
      "name": "Делаете ли вентиляцию для квартиры и бизнеса?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Да, проектируем и монтируем приточную и вытяжную вентиляцию под ключ. Устанавливаем бризеры, рекуператоры и приточно-вытяжные системы Тион, Vakio для квартир, домов, кафе и офисов."
      }
    },
    {
      "@type": "Question",
      "name": "Что такое алмазное бурение и когда оно нужно?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Алмазное бурение — это аккуратное сверление отверстий в бетоне, железобетоне и кирпиче диаметром от 32 до 250 мм. Нужно под трубы, вентиляцию и кондиционеры. Работаем сухим способом с пылесосом без пыли и мокрым способом с водой — без трещин и сколов."
      }
    },
    {
      "@type": "Question",
      "name": "Можно ли заболеть от кондиционера?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Сам по себе кондиционер не вызывает болезнь. Болеют из-за грязных фильтров (рассадник бактерий), закрытых окон (накопление CO2 и вирусов) и неправильной температуры (переохлаждение). Регулярная чистка фильтров и проветривание решают 90% проблем."
      }
    },
    {
      "@type": "Question",
      "name": "Инверторный или обычный кондиционер — что выбрать?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Инверторный кондиционер экономит электричество до 30-40%, работает тише, держит ровную температуру и служит 12-15 лет (вместо 7-10 у обычного). Для квартиры, где кондиционер работает регулярно, рекомендуем инвертор. Для дачи (редкое использование) подойдёт обычный."
      }
    },
    {
      "@type": "Question",
      "name": "Бризер или рекуператор — что выбрать?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Бризер подаёт свежий воздух с улицы, очищает и подогревает. Рекуператор подаёт свежий + забирает отработанный воздух, экономя тепло (КПД 80%). Для Иркутска с длинной зимой рекуператор окупается за 2 недели отопительного сезона."
      }
    },
    {
      "@type": "Question",
      "name": "Почему потеют пластиковые окна?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Главная причина — повышенная влажность и нехватка вентиляции. Пластиковые окна герметичны и «запирают» воздух. Решение: проветривание, микропроветривание, установка бризера или приточно-вытяжной системы."
      }
    }
  ]
}

ужно?",a:"Алмазное бурение — это аккуратное сверление отверстий в бетоне, железобетоне и кирпиче диаметром от 32 до 250 мм. Нужно под трубы, вентиляцию и кондиционеры. Работаем сухим способом с пылесосом без пыли и мокрым способом с водой — без трещин и сколов."},{q:"Можно ли заболеть от кондиционера?",a:"Сам по себе кондиционер не вызывает болезнь. Болеют из-за грязных фильтров (рассадник бактерий), закрытых окон (накопление CO2 и вирусов) и неправильной температуры (переохлаждение). Регулярная чистка фильтров и проветривание решают 90% проблем."},{q:"Инверторный или обычный кондиционер — что выбрать?",a:"Инверторный кондиционер экономит электричество до 30-40%, работает тише, держит ровную температуру и служит 12-15 лет (вместо 7-10 у обычного). Для квартиры, где кондиционер работает регулярно, рекомендуем инвертор. Для дачи (редкое использование) подойдёт обычный."},{q:"Бризер или рекуператор — что выбрать?",a:"Бризер подаёт свежий воздух с улицы, очищает и подогревает. Рекуператор подаёт свежий + забирает отработанный воздух, экономя тепло (КПД 80%). Для Иркутска с длинной зимой рекуператор окупается за 2 недели отопительного сезона."},{q:"Почему потеют пластиковые окна?",a:"Главная причина — повышенная влажность и нехватка вентиляции. Пластиковые окна герметичны и «запирают» воздух. Решение: проветривание, микропроветривание, установка бризера или приточно-вытяжной системы."}];function Ho(){const[s,c]=v.useState(0),d=o=>{c(s===o?null:o)};return a.jsx("section",{className:"py-16 md:py-24 bg-white dark:bg-slate-900",children:a.jsxs("div",{className:"max-w-4xl mx-auto px-4 sm:px-6 lg:px-8",children:[a.jsxs("div",{className:"text-center mb-12",children:[a.jsx("span",{className:"inline-block px-4 py-1.5 rounded-full bg-blue-500/10 text-blue-700 dark:text-blue-400 text-xs font-bold uppercase tracking-widest mb-3",children:"Вопросы и ответы"}),a.jsx("h2",{className:"text-3xl sm:text-4xl font-black text-slate-900 dark:text-white tracking-tight",children:"Часто задаваем ext:"Не крепим верх окна на саморезы напрямую: при линейном расширении это может повредить профиль вплоть до трещины стеклопакета. Крепление должно давать конструкции возможность естественного движения."},{title:"Установка на пластиковые клинья",text:"Окно ставим обязательно на пластиковые клинья, и только вдоль рамы, а не поперёк — поперечная установка создаёт мостики холода, и место будет промерзать. Деревянные бруски не используем: со временем дерево гниёт, появляется продувание и промерзание. Пластиковые клинья не боятся влаги и служат столько же, сколько само окно."},{title:"Качественный монтажный шов",text:"Пену наносим в несколько слоёв — шов получается плотным, без пустот. Клинья запениваем с двух сторон. Монтажный шов обязательно закрываем паро-влагоизоляцией: это защищает пену от влаги и ультрафиолета, сохраняет её свойства и продлевает срок службы шва. Именно от качества шва зависит, будет ли окно тёплым и сухим долгие годы."}]},{icon:"❄️",title:"Кондиционеры",intro:"Кондиционер служит долго только при грамотном монтаже. Вот что мы делаем, чтобы техника работала годами без поломок.",blocks:[{title:"Вакуумирование магистрали",text:"Перед запуском обязательно вакуумируем трассу — удаляем воздух и влагу. Без вакуумирования внутри системы остаётся влага, которая разрушает компрессор и сокращает срок службы кондиционера в разы. Это этап, на котором нельзя экономить время."},{title:"Аккуратная развальцовка и герметичность",text:"Медную трубу развальцовываем правильным инструментом и проверяем каждое соединение на утечку. Даже небольшая утечка фреона со временем выведет технику из строя и приведёт к дорогому ремонту."},{title:"Правильный уклон дренажа",text:"Дренажную трассу прокладываем с уклоном, чтобы конденсат уходил самотёком и не подтекал в помещение. Неправильный дренаж — частая причина протечек и плесени."},{title:"Грамотное размещение блоков",text:"Наружный и внутренний блоки размещаем с учётом обслуживания, циркуляции воздуха и уровня шума. Правильное нужно периодически менять — если до них не добраться, система быстро теряет эффективность. Мы делаем обслуживание простым с самого начала."},{title:"Утепление и защита от конденсата",text:"Проходы через стену и воздуховоды на холодных участках утепляем. Без утепления на границе тепла и холода образуется конденсат — это сырость, плесень и капли на потолке. Утепление решает проблему на этапе монтажа."},{title:"Шумоглушение",text:"Устанавливаем оборудование с шумоглушением и антивибрационными элементами. Правильная вентиляция должна работать незаметно — вы чувствуете свежий воздух, но не слышите гула."},{title:"Рекуперация тепла",text:"Где это уместно, ставим приточно-вытяжные установки с рекуперацией: тепло уходящего воздуха подогревает свежий приточный. Зимой это экономит на отоплении и даёт комфортную температуру притока без сквозняка."}]},{icon:"🕳️",title:"Алмазное бурение",intro:"Аккуратное отверстие — залог качественного монтажа кондиционера или вентиляции. Работаем без пыли и трещин.",blocks:[{title:"Безударная технология",text:"Бурим алмазной коронкой без ударов и вибрации. Конструкция стены остаётся целой — без трещин, сколов и разрушения арматуры, в отличие от работы перфоратором."},{title:"Сухое и мокрое бурение",text:"Сухой способ с промышленным пылесосом — почти без пыли, идеально для готового ремонта. Мокрый способ с подачей воды — для сверхтвёрдых материалов и больших диаметров, обеспечивает охлаждение коронки."},{title:"Правильный уклон отверстия",text:"Отверстия под вентиляцию и трассы делаем с небольшим уклоном наружу, чтобы влага и конденсат не затекали в помещение."}]}];function K1(){return Qt("Стандарты монтажа окон и кондиционеров в Иркутске — по ГОСТу | Вектор Комфорта","Стандарты монтажа окон и кондиционеров в Иркутске: профиль VEKA с замкнутым армированием, пароизоляция шва по ГОСТ 30971, вакуумирование фреоновой трассы. Почему наш монтаж служит десятилетиями."),Ut([{name:"Главная",path:"/"},{name:"Стандарты монтажа",path:"/standarty"}]),a.jsxs враля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];return!c||!d||!o?s:`${o} ${u[d-1]} ${c}`}const F1={"montazh-okon-osenyu-i-zimoy":{date:"2026-08-20",title:"Можно ли устанавливать пластиковые окна осенью и зимой: условия монтажа и чек-лист приёмки",category:"Окна",excerpt:"Осенний и зимний монтаж окон возможен не «по сезону», а при соблюдении условий для профиля, проёма и каждого материала монтажного шва. Разбираем, что проверить до заказа и при приёмке работ.",metaDescription:"Можно ли менять пластиковые окна осенью и зимой: температура материалов, подготовка проёма, монтажный шов и чек-лист приёмки без мифов.",summary:"Да, менять окна можно и осенью, и зимой, если для всех материалов монтажного шва соблюдены условия применения, а оконный проём подготовлен: он сухой, очищен от пыли, наледи и непрочного слоя. Качество определяет не месяц в календаре, а технология на конкретном объекте. Если условия для монтажа не обеспечены, работы переносят или создают контролируемую тёплую зону.",content:[{type:"p",text:"Осенью заказчики часто откладывают замену окон до весны из опасения, что пена «не схватится», квартира выстудится, а новое окно начнёт продувать. Опасение понятное, но правильный вывод другой: монтаж в холодный период требует более внимательного контроля. Нельзя принимать решение по одному только прогнозу погоды или обещанию «у нас зимняя пена»."},{type:"h",text:"Главное: качество монтажа не зависит от сезона само по себе"},{type:"p",text:"Окно работает как система: рама, стеклопакет, фурнитура, крепёж, монтажный шов, откосы, отлив и подоконник должны работать вместе. Ошибка в одном элементе может проявиться как сквозняк, промерзание откоса, конденсат или перекос створки — даже если профиль и стеклопакет выбраны правильно."},{type:"p",text:"При зимнем монтаже проверяют четыре вещи:"},{type:"list",items:["состояние и температуру оконной конструкции до установки;","состояние проёма: он должен быть очищен от пыли, наледи, инея и отслаивающихся материалов;","паспортные условия применения пены, герметиков, лент и грунтовок;","крепление окна и защиту монтажного шва с внутренней и наружной стороны."]},{type:"p",text:"ГОСТ 30971-2012 допускает работы с пенополиуретановыми утеплителями при температуре не ниже −10 °C. Но эту цифру нельзя превращать в универсальное разрешение на любые работы при −10 °C. У каждого герметика, ленты, праймера и монтажной пены есть собственный диапазон применения, требования к хранению и подготовке поверхности. Ориентироваться нужно на самый строгий из этих параметров."},{type:"h",text:"Когда осенний и зимний монтаж допустим"},{type:"h",text:"В отапливаемой квартире"},{type:"p",text:"В отапливаемой квартире задача проще: оконные конструкции и монтажные материалы можно заранее выдержать в помещении до выравнивания температуры. Это снижает риск повреждения холодного ПВХ-профиля и позволяет использовать материалы в предусмотренном производителем режиме."},{type:"p",text:"Само окно при этом монтируют по той же инженерной логике, что и летом: выставляют в проектное положение, фиксируют механическим крепежом, выполняют монтажный шов, проверяют геометрию и регулируют створки."},{type:"h",text:"В неотапливаемом доме, на лоджии или строящемся объекте"},{type:"p",text:"Здесь нельзя обещать одинаковый результат «при любой погоде». Необходимо отдельно оценить температуру в зоне шва, состояние стен, возможность хранения материалов в тепле и условия для наружной герметизации. При необходимости создают локальную защищённую тёплую зону. Если этого сделать нельзя, перенос работ будет технически правильным решением."},{type:"h",text:"Когда работу стоит перенести"},{type:"p",text:"Монтаж не начинают или останавливают, если:"},{type:"list",items:["в проёме есть наледь, иней, мокрый непрочный слой или строительная пыль, которую невозможно удалить;","температура выходит за пределы применения хотя бы одного из используемых материалов;","сильный ветер, осадки или обледенение не позволяют качественно выполнить наружный слой шва;","оконные конструкции и материалы не были подготовлены к температуре помещения;","невозможно обеспечить безопасное выполнение работ и последующую защиту монтажного шва."]},{type:"p",text:"Это не «перестраховка». Монтажный шов должен сохранять герметичность и теплоизоляционные свойства после того, как отделка закроет его от осмотра."},{type:"h",text:"Что мороз меняет в технологии монтажа"},{type:"h",text:"ПВХ-профиль и стеклопакет нельзя монтировать «с колёс» после холодной перевозки"},{type:"p",text:"При отрицательной температуре ПВХ становится менее устойчивым к ударной нагрузке. Поэтому оконные конструкции и комплектующие должны прогреться в помещении до начала работ. Точный режим определяют по документации производителя и реальным условиям объекта."},{type:"h",text:"Основание проёма должно быть сухим и прочным"},{type:"p",text:"Пена и герметики не компенсируют лёд, влагу, пыль или отслаивающийся раствор. Если материал не сцепился с основанием, пустота может проявиться позже как продувание или локальное промерзание."},{type:"h",text:"Пена — не крепёж"},{type:"p",text:"Монтажная пена выполняет теплоизоляционную и звукоизоляционную функцию. Положение и нагрузку окна должны воспринимать опорные колодки и механический крепёж, предусмотренный проектом и конструкцией. Фраза «запенили крепко» не подтверждает правильность монтажа."},{type:"h",text:"Как должен быть устроен монтажный шов"},{type:"p",text:"У монтажного шва три функциональные зоны:"},{type:"list",items:["Наружная зона защищает шов от осадков, ветра и ультрафиолета, но должна позволять влаге изнутри шва выходить наружу.","Средняя зона отвечает за теплоизоляцию и заполняется утепляющим материалом без разрывов и пустот.","Внутренняя зона ограничивает попадание влажного воздуха помещения в утепляющий слой."]},{type:"p",text:"Конкретные материалы и узел примыкания зависят от стены, фасада, четверти проёма, типа отделки и проекта. Поэтому нельзя оценивать качество только по количеству пены, видимой под подоконником. Открытая снаружи пена не должна оставаться без защиты: она разрушается под воздействием влаги и ультрафиолета."},{type:"h",text:"Что спросить у исполнителя до заказа"},{type:"p",text:"До подписания договора полезно зафиксировать не общую фразу «монтаж по ГОСТу», а конкретные условия:"},{type:"list",items:["какой профиль, стеклопакет и фурнитура входят в конструкцию;","каким крепежом будет фиксироваться рама;","какие материалы применяются для внутреннего, среднего и наружного слоя шва;","в каком диапазоне температур допускается их применение;","как будут подготовлены и защищены проёмы при отрицательной температуре;","что входит в монтаж, отделку откосов, установку отлива и подоконника;","как оформлена гарантия на конструкцию и на монтаж."]},{type:"p",text:"Хорошая смета позволяет сравнивать не только итоговую цену, но и объём работ, материалы и ответственность исполнителя."},{type:"h",text:"Чек-лист приёмки окна после монтажа"},{type:"p",text:"Проверку лучше проводить до установки плотной чистовой отделки откосов."},{type:"h",text:"Рама, створки и фурнитура"},{type:"list",items:["Рама стоит без видимого перекоса.","Створка открывается, закрывается и переходит в режим проветривания без чрезмерного усилия.","Ручка не заедает и не проворачивается.","Зазоры по притвору равномерны, а створка не цепляет раму.","На профиле и стеклопакете нет трещин, сколов и глубоких царапин."]},{type:"h",text:"Монтажный шов и наружные элементы"},{type:"list",items:["Рама закреплена механически, а не удерживается только пеной.","На доступных участках нет незаполненных щелей и открытой пены, оставленной под прямым воздействием улицы.","Отлив установлен с уклоном наружу и не перекрывает водоотводные отверстия рамы.","Дренажные отверстия окна остаются открытыми.","Внутренний и наружный слой шва выполнены так, чтобы отделка не разрушала их при дальнейших работах."]},{type:"h",text:"Что важно зафиксировать в акте"},{type:"p",text:"Если при приёмке обнаружены проблемы с работой створки, трещины, видимые щели или повреждения, их фиксируют в акте до завершения расчёта. Не стоит рассчитывать, что регулировка, герметизация или замена детали «когда-нибудь потом» произойдут сами собой."},{type:"h",text:"Вывод"},{type:"p",text:"Осень и зима не являются запретом на замену окон. Запретом являются условия, при которых невозможно соблюсти технологию. Правильный вопрос перед заказом звучит не «до какой температуры вы ставите окна?», а «какими материалами, в каком диапазоне температуры и по какому узлу будет выполнен монтажный шов?». Такой подход защищает от необоснованных обещаний и помогает принять работу по понятным критериям."}],faq:[{q:"Можно ли устанавливать окна при −15 °C?",a:"Нельзя дать общий ответ для всех объектов и материалов. Для пенополиуретанового утеплителя ГОСТ 30971-2012 указывает нижнюю границу работ −10 °C, однако у других материалов могут быть более строгие ограничения. Решение принимают по документации на конкретные материалы и условиям на объекте."},{q:"Достаточно ли купить зимнюю монтажную пену?",a:"Нет. Зимняя пена решает только часть задачи и применяется при соблюдении её паспорта: важны температура баллона, состояние основания, диапазон температуры воздуха и защита готового шва. Она не заменяет правильный крепёж, подготовку проёма и внутреннюю или наружную герметизацию."},{q:"Вымерзнет ли квартира во время замены окна?",a:"При замене старого окна проём действительно остаётся открытым на время демонтажа и установки. Потери тепла зависят от температуры на улице, ветра, площади проёма, числа окон и организации работ. Исполнитель должен объяснить порядок замены и не держать несколько проёмов открытыми без необходимости."},{q:"Нужно ли ждать весны, если окно дует уже сейчас?",a:"Нет, но сначала нужна диагностика. Причиной может быть фурнитура, изношенный уплотнитель, монтажный шов, откос, стеклопакет или вентиляционный режим помещения. Замена окна без определения причины не всегда решает проблему."},{q:"Как понять, что после монтажа дует именно из шва, а не от створки?",a:"Для этого оценивают место появления холодного воздуха, состояние притвора, работу фурнитуры и температуру откосов. Лист бумаги у створки может показать лишь ориентировочную плотность прижима; полноценная диагностика шва требует осмотра узла и при необходимости инструментального обследования."}]},"brizer-i-rekuperator-zimoy":{date:"2026-08-18",title:"Бризер и рекуператор зимой: как выбрать режим, обслужить фильтры и не потерять производительность",category:"Вентиляция",excerpt:"Зимняя эксплуатация приточной вентиляции зависит от типа устройства и комплектации. Разбираем, почему бризеру нужен рабочий вытяжной канал, как рекуператор борется с обмерзанием и почему фильтры нельзя обслуживать «на глаз».",metaDescription:"Как пользоваться бризером и рекуператором зимой: чем отличаются приборы, когда включать зимний режим, как обслуживать фильтры и что считать неисправностью.",summary:"Бризер и рекуператор можно использовать зимой только в пределах, указанных в инструкции конкретной модели. До холодов нужно определить комплектацию прибора, проверить состояние фильтров, выбрать предусмотренный производителем режим и убедиться, что у воздуха есть путь на приток, вытяжку и переток между помещениями. Универсальной настройки «на всю зиму» не существует.",content:[{type:"p",text:"Зимой к вентиляции предъявляют больше требований, чем летом. Улица холоднее, окна чаще закрыты, а влагу от готовки, душа и сушки вещей сложнее удалить без организованного воздухообмена. Приточный воздух нужно либо подогреть, либо использовать тепло вытяжного воздуха через рекуператор. Именно в это время становятся заметны ошибки подбора, монтажа и обслуживания."},{type:"p",text:"Главная ошибка — считать все приборы с отверстием в наружной стене одинаковыми. Бризер, рекуператор и приточный клапан решают разные задачи, поэтому и зимняя эксплуатация у них различается."},{type:"h",text:"Сначала определите, какой прибор установлен"},{type:"h",text:"Бризер — механический приток"},{type:"p",text:"Бризер забирает наружный воздух, очищает его фильтрами и подаёт в комнату вентилятором. Модели с нагревательным элементом могут подогревать приточный воздух в пределах своих характеристик."},{type:"p",text:"Бризер не удаляет отработанный воздух из квартиры сам по себе. Чтобы воздух действительно проходил через жильё, нужна работающая вытяжка в кухне и санузлах, а также путь для перетока воздуха между комнатами: например, предусмотренный зазор под межкомнатной дверью или переточная решётка."},{type:"h",text:"Рекуператор — приток и вытяжка с возвратом части тепла"},{type:"p",text:"Комнатный рекуператор попеременно работает на приток и вытяжку либо использует отдельные воздушные потоки — это зависит от конструкции. Тепло вытяжного воздуха передаётся теплообменнику, после чего часть этой энергии используется для приточного воздуха."},{type:"p",text:"На примере VAKIO BASE Smart: прибор меняет направление воздушного потока с заданным алгоритмом. Такая смена направления — штатная работа, а не признак неисправности. У этой модели в инструкции отдельно предусмотрен зимний режим рекуперации для температуры наружного воздуха −10 °C и ниже."},{type:"p",text:"Рекуператор не создаёт тепло «из ничего» и не отменяет необходимость оценивать реальный воздухообмен квартиры. Его задача — снизить теплопотери при организованной вентиляции, а не заменить отопление."},{type:"h",text:"Почему зимой нельзя пользоваться прибором «как летом»"},{type:"h",text:"Для бризера важна комплектация с подогревом"},{type:"p",text:"Один и тот же корпус может выпускаться в разных комплектациях. Например, возможность работы Ballu ONEAIR ASP-100 при отрицательной температуре связана с установленным керамическим нагревательным элементом. В инструкции к прибору указано, что без этого элемента при температуре поступающего воздуха ниже +5 °C работа ограничивается, а комплектация с нагревателем рассчитана на более холодный наружный воздух."},{type:"p",text:"Из этого следует простой вывод: нельзя переносить характеристики одной комплектации на другую и обещать, что любой бризер «работает до −40 °C». Сначала нужно посмотреть паспорт модели, установленный фильтр и наличие нагревателя."},{type:"h",text:"Для рекуператора важны влажность и защита от обмерзания"},{type:"p",text:"В холодный период тёплый вытяжной воздух отдаёт тепло холодному теплообменнику. При высокой влажности на нём может появляться иней. Поэтому производители предусматривают зимние алгоритмы, интервалы продувки или отдельные режимы размораживания. Нельзя отключать такие алгоритмы из-за того, что прибор на короткое время меняет режим или производительность."},{type:"p",text:"Если производительность упала, сначала проверяют состояние фильтра и соответствие выбранного режима наружной температуре. Если это не помогает, теплообменник и устройство должен осмотреть специалист."},{type:"h",text:"Чек-лист перед началом холодов"},{type:"h",text:"1. Найдите точную модель и комплектацию"},{type:"p",text:"Сверьте шильдик, руководство пользователя и установленное дополнительное оборудование. Для зимней работы это особенно важно: нагреватель, датчик, фильтр и версия прибора влияют на допустимые режимы."},{type:"h",text:"2. Проверьте фильтры по инструкции, а не по внешнему виду"},{type:"p",text:"Фильтр создаёт сопротивление воздушному потоку. Когда он загрязняется, прибор может стать шумнее и выдавать меньший расход воздуха. Однако способ обслуживания зависит от типа фильтра:"},{type:"list",items:["предфильтр грубой очистки в некоторых моделях допускает очистку или промывку;","фильтры тонкой очистки EPA и HEPA часто предназначены для замены, а не для промывки или чистки пылесосом;","угольные фильтры не восстанавливают сорбционные свойства после обычной очистки."]},{type:"p",text:"Не используйте единое правило для всех моделей. Например, производитель TION прямо указывает, что EPA-фильтр E11 для ряда бризеров нельзя чистить водой или пылесосом. Для другого прибора порядок может отличаться, поэтому приоритет всегда у его инструкции."},{type:"p",text:"Перед снятием фильтра отключите прибор от электросети так, как предписано производителем. Нельзя промывать или устанавливать обратно влажный фильтрующий элемент, если инструкция этого не допускает."},{type:"h",text:"3. Выберите предусмотренный зимний режим"},{type:"p",text:"У VAKIO BASE Smart зимний режим рекуперации рекомендован при наружной температуре −10 °C и ниже. У бризера с нагревателем задают температуру приточного воздуха и режим работы в пределах паспорта модели. Это не одно и то же действие, поэтому название кнопки на другом устройстве может означать другой алгоритм."},{type:"p",text:"Если в инструкции нет отдельного зимнего режима, не нужно придумывать его самостоятельно. Достаточно соблюдать разрешённый диапазон температуры и регламент обслуживания."},{type:"h",text:"4. Осмотрите доступные решётки и канал"},{type:"p",text:"Внутренняя и наружная решётки должны оставаться свободными. Листья, строительная плёнка, снег, мебель перед прибором или плотные шторы могут ухудшать поток воздуха. Нельзя вставлять предметы в канал, снимать наружную решётку с высоты без безопасного доступа или пытаться отбивать наледь инструментом."},{type:"h",text:"5. Проверьте, куда уходит воздух из квартиры"},{type:"p",text:"Для бризера недостаточно только подавать воздух в спальню. Если вытяжной канал загрязнён, перекрыт или в квартире нет перетока между помещениями, приток не превратится в полноценный воздухообмен."},{type:"p",text:"Безопасная бытовая проверка вытяжки проводится полоской тонкой бумаги при обеспеченном притоке воздуха. Открытый огонь — спички, свечи и зажигалки — для проверки вентиляционных каналов не используют. В квартире с газовым оборудованием отсутствие тяги или притока — причина обратиться в специализированную службу и управляющую организацию."},{type:"h",text:"Что зимой является нормальной работой, а что — нет"},{type:"h",text:"Штатные явления"},{type:"list",items:["Бризер с нагревателем увеличивает потребление электроэнергии, когда подогревает холодный наружный воздух.","Комнатный рекуператор меняет направление потока по предусмотренному алгоритму.","В мороз прибор может работать на более низкой скорости, если так устроена его защита или автоматика.","Индикатор замены фильтра может сработать раньше ожидаемого срока при высокой запылённости наружного воздуха."]},{type:"h",text:"Признаки, при которых нужен осмотр"},{type:"list",items:["воздух не поступает при включённом приборе и чистом фильтре;","устройство регулярно выдаёт ошибку, отключается или издаёт нехарактерный скрежет;","из корпуса или стены появляется вода, не предусмотренная конструкцией;","производительность резко упала после правильной замены фильтра;","наружная часть канала обмерзает так, что перекрывает воздух;","в помещении сохраняются обратная тяга, запахи из шахты или влажность, хотя приток и вытяжка должны работать."]},{type:"p",text:"Не стоит разбирать электропривод, нагреватель, плату управления или теплообменник без допуска производителя. Устройство может быть под напряжением, а неправильная сборка влияет на герметичность и безопасность."},{type:"h",text:"Почему один прибор не всегда решает задачу всей квартиры"},{type:"p",text:"Вентиляцию выбирают не по красивой цифре на коробке и не только по площади комнаты. Учитывают число людей, назначение помещения, расположение дверей, вытяжку, возможность перетока, наружный шум, пыль и требуемую скорость на ночном режиме."},{type:"p",text:"Один бризер в спальне может организовать приток именно в спальню. Он не гарантирует нужный воздухообмен в закрытой кухне, ванной, детской и гостиной. Аналогично один комнатный рекуператор работает в пределах своего помещения и схемы. Для всей квартиры или дома иногда нужна система из нескольких устройств либо проект приточно-вытяжной вентиляции."},{type:"h",text:"Вывод"},{type:"p",text:"Зимняя вентиляция начинается не с покупки нового прибора, а с понимания уже установленного оборудования. Название «бризер» не говорит, есть ли в нём нагреватель; слово «рекуператор» не гарантирует одинаковую схему работы и производительность. Проверьте паспорт устройства, фильтры, режим, наружный канал, вытяжку и переток воздуха. Тогда прибор будет работать в предусмотренных условиях, а не по догадкам."}],faq:[{q:"Нужно ли выключать бризер на ночь зимой?",a:"Это зависит от модели, настроек, уровня шума и задачи по воздухообмену. Сам факт ночи не является технической причиной отключать прибор. Если его выключить, приток прекратится, а естественная вытяжка может ослабнуть. Выбирайте ночную скорость или автоматику только в пределах инструкции конкретного устройства."},{q:"Можно ли мыть HEPA-фильтр?",a:"Не существует общего правила для всех HEPA-фильтров. Многие сменные фильтры тонкой очистки не предназначены для промывки и после контакта с водой подлежат замене. Точный порядок указан в инструкции к модели и на маркировке фильтра."},{q:"Почему после установки бризера окна всё равно запотевают?",a:"Конденсат зависит от температуры внутренней поверхности окна, влажности в помещении, работы вытяжки, объёма притока и источников влаги. Бризер может быть частью решения, но не заменяет диагностику, если вытяжка не работает, есть мостики холода или в квартире постоянно образуется избыток влаги."},{q:"Заменяет ли рекуператор обычную вытяжку в ванной и на кухне?",a:"Нет, это определяется проектом и схемой вентиляции. Комнатный рекуператор не даёт автоматически право перекрыть штатные вытяжные каналы. Влажные и загрязнённые помещения требуют отдельного расчёта воздухообмена."},{q:"Как часто менять фильтры?",a:"Ориентируйтесь на инструкцию, индикацию прибора и фактическое загрязнение. Производитель TION, например, для ряда EPA- и HEPA-фильтров рекомендует замену не реже одного раза в шесть месяцев, а вблизи дорог, промзон и частного сектора — чаще. Для другого бренда срок и способ обслуживания могут быть другими."}]},"nuzhno-li-nakryvat-naruzhnyy-blok-konditsionera-zimoy":{date:"2026-08-16",title:"Нужно ли накрывать наружный блок кондиционера на зиму: когда защита от снега нужна, а когда мешает",category:"Кондиционеры",excerpt:"Наружный блок рассчитан на улицу, но не на перекрытые решётки, снежный занос и падающие сосульки. Разбираем разницу между герметичным чехлом, навесом и правильно выбранным местом монтажа.",metaDescription:"Нужно ли закрывать наружный блок кондиционера на зиму: чем опасен герметичный чехол, когда нужен навес, как защитить блок от снега и наледи без нарушения обдува.",summary:"Герметично укрывать наружный блок кондиционера плёнкой или плотным чехлом не нужно, а для работающего на обогрев оборудования это недопустимо: воздухозабор, выдув и дренаж должны оставаться свободными. Если блоку угрожают снежные заносы, падающий лёд или сильный ветер, защищают не чехлом, а правильно спроектированным навесом, экраном или основанием с учётом инструкции конкретной модели.",content:[{type:"p",text:"Осенью наружные блоки часто закрывают полиэтиленом «от снега и мороза». Логика кажется очевидной: на улице холодно, значит технику нужно укутать. Но наружный блок изначально рассчитан на размещение снаружи. Его нормальная работа и естественное высыхание зависят от свободного движения воздуха и отвода воды."},{type:"p",text:"Правильный вопрос не «нужен ли чехол?», а «будет ли блок работать зимой и от чего именно его нужно защитить?»"},{type:"h",text:"Как устроен наружный блок и почему ему нужен свободный воздух"},{type:"p",text:"В наружном блоке находятся теплообменник, вентилятор, компрессор, элементы автоматики и поддон для отвода воды. В режимах охлаждения и обогрева через теплообменник проходит большой объём наружного воздуха. Если перекрыть воздухозабор или выдув, оборудование не сможет нормально обмениваться теплом с улицей."},{type:"p",text:"При обогреве наружный блок периодически покрывается инеем. Это штатное явление для теплового насоса в холодную влажную погоду. Система запускает оттайку, вода должна уйти из поддона, а воздух — свободно проходить через блок. Плотный чехол, снежный занос или неправильно поставленный экран могут нарушить этот процесс."},{type:"h",text:"Два разных сценария: кондиционер работает зимой или простаивает"},{type:"h",text:"Если кондиционер используют на обогрев"},{type:"p",text:"Нельзя закрывать корпус, решётки, воздухозабор и выдув любым чехлом. Нельзя включать систему, если блок занесён снегом, покрыт плотной наледью или его решётки перекрыты."},{type:"p",text:"Перед зимней эксплуатацией проверяют:"},{type:"list",items:["допускает ли конкретная модель работу на обогрев при фактической наружной температуре;","предусмотрен ли отвод воды при оттайке так, чтобы она не образовывала наледь под блоком и не попадала на проход;","остаются ли свободными воздухозабор и выдув;","не направляет ли сильный ветер снег прямо в теплообменник;","есть ли безопасный доступ к сервису и осмотру."]},{type:"p",text:"Ни зимний комплект, ни чехол не отменяют ограничения производителя по температуре эксплуатации. Зимний комплект подбирают под конкретную задачу и модель, а не устанавливают «на всякий случай»."},{type:"h",text:"Если кондиционер не планируют включать до весны"},{type:"p",text:"Наружному блоку не требуется герметичная упаковка только потому, что наступила зима. Плотный водонепроницаемый чехол задерживает влагу и ухудшает высыхание корпуса после оттепелей. Это повышает риск коррозии металлических элементов."},{type:"p",text:"Допустимость сезонной защиты нужно смотреть в инструкции конкретной модели. Если производитель допускает защитный чехол для отключённого оборудования, он не должен превращать блок в герметичный мешок, перекрывать нижнюю часть и задерживать воду. Перед первым запуском чехол и любые временные заглушки обязательно снимают."},{type:"h",text:"Когда защита от снега действительно нужна"},{type:"p",text:"Защита нужна не от самого мороза, а от конкретного риска на месте монтажа."},{type:"h",text:"Падающий лёд и сосульки"},{type:"p",text:"Если над блоком есть карниз, кровля или балкон, с которых может сходить лёд, нужен расчётный защитный козырёк либо перенос блока в безопасное место. Самодельный тонкий козырёк, закреплённый вплотную к корпусу, может не выдержать удар и дополнительно повредить оборудование."},{type:"h",text:"Снежный занос"},{type:"p",text:"Если блок стоит низко у земли или на открытом участке, его может занести снегом. Производители для регионов с обильными осадками предусматривают поднятие блока на основание и снегозащитный навес. Высота основания, расстояния до навеса и стен нельзя назначать «на глаз»: они зависят от инструкции модели, ожидаемой высоты снега и направления выброса воздуха."},{type:"h",text:"Сильный ветер и боковой снег"},{type:"p",text:"Ветер может загонять снег в теплообменник и создавать рециркуляцию холодного воздуха. В таких условиях применяют защитные панели или меняют ориентацию блока, но не перекрывают путь входящего и выходящего воздуха."},{type:"h",text:"Чем навес отличается от чехла"},{type:"p",text:"Навес — стационарный элемент над блоком, который защищает от прямого падения осадков или льда и при этом сохраняет расчётные зазоры для воздухозабора, выдува, сервисного доступа и отвода воды."},{type:"p",text:"Чехол — тканевое или полимерное укрытие, которое часто прилегает к решёткам и стенкам корпуса. Если он закрывает работающий блок, то препятствует воздухообмену. Если он герметично закрывает выключенный блок, то может удерживать влагу внутри."},{type:"p",text:"Поэтому нельзя считать навес и чехол взаимозаменяемыми решениями. Навес проектируют до монтажа или после обследования места. Чехол не исправляет ошибку выбора места установки."},{type:"h",text:"Что можно сделать самостоятельно перед зимой"},{type:"p",text:"Только безопасные действия с доступного уровня:"},{type:"list",items:["убрать листья, ветки и лёгкий мусор вокруг блока, не сгибая ламели теплообменника;","убедиться, что воздухозабор и выдув не перекрыты коробками, мебелью, ограждением или снегом;","осмотреть кронштейны, крепёж, кабель-канал и изоляцию трассы без попытки подтягивать крепления на высоте;","проверить, не направляется ли дренаж на тротуар, ступени или соседский балкон;","при эксплуатации на обогрев сверить наружную температуру с паспортом модели."]},{type:"p",text:"Перед любой очисткой доступной части оборудования отключают питание по инструкции. Не следует лезть к блоку с лестницы без страховки, разбирать корпус, выпрямлять теплообменник подручными предметами или скалывать лёд отвёрткой. Ламели и трубки теплообменника легко повредить, а ремонт контура хладагента требует диагностики и специального оборудования."},{type:"h",text:"Что должен проверить специалист"},{type:"p",text:"Перед зимней эксплуатацией или при установке защиты специалист оценивает:"},{type:"list",items:["паспортные монтажные зазоры конкретного наружного блока;","прочность основания и кронштейнов;","высоту относительно возможного снежного покрова;","направление ветра, воздухозабора и выброса воздуха;","возможность отвода воды при оттайке;","риск падения льда, доступ для обслуживания и требования фасада здания;","рабочий диапазон температуры в режимах охлаждения и обогрева."]},{type:"p",text:"В инструкциях производителей наружных блоков для холодного климата прямо встречаются решения в виде снегозащитного навеса, защитных панелей и поднятого основания. При этом производитель одновременно требует не заносить блок снегом и не перекрывать его дренажные отверстия. Это и есть техническая логика правильной защиты."},{type:"h",text:"Вывод"},{type:"p",text:"Наружный блок не нужно «утеплять» от календарной зимы. Его нужно правильно установить и не мешать ему обмениваться воздухом и отводить воду. Для работающего кондиционера герметичный чехол недопустим. Для выключенного — он не является обязательной защитой и может удерживать влагу. Если есть риск снега, ветра или падающих сосулек, решением будет не обёртка, а корректное инженерное решение: основание, навес, экран или изменение места установки с соблюдением инструкции производителя."}],faq:[{q:"Можно ли закрыть наружный блок полиэтиленом, если кондиционер выключен?",a:"Герметичное укрытие не является универсальной мерой защиты. Оно может задерживать влагу и ухудшать высыхание корпуса. Если вы рассматриваете сезонный чехол, сначала проверьте инструкцию к своей модели; чехол не должен использоваться на работающем блоке и не должен перекрывать дренаж."},{q:"Нужен ли козырёк над наружным блоком?",a:"Козырёк оправдан при реальном риске падения льда, прямого заноса снегом или попадания осадков с кровли. Его размеры, высоту и зазоры выбирают по инструкции блока и условиям фасада. Козырёк, который перекрывает выдув или мешает сервису, создаёт новую проблему вместо защиты."},{q:"Можно ли включить кондиционер, если наружный блок в снегу?",a:"Нет, пока снег перекрывает воздухозабор или выдув. Сначала нужно безопасно освободить доступ воздуха. Если блок расположен на высоте, обмерзание плотное или есть риск падения льда, это работа для специалиста."},{q:"Нужно ли убирать лёд с теплообменника отвёрткой или молотком?",a:"Нет. Механическое воздействие может повредить ламели и медные трубки. Причину сильного и постоянного обмерзания нужно искать в температурном режиме, оттайке, дренаже, воздушном потоке или неисправности."},{q:"Чехол защитит кондиционер от мороза?",a:"Нет. Чехол не меняет допустимый диапазон работы оборудования. При включении системы важны свободный воздух, дренаж и соблюдение температурных ограничений модели."}]},"kak-vybrat-konditsioner-po-ploshchadi":{date:"2026-08-14",title:"Как выбрать кондиционер по площади помещения",category:"Кондиционеры",summary:"Мощность подбирают по площади: примерно 1 кВт холода на каждые 10 м². Ориентир — 07 до 20 м², 09 до 25 м², 12 до 35 м², 18 до 50 м², 24 до 60-70 м². Брать «с запасом» без причины не стоит: лишняя мощность даёт частые включения и износ.",content:[{type:"p",text:"Самая частая ошибка при покупке кондиционера — выбор «на глаз» или по совету продавца, которому нужно продать подороже. На самом деле подбор простой: главный параметр — площадь помещения, которую нужно охладить. Разберём по порядку."},{type:"h",text:"Что означают цифры 07, 09, 12, 18, 24"},{type:"p",text:"Эти цифры — мощность кондиционера в тысячах BTU (британских тепловых единиц). Чем больше число, тем мощнее прибор и тем большую площадь он охлаждает. Ориентир простой: на каждые 10 м² площади нужно примерно 1 кВт холода."},{type:"list",items:["07 (7000 BTU) — до 20 м². Спальня, детская, небольшая комната.","09 (9000 BTU) — до 25 м². Стандартная комната в квартире.","12 (12000 BTU) — до 35 м². Большая комната, студия, кухня-гостиная.","18 (18000 BTU) — до 50 м². Просторное помещение, небольшой офис.","24 (24000 BTU) — до 60-70 м². Большой зал, коммерческое помещение."]},{type:"h",text:"Что учесть кроме площади"},{type:"p",text:"Площадь — основа, но есть нюансы, которые могут потребовать более мощную модель:"},{type:"list",items:["Солнечная сторона — окна на юг или запад дают дополнительный нагрев.","Высокие потолки — если выше 2,7 м, объём воздуха больше.","Много техники и людей — компьютеры, серверы, большое число людей выделяют тепло.","Панорамное остекление — большие окна сильно нагреваются летом."]},{type:"h",text:"Не берите «с запасом» без причины"},{type:"p",text:"Слишком мощный кондиционер для маленькой комнаты — это не только переплата при покупке. Он будет часто включаться и выключаться, что увеличивает износ и расход электричества, а воздух в комнате станет некомфортно «резким». Лучше подобрать модель точно под площадь."},{type:"h",text:"Как мы помогаем с выбором"},{type:"p",text:"В нашем каталоге можно выбрать кондиционер сразу по площади помещения — система покажет подходящие модели с нужной мощностью. А при бесплатном выезде наш специалист учтёт все нюансы вашего помещения и подберёт оптимальный вариант без переплат."}]},"mozhno-li-zabolet-ot-konditsionera":{date:"2026-08-12",title:"Можно ли заболеть от кондиционера: развенчиваем главный миф с техническим разбором",category:"Кондиционеры",summary:"Сам кондиционер простуду не вызывает: он гоняет воздух по кругу и не подаёт его с улицы. Болеют из-за грязных фильтров с бактериями и плесенью, духоты при закрытых окнах и переохлаждения. Держите разницу с улицей не больше 7-10°C и чистите прибор раз в год.",content:[{type:"p",text:"«Не сиди под кондиционером — заболеешь» — эту фразу слышал каждый. Но правда ли, что кондиционер вызывает простуду? Как профессиональные монтажники, мы установили более 3000 кондиционеров в Иркутске и точно знаем: сам по себе кондиционер не вызывает болезнь. Болеют по другим причинам, о которых редко говорят. Разберём технически."},{type:"h",text:"Главный миф: кондиционер простужает холодным воздухом"},{type:"p",text:"Многие думают, что простуда — это от холода. На самом деле простуда (ОРВИ) — это вирусная инфекция. Холодный воздух сам по себе не вызывает болезнь, если в нём нет вирусов или бактерий. Вы можете стоять на морозе -30°C и не заболеть, если вокруг нет вирусов. И наоборот — можете заболеть летом в жару, если рядом чихнул заражённый человек."},{type:"h",text:"Как на самом деле работает кондиционер"},{type:"p",text:"Это важно понять: обычный кондиционер (сплит-система) НЕ подаёт свежий воздух с улицы. Он работает по замкнутому циклу:"},{type:"list",items:["Забирает воздух ИЗ КОМНАТЫ через внутренний блок","Пропускает его через фильтр (очищает от пыли)","Охлаждает через теплообменник (фреон забирает тепло)","Выдувает обратно В ТУ ЖЕ КОМНАТУ"]},{type:"p",text:"То есть кондиционер гоняет один и тот же воздух по кругу. Свежий воздух с улицы НЕ поступает. Это ключевой момент, который многие не понимают."},{type:"h",text:"Почему тогда люди болеют? 3 реальные причины"},{type:"h",text:"Причина №1: Грязные фильтры — рассадник бактерий и плесени"},{type:"p",text:"Внутри кондиционера идеальные условия для размножения бактерий:"},{type:"list",items:["Влажность — конденсат на теплообменнике создаёт влажную среду","Температура — +20-25°C, оптимально для бактерий","Пыль — фильтр задерживает органику, которой питаются бактерии","Темнота — внутри блока нет ультрафиолета"]},{type:"p",text:"Если кондиционер не чистить 1-2 года, внутри теплообменника и дренажного поддона размножаются:"},{type:"list",items:["Легионелла (Legionella) — вызывает тяжёлую пневмонию","Плесневые грибы (Aspergillus) — вызывают аллергию и астму","Стафилококк и стрептококк — вызывают ангину и бронхит"]},{type:"p",text:"Когда вы включаете грязный кондиционер, вентилятор выдувает эти бактерии в комнату. Вы вдыхаете их — и заболеваете. Но не от холода, а от бактерий."},{type:"h",text:"Причина №2: Закрытые окна — накопление CO2 и вирусов"},{type:"p",text:"Когда вы включаете кондиционер, вы закрываете окна, чтобы холод не уходил. Это логично. Но есть проблема:"},{type:"list",items:["Углекислый газ (CO2) — вы выдыхаете CO2, он накапливается в комнате. При концентрации выше 1000 ppm (0.1%) начинается головная боль, усталость, снижение иммунитета","Вирусы — если в комнате есть заражённый человек, вирусы накапливаются в воздухе. При открытых окнах они улетучиваются, при закрытых — остаются","Сухой воздух — кондиционер осушает воздух. Влажность падает до 30-40% (норма 50-60%). Сухой воздух пересушивает слизистую носа — она перестаёт задерживать вирусы"]},{type:"p",text:"Результат: вы дышите спертым воздухом с высокой концентрацией CO2 и вирусов, слизистая пересушена — иммунитет падает, вы заболеваете."},{type:"h",text:"Причина №3: Переохлаждение и температурный шок"},{type:"p",text:"Если на улице +35°C, а в комнате +18°C, организм испытывает температурный шок при выходе на улицу. Это не вызывает простуду напрямую, но:"},{type:"list",items:["Сужаются сосуды слизистых — снижается местный иммунитет","Пересушивается горло — легче подхватить вирус","Организм тратит энергию на адаптацию — меньше ресурсов на борьбу с инфекциями"]},{type:"p",text:"Оптимальная разница температур между улицей и комнатой — не более 7-10°C. Если на улице +30°C, в комнате должно быть +22-24°C, не ниже."},{type:"h",text:"Как правильно пользоваться кондиционером, чтобы не заболеть"},{type:"h",text:"1. Чистите фильтры каждые 2-4 недели"},{type:"p",text:"Снимите переднюю панель внутреннего блока, достаньте сетчатые фильтры, промойте под тёплой водой с мылом, высушите и поставьте обратно. Это занимает 5 минут и защищает от 90% проблем."},{type:"h",text:"2. Делайте профессиональную чистку раз в год"},{type:"p",text:"Раз в год (лучше весной, перед сезоном) вызывайте мастера для глубокой чистки:"},{type:"list",items:["Чистка теплообменника паром или химией — удаляет бактерии и плесень","Антибактериальная обработка — убивает оставшиеся микроорганизмы","Чистка дренажного поддона — убирает слизь и засоры","Проверка давления фреона — если утечка, кондиционер хуже холодит"]},{type:"p",text:"Стоимость профессиональной чистки в Иркутске — 3000-5000 ₽. Это дешевле, чем лечить пневмонию."},{type:"h",text:"3. Проветривайте комнату каждые 2-3 часа"},{type:"p",text:"Открывайте окна на 5-10 минут каждые 2-3 часа. Это снизит концентрацию CO2 и вирусов. Да, часть холода уйдёт, но здоровье важнее. Альтернатива — установить бризер (приточную вентиляцию), который подаёт свежий воздух без открывания окон."},{type:"h",text:"4. Поддерживайте правильную температуру"},{type:"p",text:"Не ставьте температуру ниже +22°C. Оптимально — +23-24°C. Разница с улицей не должна превышать 7-10°C. Если на улице +30°C, ставьте +22-24°C, не ниже."},{type:"h",text:"5. Увлажняйте воздух"},{type:"p",text:"Кондиционер осушает воздух. Купите увлажнитель (2000-5000 ₽) и поддерживайте влажность 50-60%. Это защитит слизистую носа от пересыхания."},{type:"h",text:"6. Не направляйте поток воздуха на себя"},{type:"p",text:"Используйте функцию «качание жалюзи» или направляйте поток вверх/в сторону. Прямой поток холодного воздуха на тело вызывает локальное переохлаждение."},{type:"h",text:"Что делать, если уже заболели от кондиционера"},{type:"p",text:"Если вы всё-таки заболели, скорее всего это:"},{type:"list",items:["ОРВИ (простуда) — лечится как обычная простуда: покой, обильное питьё, симптоматическое лечение","Ангина или бронхит — если высокая температура и сильная боль в горле, обратитесь к врачу, могут понадобиться антибиотики","Аллергия — если заложен нос, слезятся глаза, чихаете — это может быть аллергия на плесень. Примите антигистаминное и вызовите мастера для чистки кондиционера","Легионеллёз (редко) — тяжёлая пневмония с высокой температурой. Требуется срочная госпитализация"]},{type:"h",text:"Наш профессиональный совет"},{type:"p",text:"Кондиционер — это безопасно, если за ним ухаживать. За 10 лет работы мы не видели ни одного случая, чтобы человек заболел от исправного и чистого кондиционера. Все случаи «простуды от кондиционера», которые мы разбирали, были связаны с:"},{type:"list",items:["Грязными фильтрами (не чистили 2+ года)","Закрытыми окнами без проветривания","Слишком низкой температурой (+18°C при +35°C на улице)"]},{type:"p",text:"Если вы соблюдаете простые правила (чистка фильтров, проветривание, правильная температура), кондиционер не только не вызовет болезнь, но и улучшит качество жизни: вы будете лучше спать, работать и отдыхать в комфорте."},{type:"p",text:"Нужна профессиональная чистка кондиционера в Иркутске? Звоните — приедем, почистим, обработаем антибактериальным составом. Стоимость — от 3000 ₽. Работаем быстро и аккуратно."}]},"okna-veka-vs-rehau-chto-luchshe-dlya-irkutska":{date:"2026-08-10",title:"Окна VEKA vs Rehau: что лучше для Иркутска? Честное сравнение от производителя",category:"Окна",summary:"Для Иркутска выгоднее VEKA SoftLine 70: замкнутое армирование, 5 камер, сопротивление теплопередаче Ro = 0.78 м²·°C/Вт. Rehau Delight при сопоставимых характеристиках дороже на 2 000-4 000 ₽ за окно — на квартире с 5 окнами разница 10 000-20 000 ₽.",excerpt:"Выбор между VEKA и Rehau — это выбор между двумя лучшими немецкими профилями для пластиковых окон. Разберём по пунктам, что лучше для сурового климата Иркутска.",content:[{type:"p",text:"Выбор между VEKA и Rehau — это выбор между двумя лучшими немецкими профилями для пластиковых окон. Оба профиля производятся в Германии, оба соответствуют высшим стандартам качества. Но для сурового климата Иркутска один из них подходит лучше. Разберём по пунктам."},{type:"h",text:"Введение: почему этот выбор важен для Иркутска"},{type:"p",text:"Иркутск — это регион с экстремальным климатом: зимой температура опускается до -40°C, летом поднимается до +35°C. Перепады температур достигают 75°C. Это значит, что окна должны выдерживать экстремальные нагрузки: не промерзать зимой, не деформироваться летом, сохранять герметичность десятилетиями."},{type:"h",text:"Сравнение профилей: VEKA vs Rehau"},{type:"h",text:"1. Толщина стенок профиля"},{type:"p",text:"VEKA: Класс А (толщина стенок 3 мм), замкнутое армирование (стальной контур по всему периметру), жёсткость профиля — максимальная."},{type:"p",text:"Rehau: Класс А (толщина стенок 3 мм), армирование П-образное (не замкнутое), жёсткость профиля — высокая, но ниже VEKA."},{type:"p",text:"Вывод: VEKA жёстче за счёт замкнутого армирования. Для Иркутска с перепадами температур это критично — окно не деформируется, сохраняет геометрию десятилетиями."},{type:"h",text:"Цены в Иркутске: VEKA vs Rehau"},{type:"p",text:"VEKA SoftLine 70: Одностворчатое окно (1300×1400 мм) — от 14 900 ₽, двухстворчатое — от 19 900 ₽, трёхстворчатое — от 24 900 ₽."},{type:"p",text:"Rehau Delight: Одностворчатое окно (1300×1400 мм) — от 16 900 ₽, двухстворчатое — от 22 900 ₽, трёхстворчатое — от 28 900 ₽."},{type:"p",text:"Вывод: VEKA дешевле на 2 000-4 000 ₽ на каждое окно. Для квартиры с 5 окнами экономия составит 10 000-20 000 ₽."},{type:"h",text:"Вывод: что выбрать для Иркутска?"},{type:"p",text:"Для Иркутска VEKA SoftLine 70 — оптимальный выбор. Замкнутое армирование, 5 камер, сопротивление теплопередаче Ro = 0.78 м²·°C/Вт. Дешевле Rehau на 2 000-4 000 ₽ при сопоставимых характеристиках."},{type:"p",text:"Закажите окна VEKA в «Вектор Комфорта»:"},{type:"list",items:["Собственное производство в Иркутске","Профиль VEKA с замкнутым армированием","Фурнитура MACO с микропроветриванием","Монтаж по ГОСТу","Гарантия 5 лет на монтаж","Бесплатный замер в Иркутске, Ангарске, Шелехове, Хомутово"]},{type:"p",text:"Позвоните +7 (914) 914-66-06 — перезвоним за 15 минут и бесплатно рассчитаем стоимость окон."}]},"top-10-konditsionerov-irkutsk-2026":{date:"2026-08-08",title:"ТОП-10 кондиционеров для квартиры в Иркутске 2026: экспертный рейтинг с техническим разбором",category:"Кондиционеры",summary:"Для квартиры в Иркутске оптимальны: до 30 000 ₽ — Ballu Olympio Edge (от 24 822 ₽), 30-40 000 ₽ — инвертор Ballu Tessey DC (от 32 169 ₽), 40-50 000 ₽ — Kentatsu Канами, от 50 000 ₽ — Daikin Sensira. Бюджетные бренды собирают на одних заводах, разница — в компонентах.",content:[{type:"p",text:"Как профессиональные монтажники с 10-летним опытом, мы установили в Иркутске более 3000 кондиционеров и знаем, какие модели действительно надёжные, а какие — маркетинговая обёртка над средним качеством. В этом рейтинге мы разберём не только цены, но и техническую начинку: компрессоры, теплообменники, электронику и реальное качество сборки."},{type:"h",text:"Как мы составляли рейтинг: технический подход"},{type:"p",text:"Мы не просто смотрим на бренд и цену. Мы разбираем кондиционеры и сравниваем:"},{type:"list",items:["Компрессор — сердце кондиционера (Toshiba, GMCC, Highly, Panasonic)","Теплообменник — медь или алюминий, толщина рёбер, антикоррозийное покрытие","Электроника — плата управления, защита от перепадов напряжения","Вентилятор — уровень шума, подшипники (качения или скольжения)","Хладагент — R32 (современный) или R410A (устаревший)","Завод-производитель — Midea, Gree, AUX, Hisense, Haier"]},{type:"h",text:"Важно: все бюджетные бренды делают на одних заводах в Китае"},{type:"p",text:"Это не секрет, но об этом редко говорят. Ballu, Royal Thermo, Electrolux, Kentatsu, Axioma, Midea — все они производятся на 4-5 крупных заводах в Китае:"},{type:"list",items:["Midea — собственный завод, делает для себя и для других брендов","Gree — крупнейший в мире производитель кондиционеров","AUX — делает для многих европейских брендов","Hisense — крупный производитель бытовой техники","Haier — ещё один крупный игрок"]},{type:"p",text:"Разница между брендами — это не завод, а контроль качества, компоненты и гарантия. Сейчас разберём на конкретных примерах."},{type:"h",text:"Сравнение: Axioma 9 инвертор vs Midea 9 инвертор"},{type:"p",text:"Оба бренда производятся на заводе Midea в Китае. Но цена отличается: Axioma H Инвертор R32 — от 31 890 ₽, Midea Персона Инвертор Wi-Fi — от 53 090 ₽. Разница — 21 200 ₽. За что вы переплачиваете?"},{type:"h",text:"Что общего у Axioma и Midea"},{type:"list",items:["Завод: Midea (Гуандун, Китай)","Компрессор: GMCC (совместное предприятие Midea и Toshiba)","Теплообменник: медные трубы с алюминиевым оребрением","Хладагент: R32 (современный, экологичный)","Гарантия: 5 лет"]},{type:"h",text:"В чём разница"},{type:"p",text:"Разница — в компонентах и контроле качества:"},{type:"list",items:["Электроника: у Midea более сложная плата управления с защитой от перепадов напряжения (актуально для Иркутска, где скачки напряжения частые)","Вентилятор: у Midea подшипники качения (тише, долговечнее), у Axioma — скольжения (дешевле, но шумнее через 2-3 года)","Фильтрация: у Midea многоступенчатая (HEPA + угольный + ионизатор), у Axioma — базовый фильтр грубой очистки","Wi-Fi модуль: у Midea встроенный, у Axioma — опция (нужно докупать)","Контроль качества: Midea проверяет 100% моделей на стенде, Axioma — выборочно (10-15%)"]},{type:"h",text:"Наш вердикт по сравнению"},{type:"p",text:"Если бюджет ограничен — Axioma работает нормально, но через 3-4 года вентилятор может начать шуметь. Если берёте на 10+ лет — Midea надёжнее за счёт подшипников качения и лучшей электроники. Разница в 21 000 ₽ окупается за счёт долговечности и тишины."},{type:"h",text:"ТОП-3 бюджетных модели (до 30 000 ₽)"},{type:"h",text:"1. Ballu Olympio Edge BSO-07 — от 24 822 ₽"},{type:"p",text:"Завод: AUX (Китай). Компрессор: Highly (Hitachi). Хорошая сборка для своей цены."},{type:"list",items:["Площадь: до 20 м² (07 BTU)","Уровень шума: 23 дБ","Компрессор: Highly (Hitachi)","Теплообменник: медь + алюминий с антикоррозийным покрытием","Гарантия: 3 года"]},{type:"p",text:"Наш вердикт: Лучший выбор в бюджете до 25 000 ₽. Установили более 200 штук — процент брака менее 1%."},{type:"h",text:"2. SHUFT Berg SFTO-09 — от 17 566 ₽"},{type:"p",text:"Завод: Midea. Компрессор: GMCC (Toshiba). Самая доступная модель с нормальным компрессором."},{type:"list",items:["Площадь: до 25 м² (09 BTU)","Уровень шума: 26 дБ","Компрессор: GMCC (Toshiba)","Электроника: базовая, без защиты от скачков напряжения","Гарантия: 2 года"]},{type:"p",text:"Наш вердикт: Для дачи или съёмной квартиры — нормально. Для постоянного использования в квартире — лучше доплатить до Ballu Olympio Edge."},{type:"h",text:"3. Axioma Серия H R32 ASX-09H1R — от 21 790 ₽"},{type:"p",text:"Завод: Midea. Компрессор: GMCC. Хорошая сборка, но вентилятор на подшипниках скольжения."},{type:"list",items:["Площадь: до 25 м² (09 BTU)","Уровень шума: 24 дБ (новый), 28-30 дБ (через 3 года)","Компрессор: GMCC (Toshiba)","Вентилятор: подшипники скольжения","Гарантия: 3 года"]},{type:"p",text:"Наш вердикт: Неплохой выбор, но через 3-4 года вентилятор может начать шуметь. Если берёте на 5+ лет — лучше доплатить до инвертора."},{type:"h",text:"ТОП-4 средних модели (30 000 – 50 000 ₽)"},{type:"h",text:"4. Ballu Tessey DC BSTI-09 (инвертор) — от 32 169 ₽"},{type:"p",text:"Завод: Midea. Компрессор: GMCC инверторный. Электроника с защитой от скачков напряжения."},{type:"list",items:["Площадь: до 25 м² (09 BTU)","Уровень шума: 20 дБ","Компрессор: GMCC инверторный","Электроника: защита от перепадов 170-260В","Wi-Fi: встроенный","Гарантия: 5 лет"]},{type:"p",text:"Наш вердикт: Лучшее соотношение цена-качество среди инверторов. Установили более 150 штук — процент брака 0.5%."},{type:"h",text:"5. Axioma Серия H Инвертор R32 — от 31 890 ₽"},{type:"p",text:"Завод: Midea. Компрессор: GMCC инверторный. Но вентилятор на подшипниках скольжения."},{type:"list",items:["Площадь: до 25 м² (09 BTU)","Уровень шума: 22 дБ (новый), 26-28 дБ (через 3 года)","Компрессор: GMCC инверторный","Вентилятор: подшипники скольжения","Wi-Fi: нет (опция)","Гарантия: 3 года"]},{type:"p",text:"Наш вердикт: Дешевле Ballu Tessey на 300 ₽, но через 3 года вентилятор станет шумнее. Если разница в цене не критична — лучше Ballu."},{type:"h",text:"6. Kentatsu Канами Инвертор Wi-Fi — от 39 140 ₽"},{type:"p",text:"Завод: Midea. Компрессор: GMCC инверторный. Вентилятор на подшипниках качения (тише, долговечнее)."},{type:"list",items:["Площадь: до 25 м² (09 BTU)","Уровень шума: 21 дБ (стабильно через 5 лет)","Компрессор: GMCC инверторный","Вентилятор: подшипники качения","Wi-Fi: встроенный","Гарантия: 5 лет"]},{type:"p",text:"Наш вердикт: Отличный выбор. Подшипники качения — это +5 лет к сроку службы вентилятора."},{type:"h",text:"7. Midea Персона Инвертор Wi-Fi — от 53 090 ₽"},{type:"p",text:"Завод: Midea (премиальная линейка). Компрессор: GMCC инверторный с улучшенной балансировкой. Многоступенчатая фильтрация."},{type:"list",items:["Площадь: до 25 м² (09 BTU)","Уровень шума: 19 дБ","Компрессор: GMCC инверторный (премиум)","Фильтрация: HEPA H13 + угольный + ионизатор","Вентилятор: подшипники качения","Wi-Fi: встроенный","Гарантия: 5 лет"]},{type:"p",text:"Наш вердикт: Лучший выбор для аллергиков и семей с детьми. HEPA-фильтр задерживает 99.95% пыли и пыльцы."},{type:"h",text:"ТОП-3 премиум модели (от 50 000 ₽)"},{type:"h",text:"8. Daikin FTXF25C Sensira — от 79 800 ₽"},{type:"p",text:"Завод: Daikin (Таиланд). Компрессор: Daikin Swing (собственная разработка). Эталон качества."},{type:"list",items:["Площадь: до 25 м² (09 BTU)","Уровень шума: 19 дБ","Компрессор: Daikin Swing (Япония)","Теплообменник: медь с антикоррозийным покрытием Blue Fin","Электроника: защита от перепадов 150-265В","Гарантия: 5 лет","Срок службы: 15-20 лет"]},{type:"p",text:"Наш вердикт: Если бюджет позволяет — это лучший выбор. Daikin работает десятилетиями. У нас есть клиенты, у которых Daikin работают по 15 лет без ремонта."},{type:"h",text:"9. Toshiba Seiya RAS-07J2CVSG — от 75 900 ₽"},{type:"p",text:"Завод: Toshiba (Таиланд). Компрессор: Toshiba Rotary. Отличное качество по чуть более доступной цене, чем Daikin."},{type:"list",items:["Площадь: до 20 м² (07 BTU)","Уровень шума: 20 дБ","Компрессор: Toshiba Rotary","Электроника: защита от перепадов 160-260В","Гарантия: 5 лет","Срок службы: 12-15 лет"]},{type:"p",text:"Наш вердикт: Отличная альтернатива Daikin. Чуть проще электроника, но компрессор такой же надёжный."},{type:"h",text:"10. Electrolux Fusion Wave Super DC EACS/I-09HFW/N8 — от 49 281 ₽"},{type:"p",text:"Завод: Midea (премиальная линейка для Electrolux). Компрессор: GMCC инверторный с улучшенной балансировкой."},{type:"list",items:["Площадь: до 25 м² (09 BTU)","Уровень шума: 21 дБ","Компрессор: GMCC инверторный (премиум)","Электроника: европейские стандарты качества","Гарантия: 5 лет"]},{type:"p",text:"Наш вердикт: Если хотите европейский бренд, но не готовы платить за Daikin — это лучший выбор."},{type:"h",text:"Наш профессиональный совет"},{type:"p",text:"Для квартиры в Иркутске, где кондиционер работает регулярно (3-4 месяца в году), мы рекомендуем:"},{type:"list",items:["Бюджет до 30 000 ₽ — Ballu Olympio Edge (проверенная модель, минимум брака)","Бюджет 30-40 000 ₽ — Ballu Tessey DC (инвертор, Wi-Fi, защита от скачков)","Бюджет 40-50 000 ₽ — Kentatsu Канами (подшипники качения = +5 лет службы)","Бюджет от 50 000 ₽ — Daikin Sensira (эталон качества, 15-20 лет без ремонта)"]},{type:"p",text:"Все модели из рейтинга есть в нашем каталоге с доставкой и монтажом в Иркутске. Бесплатный выезд инженера поможет определить точную стоимость с учётом длины трассы и особенностей вашего помещения. Звоните — подберём оптимальный вариант под ваш бюджет."}]},"invertornyy-ili-obychnyy-konditsioner":{date:"2026-08-05",title:"Инверторный или обычный кондиционер — что выбрать",category:"Кондиционеры",summary:"Для квартиры или дома, где кондиционер работает регулярно, выгоднее инвертор: экономия электроэнергии до 30-40%, тише работа, ровная температура и больший срок службы. Обычный on/off дешевле и оправдан для дачи, гаража или редких жарких дней.",content:[{type:"p",text:"При выборе кондиционера вы обязательно столкнётесь с двумя типами: инверторный и обычный (он же on/off). Разница между ними существенная. Разберём честно, чтобы вы поняли, за что стоит переплатить, а когда это не нужно."},{type:"h",text:"Как работает обычный кондиционер (on/off)"},{type:"p",text:"Обычный кондиционер работает по принципу «включился — выключился». Он охлаждает воздух до заданной температуры на полной мощности, затем компрессор полностью выключается. Когда температура снова поднимается — включается опять на полную. Из-за этого температура немного «скачет», а частые запуски компрессора увеличивают износ."},{type:"h",text:"Как работает инверторный кондиционер"},{type:"p",text:"Инверторный кондиционер плавно регулирует мощность компрессора. Достигнув нужной температуры, он не выключается, а работает на пониженной мощности, поддерживая ровный микроклимат. Это даёт несколько важных преимуществ."},{type:"h",text:"Преимущества инвертора"},{type:"list",items:["Экономия электроэнергии — до 30-40% по сравнению с обычным.","Тише работает — нет резких включений компрессора.","Ровная температура — без перепадов «холодно-жарко».","Дольше служит — компрессор не испытывает пусковых нагрузок.","Лучше работает на обогрев зимой, в том числе при минусовых температурах."]},{type:"h",text:"Когда достаточно обычного кондиционера"},{type:"p",text:"Обычный кондиционер дешевле и вполне оправдан, если:"},{type:"list",items:["Кондиционер нужен нечасто — например, только в жаркие дни на даче.","Ограничен бюджет, а прибор нужен «здесь и сейчас».","Помещение используется не постоянно (гараж, подсобка)."]},{type:"h",text:"Наш совет"},{type:"p",text:"Для квартиры или дома, где кондиционер работает регулярно, мы рекомендуем инверторные модели — они окупают разницу в цене за счёт экономии электричества, работают тише и служат дольше. Для эпизодического использования подойдёт и обычный. В нашем каталоге есть оба типа — с фильтром по типу вы легко сравните модели и цены."}]},"kakie-plastikovye-okna-vybrat":{date:"2026-08-02",title:"Какие пластиковые окна выбрать для квартиры в Иркутске",category:"Окна",summary:"Для квартиры в Иркутске оптимально: профиль VEKA от 60 мм с замкнутым армированием, 4-5 камер, двухкамерный энергосберегающий стеклопакет с аргоном и фурнитура MACO. Но даже лучшее окно будет дуть и промерзать без грамотного монтажа с паро-влагоизоляцией шва.",content:[{type:"p",text:"Пластиковые окна выбирают на десятилетия, поэтому важно разобраться в основных параметрах. Особенно в Иркутске, где зимой бывают сильные морозы, а летом жара. Расскажем, на что реально смотреть, а на что — маркетинговые уловки."},{type:"h",text:"Профиль — основа окна"},{type:"p",text:"Профиль — это пластиковая рама окна. Мы работаем с немецким профилем VEKA. Важный момент, о котором редко говорят: внутри качественного профиля должно быть стальное армирование замкнутого типа. Замкнутый контур придаёт окну жёсткость по всему периметру — окно не «ведёт» со временем, сохраняет геометрию даже при перепадах температуры."},{type:"h",text:"Сколько камер нужно"},{type:"p",text:"Камеры — это воздушные полости внутри профиля. Для климата Иркутска оптимально 4-5 камер и ширина профиля от 60 мм. Такой профиль хорошо держит тепло и не промерзает зимой."},{type:"h",text:"Стеклопакет"},{type:"p",text:"Стеклопакет — это стёкла с воздушными камерами между ними. Для нашего климата рекомендуем:"},{type:"list",items:["Двухкамерный стеклопакет (3 стекла) — хорошо держит тепло зимой.","Энергосберегающее покрытие (i-стекло) — отражает тепло обратно в комнату.","Заполнение аргоном — дополнительно снижает теплопотери."]},{type:"h",text:"Фурнитура — то, что открывает и закрывает окно"},{type:"p",text:"Фурнитура работает каждый день, поэтому её качество критично. Мы ставим фурнитуру MACO — она годами доказывает надёжность без поломок. Полезная функция — микропроветривание: свежий воздух поступает без сквозняка и без открывания створки нараспашку."},{type:"h",text:"Почему монтаж важнее самого окна"},{type:"p",text:"Даже лучшее окно будет дуть и промерзать, если его неправильно установить. Правильный шаг крепления, пластиковые монтажные клинья вдоль рамы, качественное запенивание в несколько слоёв и паро-влагоизоляция монтажного шва — вот что определяет, будет ли окно тёплым десятилетиями. Подробно об этом мы рассказываем в разделе «Стандарты монтажа»."},{type:"h",text:"Итог"},{type:"p",text:"Для квартиры в Иркутске оптимально: профиль VEKA от 60 мм с замкнутым армированием, 4-5 камер, двухкамерный энергосберегающий стеклопакет, фурнитура MACO — и обязательно грамотный монтаж. Мы производим такие окна на собственном производстве и устанавливаем по технологии. Бесплатный замер поможет определить точные размеры и стоимость."}]},"brizer-ili-rekuperator-chto-vybrat":{date:"2026-07-29",title:"Бризер или рекуператор: что выбрать для квартиры в Иркутске — техническое сравнение с расчётами окупаемости",category:"Вентиляция",summary:"Для Иркутска выгоднее рекуператор: под ключ он стоит почти столько же (55 000 ₽ против 54 000 ₽ у бризера), но зимой тратит 756 ₽ в месяц вместо 3 780 ₽ и окупает разницу за 2 недели. Бризер берут при аллергии: у него фильтр HEPA H13 и он тише на 5 дБ.",content:[{type:"p",text:"«Что лучше — бризер или рекуператор?» — этот вопрос мы слышим от каждого второго клиента. Оба устройства подают свежий воздух в квартиру, но работают по-разному и стоят по-разному. Давайте разберём честно, с калькулятором в руках: что экономичнее, что эффективнее и что окупится быстрее в условиях Иркутска."},{type:"h",text:"Как работает бризер (приточная вентиляция)"},{type:"p",text:"Бризер — это компактное устройство, которое:"},{type:"list",items:["Забирает воздух с улицы через отверстие в стене (диаметр 132 мм)","Очищает его через фильтры (G4 + HEPA H13)","Подогревает электрическим ТЭНом (зимой)","Подаёт в комнату через вентилятор"]},{type:"p",text:"Проще говоря: бризер — это «умная форточка» с фильтрами и подогревом. Он подаёт свежий воздух, но НЕ забирает отработанный воздух из квартиры."},{type:"h",text:"Как работает рекуператор (приточно-вытяжная вентиляция)"},{type:"p",text:"Рекуператор — это устройство, которое:"},{type:"list",items:["Забирает свежий воздух с улицы","Одновременно забирает отработанный воздух из квартиры","Пропускает оба потока через теплообменник (рекуператор)","Тёплый вытяжной воздух подогревает холодный приточный (без смешивания)","Подаёт подогретый свежий воздух в комнату","Выбрасывает охлаждённый отработанный воздух на улицу"]},{type:"p",text:"Проще говоря: рекуператор — это «умная форточка с экономией». Он не только подаёт свежий воздух, но и экономит тепло, забирая его у выходящего воздуха."},{type:"h",text:"Главное отличие: рекуперация тепла"},{type:"p",text:"Это ключевой момент, который многие не понимают:"},{type:"h",text:"Бризер (без рекуперации)"},{type:"list",items:["Подаёт свежий воздух с улицы","Зимой воздух имеет температуру -20°C","ТЭН подогревает его до +20°C","Расход электричества на подогрев: 1.5-2 кВт/час","За месяц (24/7): 1.5 кВт × 24 часа × 30 дней = 1080 кВт","Стоимость (тариф 3.5 ₽/кВт): 1080 × 3.5 = 3 780 ₽/месяц"]},{type:"h",text:"Рекуператор (с рекуперацией тепла)"},{type:"list",items:["Подаёт свежий воздух с улицы","Зимой воздух имеет температуру -20°C","Рекуператор подогревает его теплом вытяжного воздуха до +15°C (КПД 80%)","ТЭН догревает только до +20°C (нужно всего 0.3 кВт)","Расход электричества на подогрев: 0.3 кВт/час","За месяц (24/7): 0.3 кВт × 24 часа × 30 дней = 216 кВт","Стоимость (тариф 3.5 ₽/кВт): 216 × 3.5 = 756 ₽/месяц"]},{type:"h",text:"Экономия"},{type:"list",items:["Бризер: 3 780 ₽/месяц","Рекуператор: 756 ₽/месяц","Экономия: 3 024 ₽/месяц (80%)"]},{type:"p",text:"За отопительный сезон в Иркутске (7 месяцев: октябрь-апрель) экономия составит:"},{type:"list",items:["3 024 ₽ × 7 месяцев = 21 168 ₽ за сезон"]},{type:"h",text:"Сравнение по параметрам"},{type:"p",text:"Для наглядности — таблица сравнения бризера Ballu OneAir ASP-100 и рекуператора Vakio Base:"},{type:"h",text:"Цена оборудования"},{type:"list",items:["Бризер Ballu OneAir ASP-100: 39 000 ₽","Рекуператор Vakio Base: 35 000 ₽","Разница: бризер дороже на 4 000 ₽"]},{type:"h",text:"Цена монтажа"},{type:"list",items:["Бризер: алмазное бурение 1 отверстия (132 мм) + монтаж = 15 000 ₽","Рекуператор: алмазное бурение 2 отверстий (132 мм каждое) + монтаж = 20 000 ₽","Разница: рекуператор дороже на 5 000 ₽"]},{type:"h",text:"Итоговая стоимость под ключ"},{type:"list",items:["Бризер: 39 000 + 15 000 = 54 000 ₽","Рекуператор: 35 000 + 20 000 = 55 000 ₽","Разница: рекуператор дороже на 1 000 ₽"]},{type:"h",text:"Расход электричества зимой"},{type:"list",items:["Бризер: 1.5 кВт/час = 3 780 ₽/месяц","Рекуператор: 0.3 кВт/час = 756 ₽/месяц","Разница: рекуператор экономит 3 024 ₽/месяц"]},{type:"h",text:"Окупаемость"},{type:"p",text:"Рекуператор дороже на 1 000 ₽, но экономит 21 168 ₽ за отопительный сезон."},{type:"list",items:["Переплата за рекуператор: 1 000 ₽","Экономия за сезон: 21 168 ₽","Окупаемость: 1 000 / 21 168 = 0.05 сезона = 2 недели"]},{type:"p",text:"Вывод: рекуператор окупается за 2 недели отопительного сезона. Дальше — чистая экономия."},{type:"h",text:"Другие параметры сравнения"},{type:"h",text:"Уровень шума"},{type:"list",items:["Бризер: 20-35 дБ (зависит от скорости вентилятора)","Рекуператор: 20-40 дБ (чуть громче из-за двух вентиляторов)","Разница: бризер тише на 5 дБ"]},{type:"h",text:"Фильтрация"},{type:"list",items:["Бризер: G4 + HEPA H13 (задерживает 99.95% пыли и пыльцы)","Рекуператор: G4 + F7 (задерживает 85-90% пыли)","Разница: бризер лучше фильтрует воздух"]},{type:"h",text:"Размеры"},{type:"list",items:["Бризер: компактный (50×30×15 см)","Рекуператор: больше (60×40×20 см)","Разница: бризер компактнее"]},{type:"h",text:"Сложность монтажа"},{type:"list",items:["Бризер: 1 отверстие в стене, монтаж за 2-3 часа","Рекуператор: 2 отверстия в стене, монтаж за 3-4 часа","Разница: бризер проще в монтаже"]},{type:"h",text:"Когда выбирать бризер"},{type:"p",text:"Бризер лучше, если:"},{type:"list",items:["У вас аллергия — нужна максимальная фильтрация (HEPA H13)","Важна тишина — бризер тише на 5 дБ","Мало места на стене — бризер компактнее","Не хотите второе отверстие в стене — бризер требует только одно отверстие","Живёте в регионе с короткой зимой — экономия на отоплении не критична"]},{type:"h",text:"Когда выбирать рекуператор"},{type:"p",text:"Рекуператор лучше, если:"},{type:"list",items:["Живёте в Иркутске — длинная зима, экономия на отоплении критична","Хотите экономить на электричестве — рекуператор окупается за 2 недели","Нужна не только приточная, но и вытяжная вентиляция","В квартире душно — рекуператор удаляет отработанный воздух","Планируете жить в квартире 10+ лет — экономия за 10 лет составит 211 680 ₽"]},{type:"h",text:"Расчёт экономии за 10 лет"},{type:"p",text:"Для квартиры в Иркутске, где отопительный сезон длится 7 месяцев:"},{type:"list",items:["Экономия за сезон: 21 168 ₽","Экономия за 10 лет: 21 168 × 10 = 211 680 ₽","Переплата за рекуператор: 1 000 ₽","ЧИСТАЯ ВЫГОДА: 210 680 ₽ за 10 лет"]},{type:"p",text:"Вывод: если вы живёте в Иркутске и планируете пользоваться вентиляцией 10+ лет, рекуператор сэкономит вам более 200 000 ₽ на электричестве."},{type:"h",text:"Наш профессиональный совет"},{type:"p",text:"За 10 лет работы мы установили более 500 бризеров и рекуператоров в Иркутске. Вот что мы заметили:"},{type:"list",items:["Клиенты с рекуператорами платят за электричество в 5 раз меньше","Клиенты с бризерами чаще жалуются на сухость воздуха (ТЭН сушит воздух)","Клиенты с рекуператорами довольны — воздух свежий, а счёт за свет не растёт","Через 3-5 лет владельцы бризеров часто звонят и спрашивают: «А можно поменять на рекуператор?»"]},{type:"p",text:"Для квартиры в Иркутске мы рекомендуем рекуператор. Да, он требует второе отверстие в стене. Да, он чуть больше. Но экономия 21 000 ₽ за сезон окупает все неудобства за 2 недели."},{type:"p",text:"Если у вас аллергия или важна максимальная тишина — берите бризер. Но будьте готовы платить 3 780 ₽/месяц за подогрев воздуха зимой."},{type:"p",text:"Все модели бризеров и рекуператоров есть в нашем каталоге с доставкой и монтажом в Иркутске. Бесплатный выезд инженера поможет подобрать оптимальный вариант под ваш бюджет. Звоните — подберём вентиляцию, которая сэкономит вам 200 000 ₽ за 10 лет."}]},"pochemu-ventilyatsiya-stoit-dorogo":{date:"2026-07-25",title:"Почему правильная вентиляция стоит дорого: разбираем по компонентам",category:"Вентиляция",summary:"Цена складывается из оборудования (40-50%), монтажа (25-35%), воздуховодов (15-20%) и проектирования (5-10%). Система для 3-комнатной квартиры 70 м² в Иркутске выходит около 139 500 ₽. Дешёвые предложения экономят на воздуховодах, шумоглушении и герметизации.",content:[{type:"p",text:"«Почему вентиляция стоит так дорого? Вот у соседа бризер за 25 тысяч, а вы предлагаете за 60 тысяч — в чём разница?» — этот вопрос мы слышим постоянно. Давайте разберём честно, из чего складывается стоимость правильной вентиляции и почему нельзя сделать дёшево и качественно."},{type:"h",text:"Главная ошибка: сравнивать только цену оборудования"},{type:"p",text:"Многие думают: «Куплю бризер подешевле, установлю сам — и всё». Но вентиляция — это не только прибор на стене. Это система, которая должна:"},{type:"list",items:["Подавать нужный объём воздуха (не меньше 30 м³/час на человека по нормам СП 60.13330)","Очищать воздух от пыли, пыльцы, запахов (фильтры класса F7 и выше)","Подогревать воздух зимой (иначе будет дуть холодом)","Работать тихо
