# ============================================================================
# IndexNow: уведомление поисковиков об обновлении страниц.
#
# ВАЖНО: этот файл — заготовка. GitHub включает его в работу только из
# .github/workflows/. Скопируйте его туда (GitHub → Add file → Create new
# file → путь .github/workflows/indexnow.yml → вставить содержимое) — у
# автоматики нет прав на запись в .github/workflows. Как только файл окажется
# на месте, workflow начнёт работать при каждом обновлении main.
#
# Зачем: после каждого изменения контента на main сообщаем Bing, Яндекс,
# Seznam, Naver и Yep, что страницы обновились, — они забирают их в индекс
# вне планового обхода. Google в IndexNow не участвует (ему нужен Search
# Console), но его ИИ-выдача и ChatGPT Search смотрят в том числе в индекс Bing.
#
# Что отправляется:
#   • push в main             — 15 ключевых страниц (услуги + статьи, ~1 запрос);
#   • workflow_dispatch, mode=all — все URL из public/sitemap.xml (324).
#
# Порядок важен: сначала Vercel публикует сборку, потом IndexNow. Поэтому перед
# отправкой workflow ждёт, пока файл ключа отдаёт 200 на проде.
# ============================================================================

name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "src/data/articlesData.ts"
      - "src/data/aiAnswers.ts"
      - "src/pages/**"
      - "src/components/ServicePage.tsx"
      - "api/page.ts"
      - "public/sitemap.xml"
      - "public/llms.txt"
      - "public/robots.txt"
  workflow_dispatch:
    inputs:
      mode:
        description: "key (15 страниц) или all (весь sitemap)"
        type: choice
        options: [key, all]
        default: key
        required: true
      dry_run:
        description: "Только показать список, не отправлять"
        type: boolean
        default: false

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  notify:
    name: Отправить уведомления
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ждём публикацию файла ключа: IndexNow вернёт 403, если файла на сайте нет.
      - name: Дождаться деплоя (файл ключа на проде)
        run: |
          url="https://www.vektor-komforta.ru/0f5329cd354566f96c0ccb6fdc4a86ac.txt"
          for i in $(seq 1 30); do
            status=$(curl -s -o /tmp/indexnow-key.txt -w '%{http_code}' "$url" || true)
            if [ "$status" = "200" ] && grep -q '0f5329cd354566f96c0ccb6fdc4a86ac' /tmp/indexnow-key.txt; then
              echo "Файл ключа опубликован (попытка $i)."
              exit 0
            fi
            echo "Попытка $i: HTTP $status — ждём 20 секунд…"
            sleep 20
          done
          echo "::error::Файл ключа не опубликован за 10 минут — IndexNow не отправлен."
          exit 1

      - name: Отправить IndexNow
        run: |
          MODE="${{ github.event.inputs.mode || 'key' }}"
          if [ "$MODE" = "all" ]; then FLAGS="--all --batch=1000"; else FLAGS=""; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          node scripts/indexnow.mjs $FLAGS
